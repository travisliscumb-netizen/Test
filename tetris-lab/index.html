<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1a0b3d">
<meta name="description" content="Prismfall: a modern falling-block puzzle game with an AI design laboratory that invents, playtests and refines new games.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Prismfall</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="src/styles.css">
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<main id="app" aria-live="polite">
  <div class="boot" id="boot">
    <div class="boot-logo" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <p>Loading Prismfall…</p>
  </div>
</main>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="toasts" role="status" aria-live="polite"></div>
<div id="modal-root"></div>
<noscript><p class="noscript">Prismfall needs JavaScript to run.</p></noscript>
<script type="module" src="src/main.js"></script>
</body>
</html>
