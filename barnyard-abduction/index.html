<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Barnyard">
<meta name="theme-color" content="#8fd3ff">
<meta name="description" content="Fly a flying saucer over a sunny farm and beam up the livestock before the farmer catches on.">
<title>Barnyard Abduction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1d2b3a; --ink-soft:#4a5b6e; --panel:rgba(255,255,255,.92); --panel-edge:rgba(29,43,58,.14);
  --beam:#35f0d0; --beam-deep:#0fb3a5; --alien:#8cf542; --danger:#ff5a4e; --warn:#ffb020; --gold:#ffc83d;
  --sky-top:#5fb8f5; --sky-bot:#c9ecff;
  --font:"Fredoka", ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#8fd3ff;color:var(--ink);font-family:var(--font);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font-family:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
.hidden{display:none!important}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10;opacity:0;transition:opacity .35s}
#hud.on{opacity:1}
#hud:not(.on) *{animation-play-state:paused!important}
#hud.scouting .top{opacity:.35}
.top{transition:opacity .25s;position:absolute;left:0;right:0;top:0;padding:calc(var(--sat) + 10px) calc(var(--sar) + 10px) 0 calc(var(--sal) + 10px);
  display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.chip{background:var(--panel);border-radius:18px;box-shadow:0 3px 0 var(--panel-edge),0 6px 18px rgba(20,40,60,.12)}
.lhs{display:flex;gap:8px;align-items:flex-start}
#pauseBtn{pointer-events:auto;width:44px;height:44px;border-radius:14px;display:grid;place-items:center}
#pauseBtn svg{width:18px;height:18px}
#scoreBox{padding:6px 12px 7px;min-width:92px}
#scoreVal{font-size:26px;font-weight:700;line-height:1;letter-spacing:.5px}
#scoreLbl{font-size:11px;font-weight:600;color:var(--ink-soft);letter-spacing:1.2px}
#combo{display:inline-block;margin-left:6px;font-size:14px;font-weight:700;color:#fff;background:linear-gradient(#ff9a3d,#ff6a2b);
  border-radius:10px;padding:1px 7px;vertical-align:4px;transform:scale(0);transition:transform .18s cubic-bezier(.3,1.8,.5,1)}
#combo.on{transform:scale(1)}
#shields{display:flex;gap:4px;margin-top:5px}
#shields i{width:14px;height:10px;border-radius:5px;background:linear-gradient(#6ff7e0,#1ec5b3);box-shadow:inset 0 -2px 0 rgba(0,0,0,.12);transition:background .2s,transform .2s}
#shields i.off{background:rgba(29,43,58,.16);box-shadow:none;transform:scale(.8)}
#shields.hit i:not(.off){animation:pipflash .45s}
@keyframes pipflash{30%{background:#fff}}
#goal{padding:6px 12px;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;max-width:52vw}
.g{display:flex;align-items:center;gap:3px;font-weight:700;font-size:18px;white-space:nowrap}
.g .e{font-size:20px;line-height:1}
.g.done{color:#16a34a}
.g.bump{animation:bump .35s}
@keyframes bump{40%{transform:scale(1.35)}}
#timer{width:58px;height:58px;position:relative;border-radius:50%;flex:none}
#timer svg{position:absolute;inset:0;transform:rotate(-90deg)}
#timer .trk{stroke:rgba(29,43,58,.12)}
#timerArc{stroke:#3fbf6f;transition:stroke .3s}
#timerTxt{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:19px}
#timer.low #timerArc{stroke:var(--danger)}
#timer.low{animation:tpulse 1s infinite}
#timer.mid #timerArc{stroke:var(--warn)}
#timer.inf #timerTxt{font-size:26px}
@keyframes tpulse{50%{transform:scale(1.08)}}

/* controls */
#stick{position:absolute;width:128px;height:128px;margin:-64px 0 0 -64px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.28),rgba(255,255,255,.12) 60%,rgba(255,255,255,.05));
  border:3px solid rgba(255,255,255,.55);opacity:0;transition:opacity .15s}
#stick.on{opacity:1}
#knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff,#dff9f4 45%,#9fe9dc);box-shadow:0 4px 12px rgba(0,0,0,.25)}
#stickGhost{position:absolute;left:calc(var(--sal) + 34px);bottom:calc(var(--sab) + 34px);width:104px;height:104px;border-radius:50%;
  border:3px dashed rgba(255,255,255,.65);display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;
  text-shadow:0 1px 3px rgba(0,0,0,.4);transition:opacity .3s;text-align:center;line-height:1.1}
#stickGhost.gone{opacity:0}
.rbtns{position:absolute;right:calc(var(--sar) + 18px);bottom:calc(var(--sab) + 22px);display:flex;flex-direction:column;align-items:flex-end;gap:14px}
.cbtn{pointer-events:auto;border-radius:50%;display:grid;place-items:center;touch-action:none;position:relative}
#scoutBtn{width:62px;height:62px;background:var(--panel);box-shadow:0 4px 0 var(--panel-edge),0 6px 16px rgba(20,40,60,.18);margin-right:6px}
#scoutBtn svg{width:30px;height:30px}
#scoutBtn span,#beamBtn span{position:absolute;bottom:-17px;font-size:11px;font-weight:700;letter-spacing:1px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.55)}
#beamBtn{width:104px;height:104px;background:radial-gradient(circle at 50% 35%,#b9fff3,var(--beam) 55%,var(--beam-deep));
  box-shadow:0 6px 0 #0a8b80,0 10px 24px rgba(10,120,110,.45);transition:transform .08s,box-shadow .08s}
#beamBtn svg{width:58px;height:58px}
#beamBtn.on,#scoutBtn.on{transform:translateY(4px)}
#beamBtn.on{box-shadow:0 2px 0 #0a8b80,0 0 0 8px rgba(53,240,208,.35),0 0 36px rgba(53,240,208,.9)}
#beamBtn.ready::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:4px solid #fff;animation:ready 1s infinite}
@keyframes ready{0%{opacity:.9;transform:scale(.92)}100%{opacity:0;transform:scale(1.18)}}

#hint{position:absolute;left:50%;bottom:calc(var(--sab) + 250px);transform:translateX(-50%) translateY(10px);opacity:0;
  background:rgba(29,43,58,.85);color:#fff;font-weight:600;font-size:17px;padding:9px 18px;border-radius:22px;width:max-content;
  transition:opacity .3s,transform .3s;max-width:min(92vw,520px);text-align:center;line-height:1.25}
@media (max-height:500px){#hint{bottom:calc(var(--sab) + 18px)}}
#hint.on{opacity:1;transform:translateX(-50%)}
#toast{position:absolute;left:0;right:0;top:calc(var(--sat) + 96px);text-align:center;font-weight:700;font-size:32px;color:#fff;padding:0 16px;
  -webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink);opacity:0;transform:scale(.6);transition:opacity .2s,transform .25s cubic-bezier(.3,1.7,.5,1)}
#toast.on{opacity:1;transform:scale(1)}
#toast.warn{color:#ffd0c9}
#pops{position:absolute;inset:0;overflow:hidden}
.pop{position:absolute;left:0;top:0;font-weight:700;font-size:22px;color:#fff;-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;
  text-shadow:0 3px 0 var(--ink);white-space:nowrap;will-change:transform,opacity}
.mark{position:absolute;left:0;top:0;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;display:grid;place-items:center;
  font-weight:700;font-size:24px;color:#fff;background:conic-gradient(var(--c,#ffb020) calc(var(--p,0)*1turn),rgba(29,43,58,.45) 0);
  box-shadow:0 3px 10px rgba(0,0,0,.25);will-change:transform}
.mark b{position:absolute;inset:4px;border-radius:50%;background:var(--c,#ffb020);display:grid;place-items:center;
  -webkit-text-stroke:0;text-shadow:0 2px 0 rgba(0,0,0,.2)}
.mark.alarm{--c:#ff4b3e;animation:alarm .5s infinite}
@keyframes alarm{50%{transform:var(--t) scale(1.18)}}
.edge{position:absolute;left:0;top:0;width:46px;height:46px;margin:-23px;border-radius:50%;background:var(--danger);display:grid;place-items:center;
  font-size:22px;box-shadow:0 3px 10px rgba(0,0,0,.3)}
.edge i{position:absolute;left:17px;top:15px;border-left:12px solid var(--danger);border-top:8px solid transparent;border-bottom:8px solid transparent;transform-origin:6px 8px}
.edge.finder{background:#fff;font-size:24px;box-shadow:0 3px 10px rgba(0,0,0,.22);animation:finder 1.2s infinite}
.edge.finder i{border-left-color:#fff}
@keyframes finder{50%{box-shadow:0 0 0 7px rgba(255,255,255,.45),0 3px 10px rgba(0,0,0,.22)}}
#vign{position:absolute;inset:0;box-shadow:inset 0 0 90px 10px rgba(255,70,60,.55);opacity:0;transition:opacity .5s}
#vign.on{opacity:1}
#splats{position:absolute;inset:0;overflow:hidden}
.splat{position:absolute;width:210px;height:210px;margin:-105px;opacity:.94;transition:opacity 1.6s ease-in,transform 1.6s ease-in}
.splat.fade{opacity:0;transform:translateY(40px) scale(1.05)}

/* ---------- menus ---------- */
.screen{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(var(--sat) + 18px) calc(var(--sar) + 18px) calc(var(--sab) + 18px) calc(var(--sal) + 18px);overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.screen.dim{background:linear-gradient(rgba(21,44,74,.55),rgba(21,44,74,.72));-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.logo{text-align:center;color:#fff;font-weight:700;line-height:.92;letter-spacing:1px;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;
  text-shadow:0 6px 0 var(--ink),0 12px 24px rgba(0,0,0,.25);margin:0}
.logo .l1{display:block;font-size:clamp(40px,11vw,76px);color:#ffd84a}
.logo .l2{display:block;font-size:clamp(46px,13vw,90px);color:var(--beam)}
.tag{color:#fff;font-weight:600;font-size:18px;margin:18px 0 26px;text-shadow:0 2px 6px rgba(0,0,0,.35);text-align:center}
.btn{pointer-events:auto;min-width:220px;font-size:24px;font-weight:700;padding:14px 26px;border-radius:20px;background:#fff;color:var(--ink);
  box-shadow:0 6px 0 #b9c6d3,0 12px 24px rgba(0,0,0,.18);transition:transform .08s,box-shadow .08s;margin:7px}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #b9c6d3}
.btn.go{background:linear-gradient(#ffe066,#ffc62b);box-shadow:0 6px 0 #d99a00,0 12px 24px rgba(0,0,0,.2)}
.btn.go:active{box-shadow:0 2px 0 #d99a00}
.btn.small{min-width:0;font-size:18px;padding:10px 18px}
.row{display:flex;flex-wrap:wrap;justify-content:center}
.card{background:#fff;border-radius:26px;padding:22px 20px 16px;max-width:430px;width:100%;box-shadow:0 8px 0 #b9c6d3,0 20px 40px rgba(0,0,0,.25);text-align:center}
.card h2{margin:0 0 4px;font-size:30px}
.card p{margin:0;color:var(--ink-soft);font-weight:500}
.icon-btn{position:absolute;top:calc(var(--sat) + 12px);right:calc(var(--sar) + 12px);width:48px;height:48px;border-radius:16px;background:rgba(255,255,255,.9);
  display:grid;place-items:center;font-size:22px;box-shadow:0 4px 0 rgba(0,0,0,.15);pointer-events:auto}
#levels{display:grid;gap:12px;width:100%;max-width:460px;margin-top:14px}
.lvl{display:flex;align-items:center;gap:14px;text-align:left;background:#fff;border-radius:22px;padding:12px 14px;box-shadow:0 5px 0 #b9c6d3;
  transition:transform .08s}
.lvl:active{transform:translateY(3px)}
.lvl .n{flex:none;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:26px;font-weight:700;color:#fff;
  background:linear-gradient(#58d68d,#27ae60);box-shadow:inset 0 -4px 0 rgba(0,0,0,.15)}
.lvl.sunset .n{background:linear-gradient(#ffb35c,#f0643a)}
.lvl.free .n{background:linear-gradient(#7fdcff,#3b9df0)}
.lvl .t{flex:1;min-width:0}
.lvl .t b{display:block;font-size:20px}
.lvl .t small{display:block;color:var(--ink-soft);font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvl .s{flex:none;font-size:18px;letter-spacing:-2px}
.lvl.locked{opacity:.55;filter:grayscale(.8)}
.lvl.locked .n{background:linear-gradient(#b8c2cc,#8d99a6)}
.stars{font-size:52px;letter-spacing:4px;margin:10px 0 6px}
.stars i{display:inline-block;font-style:normal;filter:grayscale(1) opacity(.3);transform:scale(.5);transition:transform .35s cubic-bezier(.3,1.8,.5,1),filter .2s}
.stars i.on{filter:none;transform:scale(1)}
.why{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:12px}
.why span.on{color:#16a34a}
.brk{margin:8px 0 14px;text-align:left;font-weight:600;font-size:16px}
.brk div{display:flex;justify-content:space-between;padding:5px 2px;border-bottom:1px dashed #dde4ea}
.brk div.tot{border:0;font-size:22px;padding-top:9px}
.brief{font-size:40px;margin:10px 0 6px;letter-spacing:4px}
#loading{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:linear-gradient(var(--sky-top),var(--sky-bot));
  color:#fff;font-weight:700;font-size:22px;transition:opacity .5s;text-shadow:0 2px 6px rgba(0,0,0,.3)}
#loading.gone{opacity:0;pointer-events:none}
#rotate{display:none}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div id="vign"></div>
  <div id="splats"></div>
  <div id="pops"></div>
  <div class="top">
    <div class="lhs">
      <button id="pauseBtn" class="chip" aria-label="Pause">
        <svg viewBox="0 0 20 20"><rect x="3" y="2" width="5" height="16" rx="2" fill="#1d2b3a"/><rect x="12" y="2" width="5" height="16" rx="2" fill="#1d2b3a"/></svg>
      </button>
      <div id="scoreBox" class="chip">
        <div id="scoreLbl">SCORE</div>
        <div><span id="scoreVal">0</span><span id="combo">×2</span></div>
        <div id="shields"></div>
      </div>
    </div>
    <div id="goal" class="chip"></div>
    <div id="timer" class="chip">
      <svg viewBox="0 0 58 58"><circle class="trk" cx="29" cy="29" r="24" fill="none" stroke-width="6"/>
        <circle id="timerArc" cx="29" cy="29" r="24" fill="none" stroke-width="6" stroke-linecap="round" stroke-dasharray="150.8" stroke-dashoffset="0"/></svg>
      <div id="timerTxt">0</div>
    </div>
  </div>
  <div id="stickGhost">drag<br>to fly</div>
  <div id="stick"><div id="knob"></div></div>
  <div class="rbtns">
    <button id="scoutBtn" class="cbtn" aria-label="Scout view">
      <svg viewBox="0 0 32 32" fill="none" stroke="#1d2b3a" stroke-width="2.6" stroke-linejoin="round"><path d="M4 8l7-3 10 3 7-3v19l-7 3-10-3-7 3z"/><path d="M11 5v19M21 8v19"/></svg>
      <span>SCOUT</span>
    </button>
    <button id="beamBtn" class="cbtn" aria-label="Tractor beam">
      <svg viewBox="0 0 64 64"><path d="M22 30 L12 58 H52 L42 30Z" fill="rgba(255,255,255,.55)"/><ellipse cx="32" cy="24" rx="24" ry="7" fill="#1d2b3a"/>
        <path d="M20 22c0-7 5-12 12-12s12 5 12 12" fill="#1d2b3a"/><ellipse cx="32" cy="24" rx="17" ry="3" fill="#35f0d0"/></svg>
      <span>BEAM</span>
    </button>
  </div>
  <div id="finder" class="edge finder hidden"><span></span><i></i></div>
  <div id="hint"></div>
  <div id="toast"></div>
</div>

<!-- title -->
<div id="scrTitle" class="screen hidden">
  <button class="icon-btn" data-act="mute" aria-label="Sound">🔊</button>
  <h1 class="logo"><span class="l1">BARNYARD</span><span class="l2">ABDUCTION</span></h1>
  <div class="tag">Beam up the farm. Dodge the tomatoes.</div>
  <button class="btn go" data-act="levels">PLAY</button>
</div>

<!-- level select -->
<div id="scrLevels" class="screen dim hidden">
  <button class="icon-btn" data-act="title" aria-label="Back">✕</button>
  <h2 class="logo" style="font-size:40px;-webkit-text-stroke:2px var(--ink);text-shadow:0 4px 0 var(--ink)">Pick a Mission</h2>
  <div id="levels"></div>
</div>

<!-- briefing -->
<div id="scrBrief" class="screen dim hidden">
  <div class="card">
    <p id="briefNum" style="font-weight:700;letter-spacing:2px;font-size:13px">MISSION 1</p>
    <h2 id="briefName">First Contact</h2>
    <div id="briefIcons" class="brief"></div>
    <p id="briefText"></p>
    <div class="row" style="margin-top:14px"><button class="btn go" data-act="start">GO!</button></div>
  </div>
</div>

<!-- pause -->
<div id="scrPause" class="screen dim hidden">
  <div class="card">
    <h2>Paused</h2>
    <p id="pauseGoal"></p>
    <div class="row" style="margin-top:14px;flex-direction:column;align-items:center">
      <button class="btn go" data-act="resume">RESUME</button>
      <button class="btn small" data-act="restart">Restart</button>
      <button class="btn small" data-act="levels">Missions</button>
      <button class="btn small" data-act="mute" id="pauseMute">Sound: On</button>
    </div>
  </div>
</div>

<!-- results -->
<div id="scrResult" class="screen dim hidden">
  <div class="card">
    <h2 id="resTitle">Mission Complete!</h2>
    <p id="resSub"></p>
    <div class="stars" id="resStars"><i>⭐</i><i>⭐</i><i>⭐</i></div>
    <div class="why" id="resWhy"></div>
    <div class="brk" id="resBrk"></div>
    <div class="row">
      <button class="btn small" data-act="levels">Missions</button>
      <button class="btn small" data-act="restart">Retry</button>
      <button class="btn go small" data-act="next" id="resNext">Next ▶</button>
    </div>
  </div>
</div>

<div id="loading">Warming up the saucer…</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>window.THREE||document.write('<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"><\/script>')</script>
<script>
'use strict';
(function () {
if (!window.THREE) {
  document.getElementById('loading').textContent = 'Could not load the 3D engine. Check your connection and reload.';
  return;
}
const T = THREE;
const DEG = Math.PI / 180;
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const damp = (a, b, rate, dt) => lerp(a, b, 1 - Math.exp(-rate * dt));
const smooth = t => t * t * (3 - 2 * t);
const angWrap = a => { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; };

/* ==========================================================================
   1. TUNING — every gameplay number lives here, nowhere else.
   ========================================================================== */
const TUNE = {
  ufo:   { cruiseAlt: 13, beamAlt: 8.5, maxSpeed: 27, response: 4.2, beamSpeedMul: .55, radius: 4.6,
           tiltMax: .30, bob: .3 },
  beam:  { acqRadius: 7.5, pullXZ: 5, captureGap: 2.2 },
  shields: { max: 5, regenDelay: 7, regenEvery: 11, iframes: 1.3 },
  combo: { window: 5.5 },
  farmer:{ sight: 46, sightBeam: 68, rise: .5, riseBeam: 1.05, fall: .22, walk: 4.2, run: 9,
           throwRange: 44, windup: .75, tomatoSpeed: 30, gravity: 34, hitRadius: 5.2, awayTime: 15 },
  cam:   { pitch: 47 * DEG, scoutPitch: 74 * DEG, lead: .5, follow: 4.5, scoutRate: 5, margin: .90 },
  score: { timeBonus: 5, farmer: 150 },
};

const SPECIES = {
  chicken: { name: 'Chicken', emoji: '🐔', pts: 10, lift: .55, walk: 3.4, flee: 9.5, fear: 15, h: 1.9, r: .9,  voice: 'cluck' },

/* ==========================================================================
   3. SAVE — autosave to localStorage; every access guarded (private mode,
      blocked storage and quota errors must never break the game).
   ========================================================================== */
const SAVE_KEY = 'barnyard-abduction.v2';
const Save = {
  data: { levels: {}, muted: false },
  load() {
    try {
      const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
      if (s && typeof s === 'object' && s.levels && typeof s.levels === 'object') {
        this.data = { levels: {}, muted: !!s.muted };
        for (const [k, v] of Object.entries(s.levels)) {
          if (v && typeof v === 'object') this.data.levels[k] = { stars: clamp(v.stars | 0, 0, 3), best: Math.max(0, v.best | 0) };
        }
      }
    } catch (e) { /* corrupt or unavailable: start fresh */ }
  },
  write() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(this.data)); } catch (e) { /* ignore */ } },
  level(id) { return this.data.levels[id] || { stars: 0, best: 0 }; },
  record(id, stars, score) {
    const cur = this.level(id);
    this.data.levels[id] = { stars: Math.max(cur.stars, stars), best: Math.max(cur.best, score) };

  },

    if (filter) { const bq = c.createBiquadFilter(); bq.type = filter; bq.frequency.value = q || 1000; bq.Q.value = 4; o.connect(bq); node = bq; }

  noise(dur, { vol = .3, freq = 1200, type = 'lowpass', at = 0, dest = null, q = 1 } = {}) {
    if (!this.ctx) return;

    const s = c.createBufferSource(); s.buffer = this.noiseBuf;
    const f = c.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
    const g = c.createGain(); this.env(g, t, .005, vol, dur);
    s.connect(f); f.connect(g); g.connect(dest || this.sfx);
    s.start(t, Math.random() * .5); s.stop(t + dur + .05);
  },
  voice(kind) {
    switch (kind) {
      case 'moo':   this.tone(150, .8, { type: 'sawtooth', to: 105, vol: .22, attack: .12, filter: 'lowpass', q: 700, vib: 4, vibRate: 5 }); break;
      case 'oink':  this.tone(260, .12, { type: 'square', to: 190, vol: .14, filter: 'lowpass', q: 900 });
                    this.tone(250, .12, { type: 'square', to: 180, vol: .14, filter: 'lowpass', q: 900, at: .16 }); break;
      case 'baa':   this.tone(390, .55, { type: 'sawtooth', vol: .15, attack: .05, filter: 'bandpass', q: 1300, vib: 26, vibRate: 8 }); break;
      case 'bleat': this.tone(520, .45, { type: 'sawtooth', vol: .14, attack: .04, filter: 'bandpass', q: 1600, vib: 40, vibRate: 12 }); break;
      case 'cluck': for (let i = 0; i < 3; i++) this.tone(900 - i * 60, .07, { type: 'triangle', to: 500, vol: .18, at: i * .09 }); break;
      case 'neigh': this.tone(700, .7, { type: 'sawtooth', to: 420, vol: .13, filter: 'bandpass', q: 1400, vib: 70, vibRate: 17 }); break;
      case 'hey':   this.tone(330, .22, { type: 'square', to: 250, vol: .12, filter: 'lowpass', q: 1200 });

  capture(kind) {
    [523, 659, 784, 1046].forEach((f, i) => this.tone(f, .14, { type: 'triangle', vol: .16, at: i * .055 }));

  grab() { this.tone(300, .2, { type: 'sine', to: 620, vol: .15 }); },
  drop() { this.tone(500, .35, { type: 'triangle', to: 140, vol: .18 }); },
  whistle() { this.tone(1500, .55, { type: 'sine', to: 600, vol: .1 }); },
  splat() { this.noise(.28, { vol: .5, freq: 900 }); this.tone(110, .18, { type: 'sine', to: 50, vol: .4 }); },
  thud() { this.noise(.12, { vol: .25, freq: 400 }); },
  alert(level) {

  },
  click() { this.tone(620, .06, { type: 'triangle', vol: .15 }); },
  combo(n) { this.tone(700 + n * 90, .12, { type: 'square', vol: .07 }); this.tone(900 + n * 110, .16, { type: 'square', vol: .07, at: .08 }); },
  win() { [523, 659, 784, 659, 784, 1046].forEach((f, i) => this.tone(f, .22, { type: 'triangle', vol: .2, at: i * .12 })); },
  lose() { [392, 349, 311, 262].forEach((f, i) => this.tone(f, .3, { type: 'triangle', vol: .2, at: i * .2 })); },
  shieldUp() { this.tone(500, .15, { type: 'sine', to: 900, vol: .08 }); },
  setBeam(power, lifting, prog) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    this.humGain.gain.setTargetAtTime(power * .11, t, .05);
    this.liftGain.gain.setTargetAtTime(lifting ? .05 : 0, t, .05);
    this.liftOsc.frequency.setTargetAtTime(260 + prog * 700, t, .05);

  startMusic() { this.musicOn = true; if (this.ctx) this.nextT = this.ctx.currentTime + .1; },
  stopMusic() { this.musicOn = false; },
  tick() {
    if (!this.ctx || !this.musicOn || this.ctx.state !== 'running') return;
    const c = this.ctx;
    const bpm = 108 + this.danger * 30, st = 60 / bpm / 4;
    if (this.nextT < c.currentTime - .5) this.nextT = c.currentTime + .05; // resumed after a stall
    while (this.nextT < c.currentTime + .12) { this.playStep(this.step, this.nextT, st); this.nextT += st; this.step = (this.step + 1) % 64; }
  },
  playStep(s, t, st) {
    const c = this.ctx, bar = Math.floor(s / 16), i = s % 16;
    const roots = [130.8, 110, 87.3, 98]; // C  Am  F  G
    const chords = [[261.6, 329.6, 392], [220, 261.6, 329.6], [174.6, 220, 261.6], [196, 246.9, 293.7]];
    const mel = [659, 0, 587, 523, 0, 587, 659, 0, 784, 0, 659, 0, 587, 0, 523, 0,
                 523, 0, 440, 523, 0, 587, 523, 0, 440, 0, 392, 0, 440, 0, 0, 0,
                 440, 0, 523, 440, 0, 349, 440, 0, 523, 0, 587, 0, 523, 0, 440, 0,
                 392, 0, 494, 587, 0, 494, 392, 0, 587, 0, 659, 0, 587, 0, 494, 0];
    const at = t - c.currentTime;
    const d = this.danger;
    if (i % 4 === 0) this.tone(roots[bar] * (i === 8 ? 1.5 : 1), st * 3, { type: 'triangle', vol: .5, at, dest: this.mus });
    if (i === 2 || i === 6 || i === 10 || i === 14) chords[bar].forEach(f => this.tone(f, st * 1.5, { type: 'square', vol: .045, at, dest: this.mus, filter: 'lowpass', q: 1800 }));
    if (mel[s]) this.tone(mel[s] * (d > .5 ? 1 : 1), st * 1.8, { type: 'triangle', vol: .13, at, dest: this.mus });
    if (d > .05) {
      if (i % 4 === 0) this.tone(120, .12, { type: 'sine', to: 45, vol: .55 * d, at, dest: this.mus });
      if (i % 2 === 1) this.noise(.04, { vol: .12 * d, freq: 7000, type: 'highpass', at, dest: this.mus });
      if (i === 4 || i === 12) this.noise(.1, { vol: .22 * d, freq: 1800, type: 'bandpass', at, dest: this.mus });

// Drifting cloud shadows on the ground: cheap, and makes a flat field feel alive.
function withCloudShadows(mat) {
  mat.onBeforeCompile = sh => {
    sh.uniforms.uCloud = { value: TEX.cloud };

// Foliage: cloud shadows + occlusion dither. Canopy pixels close to the camera

// saucer or what you are trying to beam (Controls §2 "minimal obstruction").
function foliageMat() {
  const mat = lambert();
  mat.onBeforeCompile = sh => {
    sh.uniforms.uCloud = { value: TEX.cloud }; sh.uniforms.uCloudOff = CLOUD_OFF; sh.uniforms.uUfo = UFO_POS; sh.uniforms.uCam = CAM_POS;
    sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nvarying vec3 vFW;')
      .replace('#include <begin_vertex>', `#include <begin_vertex>
        vec4 fw = vec4(transformed, 1.0);
        #ifdef USE_INSTANCING

        #endif
        vFW = (modelMatrix * fw).xyz;`);
    sh.fragmentShader = sh.fragmentShader.replace('#include <common>', '#include <common>\nuniform sampler2D uCloud; uniform vec2 uCloudOff; uniform vec3 uUfo, uCam; varying vec3 vFW;')
      .replace('#include <clipping_planes_fragment>', `#include <clipping_planes_fragment>
        vec3 ab = uUfo - uCam;
        float tt = clamp(dot(vFW - uCam, ab) / max(dot(ab, ab), 1.0), 0.0, 1.0);
        float fade = (1.0 - smoothstep(6.0, 11.0, length(vFW - (uCam + ab * tt)))) * step(tt, 0.96) * step(3.0, vFW.y);
        vec3 ag = vec3(uUfo.x, 0.0, uUfo.z) - uCam; // second line of sight: the beam's ground spot
        float tg = clamp(dot(vFW - uCam, ag) / max(dot(ag, ag), 1.0), 0.0, 1.0);

        fade = max(fade, (1.0 - smoothstep(24.0, 40.0, length(vFW - uCam))) * step(3.0, vFW.y));

      .replace('#include <dithering_fragment>', '#include <dithering_fragment>\ngl_FragColor.rgb *= 1.0 - 0.2 * smoothstep(.25,.75,texture2D(uCloud, vFW.xz * 0.0021 + uCloudOff).r);');
  };

}

function seScale(x, z, a = FN.a, b = FN.b) { return Math.pow(Math.pow(Math.abs(x) / a, FN.n) + Math.pow(Math.abs(z) / b, FN.n), 1 / FN.n); }
function insidePlay(x, z, inset = 0) { return seScale(x, z, MAP.play.a - inset, MAP.play.b - inset) <= 1; }

function smin(a, b, k) { const h = clamp(.5 + .5 * (b - a) / k, 0, 1); return lerp(b, a, h) - k * h * (1 - h); }
function pondSdf(x, z) {
  let d = 1e9;
  for (const [ox, oz, rx, rz] of MAP.pond.lobes) {
    const px = (x - MAP.pond.x - ox) / rx, pz = (z - MAP.pond.z - oz) / rz;
    d = smin(d, (Math.hypot(px, pz) - 1) * Math.min(rx, rz), 5);
  }

}

/* ---------- road sampling (Catmull-Rom) with a spatial hash for fast distance ---------- */
const ROAD_PTS = [];
const ROAD_GRID = new Map();
function roadKey(x, z) { return (Math.floor(x / 12) + 500) * 10000 + (Math.floor(z / 12) + 500); }
for (const rd of MAP.roads) {
  const curve = new T.CatmullRomCurve3(rd.pts.map(p => new T.Vector3(p[0], 0, p[1])), false, 'centripetal');
  const n = Math.ceil(curve.getLength() / 1.2);
  rd.curve = curve;
  for (let i = 0; i <= n; i++) {
    const p = curve.getPointAt(i / n);
    const e = { x: p.x, z: p.z, w: rd.w };
    ROAD_PTS.push(e);
    const k = roadKey(p.x, p.z);
    if (!ROAD_GRID.has(k)) ROAD_GRID.set(k, []);
    ROAD_GRID.get(k).push(e);
  }
}
function roadInfo(x, z) { // → { d: distance to centreline, w: road width }
  let best = 1e9, w = 0;
  const cx = Math.floor(x / 12), cz = Math.floor(z / 12);
  for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++) {
    const list = ROAD_GRID.get((cx + i + 500) * 10000 + (cz + j + 500));
    if (!list) continue;
    for (const p of list) { const d = Math.hypot(p.x - x, p.z - z); if (d < best) { best = d; w = p.w; } }
  }
  return { d: best, w };
}

const HUB_SHAPE = (x, z) => { // soft irregular gravel yard between barn, house and shed
  const dx = (x - MAP.hub.x) / 42, dz = (z - MAP.hub.z) / 36;
  return Math.hypot(dx, dz) + (fbm(x * .05, z * .05) - .5) * .35;

function terrainColor(x, z, out) {
  const n = fbm(x * .018 + 3, z * .018 - 7), n2 = vnoise(x * .09, z * .09);
  out.copy(PAL.grassA).lerp(PAL.grassB, smooth(clamp(n * 1.4 - .2, 0, 1)));
  out.lerp(PAL.grassC, clamp((n2 - .6) * 1.6, 0, 1) * .6);
  // front lawn: a touch brighter and cleaner (spec palette §11)
  const lawn = 1 - smooth(clamp((Math.hypot((x - MAP.farmhouse.x) / 34, (z - MAP.farmhouse.z - 6) / 26) - .7) / .5, 0, 1));
  out.lerp(PAL.yard, lawn * .7);
  // grove: darker, leaf-littered
  const gr = 1 - smooth(clamp((Math.hypot(x - MAP.grove.x, z - MAP.grove.z) - 30) / 30, 0, 1));
  out.lerp(PAL.leaf, gr * .55);
  // hub gravel yard
  const hub = 1 - smooth(clamp((HUB_SHAPE(x, z) - .75) / .3, 0, 1));
  out.lerp(mixC(PAL.gravel, PAL.dirt, n2), hub * .92);
  // pig pen mud
  const pn = MAP.pen, pm = Math.max(Math.abs(x - pn.x) / (pn.w / 2), Math.abs(z - pn.z) / (pn.d / 2)) + (n2 - .5) * .25;
  out.lerp(PAL.mud, (1 - smooth(clamp((pm - .8) / .3, 0, 1))) * .95);

  const f = MAP.field, fm = Math.max(Math.abs(x - f.x) / (f.w / 2), Math.abs(z - f.z) / (f.d / 2)) + (n2 - .5) * .06;
  out.lerp(PAL.soil, (1 - smooth(clamp((fm - .97) / .09, 0, 1))) * .9);

  const pd = pondSdf(x, z);
  if (pd < 8) {
    out.lerp(PAL.sand, (1 - smooth(clamp(pd / 7, 0, 1))) * .85);
    if (pd < 0) out.lerp(PAL.pondBed, smooth(clamp(-pd / 3, 0, 1)));
  }
  // roads with soft shoulders and two wheel ruts
  const ri = roadInfo(x, z);
  if (ri.d < ri.w) {
    const hw = ri.w / 2;
    const k = 1 - smooth(clamp((ri.d - (hw - 1.3)) / 2.6, 0, 1));
    const road = mixC(PAL.dirt, PAL.gravel, vnoise(x * .3, z * .3) * .5);
    const rut = Math.exp(-Math.pow((ri.d - hw * .45) / .45, 2)) * .5;
    road.lerp(PAL.dirtDark, rut);
    out.lerp(road, k);
  }
  // mowed strip just inside the pickets: makes the boundary read from the air
  const s = seScale(x, z);
  out.lerp(PAL.mowed, (1 - smooth(clamp(Math.abs(s - .975) / .018, 0, 1))) * .55);
  // outside the fence: sunnier meadow
  if (s > .98) out.lerp(PAL.meadow, clamp((s - .98) * 8, 0, .5));
  return out;
}
function isGrassy(x, z) {
  if (!insidePlay(x, z, 3)) return false;
  if (roadInfo(x, z).d < 5) return false;
  if (HUB_SHAPE(x, z) < 1.05) return false;
  if (pondSdf(x, z) < 3) return false;
  const f = MAP.field; if (Math.abs(x - f.x) < f.w / 2 + 3 && Math.abs(z - f.z) < f.d / 2 + 3) return false;
  const pn = MAP.pen; if (Math.abs(x - pn.x) < pn.w / 2 + 2 && Math.abs(z - pn.z) < pn.d / 2 + 2) return false;
  for (const c of MAP.colliders) if (Math.abs(x - c.x) < c.hw + 3 && Math.abs(z - c.z) < c.hd + 3) return false;
  return true;
}

function buildTerrain() {
  // inner, finely painted ground (roads need ~2 unit resolution to read cleanly)
  const S = 470, SEG = 235;
  const g = new T.PlaneGeometry(S, S, SEG, SEG);
  g.rotateX(-Math.PI / 2);
  const P = g.attributes.position, col = new Float32Array(P.count * 3), c = new T.Color();
  for (let i = 0; i < P.count; i++) {
    const x = P.getX(i), z = P.getZ(i);
    terrainColor(x, z, c);
    col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
    if (pondSdf(x, z) < 0) P.setY(i, Math.max(-1.2, pondSdf(x, z) * .25));
  }
  g.setAttribute('color', new T.BufferAttribute(col, 3));
  scaleUV(g, S / 14, S / 14);
  g.computeVertexNormals();
  const inner = new T.Mesh(g, MAT.ground);
  inner.receiveShadow = true;
  world.add(inner);

  // outer countryside: rolling hills + patchwork fields for scout/title depth
  const S2 = 3200, SEG2 = 110;
  const g2 = new T.PlaneGeometry(S2, S2, SEG2, SEG2);
  g2.rotateX(-Math.PI / 2);
  const P2 = g2.attributes.position, col2 = new Float32Array(P2.count * 3);
  const crops = ['#9ccc5c', '#b9d86a', '#e2c86b', '#7fbf4f', '#c7a36a', '#a8d46a'].map(C);
  for (let i = 0; i < P2.count; i++) {
    const x = P2.getX(i), z = P2.getZ(i);
    const s = seScale(x, z);
    const out = clamp((s - 1.12) / .5, 0, 1);
    P2.setY(i, -.08 + smooth(out) * (fbm(x * .004, z * .004) * 60 - 8) * clamp((Math.hypot(x, z) - 250) / 400, 0, 1));
    terrainColor(x, z, c);
    const cell = Math.floor((x + 13) / 95) * 31 + Math.floor((z - 7) / 80) * 17;
    const crop = crops[Math.abs(cell) % crops.length];
    c.lerp(crop, clamp((Math.hypot(x, z) - 330) / 120, 0, 1) * .8);
    col2[i * 3] = c.r; col2[i * 3 + 1] = c.g; col2[i * 3 + 2] = c.b;
  }
  g2.setAttribute('color', new T.BufferAttribute(col2, 3));
  scaleUV(g2, S2 / 14, S2 / 14);
  g2.computeVertexNormals();
  const outer = new T.Mesh(g2, MAT.ground);
  outer.position.y = -.12;
  outer.receiveShadow = true;
  world.add(outer);
}

/* ---------- picket fence (instanced) ---------- */
function fencePoint(t) {
  const c = Math.cos(t), s = Math.sin(t), e = 2 / FN.n;
  return [FN.a * Math.sign(c) * Math.pow(Math.abs(c), e), FN.b * Math.sign(s) * Math.pow(Math.abs(s), e)];
}
const FENCE_SAMPLES = []; // used by the scout-framing solver
function buildFence() {
  // resample the superellipse by arc length
  const dense = [];
  for (let i = 0; i <= 4000; i++) dense.push(fencePoint(i / 4000 * Math.PI * 2));
  const cum = [0];
  for (let i = 1; i < dense.length; i++) cum.push(cum[i - 1] + Math.hypot(dense[i][0] - dense[i - 1][0], dense[i][1] - dense[i - 1][1]));
  const L = cum[cum.length - 1];
  const at = d => {
    d = ((d % L) + L) % L;
    let lo = 0, hi = cum.length - 1;
    while (hi - lo > 1) { const m = (lo + hi) >> 1; if (cum[m] < d) lo = m; else hi = m; }
    const t = (d - cum[lo]) / (cum[hi] - cum[lo] || 1);
    return [lerp(dense[lo][0], dense[hi][0], t), lerp(dense[lo][1], dense[hi][1], t)];
  };
  for (let i = 0; i < 96; i++) FENCE_SAMPLES.push(at(i / 96 * L));
  const gate = MAP.fence.gate;
  const inGate = (x, z) => z < 0 && Math.abs(x - gate.x) < gate.width / 2;

  // picket: pointed board
  const pk = new T.Shape();
  pk.moveTo(-.19, 0); pk.lineTo(.19, 0); pk.lineTo(.19, 1.45); pk.lineTo(0, 1.75); pk.lineTo(-.19, 1.45); pk.closePath();
  const pkGeo = new T.ExtrudeGeometry(pk, { depth: .12, bevelEnabled: false });
  pkGeo.translate(0, 0, -.06);
  const whiteM = new T.MeshLambertMaterial({ color: C('#fbfbf6') });
  const SP = .62, count = Math.floor(L / SP);
  const pickets = new T.InstancedMesh(pkGeo, whiteM, count);
  // rails/posts are instanced ~750×: plain boxes (12 tris) — bevels are invisible at this size
  const railGeo = new T.BoxGeometry(1, .16, .12);
  const postGeo = new T.CylinderGeometry(.2, .22, 2.1, 6);
  const POST = 6.2, np = Math.floor(L / POST);
  const rails = new T.InstancedMesh(railGeo, whiteM, np * 2), posts = new T.InstancedMesh(postGeo, whiteM, np);
  const dummy = new T.Object3D();
  let pi = 0;
  for (let i = 0; i < count; i++) {
    const [x, z] = at(i * SP), [x2, z2] = at(i * SP + .3);
    if (inGate(x, z)) continue;
    dummy.position.set(x, 0, z);
    dummy.rotation.set(0, Math.atan2(-(z2 - z), x2 - x), 0);
    dummy.scale.set(1, .92 + hash2(i, 3) * .1, 1);
    dummy.updateMatrix(); pickets.setMatrixAt(pi++, dummy.matrix);
  }
  pickets.count = pi;
  let ri = 0, poi = 0;
  for (let i = 0; i < np; i++) {
    const [x, z] = at(i * POST), [x2, z2] = at((i + 1) * POST);
    const mx = (x + x2) / 2, mz = (z + z2) / 2, ang = Math.atan2(-(z2 - z), x2 - x), len = Math.hypot(x2 - x, z2 - z);
    if (!inGate(x, z)) { dummy.position.set(x, 1.05, z); dummy.rotation.set(0, ang, 0); dummy.scale.set(1, 1, 1); dummy.updateMatrix(); posts.setMatrixAt(poi++, dummy.matrix); }
    if (inGate(x, z) || inGate(x2, z2) || inGate(mx, mz)) continue;
    for (const y of [.45, 1.15]) {
      dummy.position.set(mx, y, mz); dummy.rotation.set(0, ang, 0); dummy.scale.set(len, 1, 1);
      dummy.translateZ(.1); dummy.updateMatrix(); rails.setMatrixAt(ri++, dummy.matrix);
    }
  }
  rails.count = ri; posts.count = poi;
  for (const m of [pickets, rails, posts]) { m.castShadow = true; m.receiveShadow = true; m.frustumCulled = false; world.add(m); }

  // gate: two big posts with a swung-open double gate, plus a mailbox outside
  const gz = -Math.pow(1 - Math.pow(Math.abs(gate.x) / FN.a, FN.n), 1 / FN.n) * FN.b;
  const gw = gate.width / 2;
  for (const sx of [-1, 1]) {
    K.vc.add(rbox(.7, 3, .7, .12), '#ffffff', [gate.x + sx * gw, 1.5, gz]);
    K.vc.add(GEO.sph, '#ffffff', [gate.x + sx * gw, 3.1, gz], .42);
    K.vc.push([gate.x + sx * gw, 0, gz], [0, sx * (Math.PI / 2 - .35), 0]);
    const leaf = gw - .5;
    for (let k = 0; k < 7; k++) K.vc.add(GEO.box, '#fbfbf6', [-sx * (.4 + k * leaf / 7), .95, 0], [.3, 1.5, .09]);
    K.vc.add(GEO.box, '#fbfbf6', [-sx * leaf / 2, .5, .08], [leaf, .15, .09]);
    K.vc.add(GEO.box, '#fbfbf6', [-sx * leaf / 2, 1.35, .08], [leaf, .15, .09]);
    K.vc.add(GEO.box, '#fbfbf6', [-sx * leaf / 2, .92, .1], [Math.hypot(leaf, .85), .13, .08], [0, 0, sx * Math.atan2(.85, leaf)]);
    K.vc.pop();
  }
  // mailbox
  K.vc.add(GEO.box, '#8a5a36', [gate.x + gw + 3, .8, gz - 3], [.25, 1.6, .25]);
  K.vc.add(rbox(.8, .75, 1.4, .3), '#2f6fb3', [gate.x + gw + 3, 1.9, gz - 3]);
  K.vc.add(GEO.box, '#e0362f', [gate.x + gw + 3.45, 2.2, gz - 3.2], [.06, .5, .12]);
}

  K.vc.pop(); K.gloss.pop();

/* ---------- plowed field (real furrow geometry) ---------- */
function buildField() {
  const f = MAP.field, SP = 2.6;
  const g = new T.PlaneGeometry(f.w, f.d, 36, Math.round(f.d / SP * 4));
  g.rotateX(-Math.PI / 2);
  const P = g.attributes.position, col = new Float32Array(P.count * 3);
  const ridge = C('#a8764a'), trough = C('#6a4426'), stub = C('#d7bf78'), stubD = C('#b89d5c');
  const c = new T.Color();
  for (let i = 0; i < P.count; i++) {
    const lx = P.getX(i), lz = P.getZ(i), wx = lx + f.x;
    const edge = smooth(clamp((f.w / 2 - Math.abs(lx)) / 4, 0, 1)) * smooth(clamp((f.d / 2 - Math.abs(lz)) / 4, 0, 1));
    const ph = .5 + .5 * Math.cos(lz / SP * Math.PI * 2);
    const plowed = smooth(clamp((f.plowedTo - wx) / 3, 0, 1));
    const amp = lerp(.12, .75, plowed) * edge;
    P.setY(i, .05 + ph * amp);
    const n = vnoise(wx * .4, lz * .4) * .2;
    c.copy(trough).lerp(ridge, ph * .85 + n);
    const s2 = stubD.clone().lerp(stub, ph * .7 + n);
    c.lerp(s2, 1 - plowed);
    col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
  }
  g.setAttribute('color', new T.BufferAttribute(col, 3));
  g.computeVertexNormals();
  const m = new T.Mesh(g, withCloudShadows(lambert()));
  m.position.set(f.x, 0, f.z);
  m.receiveShadow = true;
  world.add(m);
  // grassy fringe breaks the rectangular edge
  for (let i = 0; i < 160; i++) {
    const side = i % 4, t = R(-.5, .5);
    const px = f.x + (side < 2 ? t * f.w : (side === 2 ? -1 : 1) * (f.w / 2 + R(-.5, 1.5)));
    const pz = f.z + (side >= 2 ? t * f.d : (side === 0 ? -1 : 1) * (f.d / 2 + R(-.5, 1.5)));
    K.foliage.add(GEO.ico, pick(['#5aa83e', '#6fbf4a', '#7fc955']), [px, .2, pz], [R(.7, 1.4), R(.4, .8), R(.7, 1.4)]);
  }
  // scarecrow on the plowed side
  K.vc.push([70, 0, -135]);
  K.vc.add(GEO.cyl, '#8a5a36', [0, 2.4, 0], [.14, 4.8, .14]);
  K.vc.add(GEO.cyl, '#8a5a36', [0, 3.6, 0], [.12, 3.8, .12], [0, 0, Math.PI / 2]);
  K.vc.add(rbox(1.6, 1.8, .8, .3), '#4a7fc1', [0, 3.2, 0]);
  K.vc.add(rbox(3.6, .6, .6, .25), '#c0392b', [0, 3.6, 0]);
  K.vc.add(GEO.sph, '#e8d7a8', [0, 4.6, 0], .6);
  K.vc.add(GEO.cyl, '#d9b35c', [0, 5.05, 0], [1.2, .08, 1.2]);
  K.vc.add(GEO.cone, '#d9b35c', [0, 5.4, 0], [.55, .8, .55]);
  for (const s of [-1, 1]) { K.vc.add(GEO.sphLo, '#1d1d1d', [s * .2, 4.7, .52], .08); K.vc.add(GEO.cone, '#f2c230', [s * 1.9, 3.6, 0], [.18, .5, .18], [0, 0, s * Math.PI / 2]); }
  K.vc.pop();
  buildTractor(MAP.plowTractor.x, MAP.plowTractor.z, -Math.PI / 2, '#3f9c4f', true);
}

/* ---------- pond, dock, reeds, windmill ---------- */
const waterMat = new T.ShaderMaterial({
  fog: false,
  uniforms: { uTime: SHARED_TIME, uDeep: { value: C('#1f7fa8') }, uShallow: { value: C('#4fc6d6') }, uFoam: { value: C('#eafcff') }, uSky: { value: C('#dff6ff') },
    uL: { value: MAP.pond.lobes.map(l => new T.Vector4(MAP.pond.x + l[0], MAP.pond.z + l[1], l[2], l[3])) } },
  vertexShader: 'varying vec3 vW; void main(){ vec4 w = modelMatrix * vec4(position,1.); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }',
  fragmentShader: `uniform float uTime; uniform vec3 uDeep, uShallow, uFoam, uSky; uniform vec4 uL[3]; varying vec3 vW;
    float smin(float a, float b, float k){ float h = clamp(.5+.5*(b-a)/k, 0., 1.); return mix(b, a, h) - k*h*(1.-h); }
    void main(){
      float d = 1e9;
      for (int i = 0; i < 3; i++){ vec2 p = (vW.xz - uL[i].xy) / uL[i].zw; d = smin(d, (length(p) - 1.) * min(uL[i].z, uL[i].w), 5.); }
      float depth = -d;
      vec3 col = mix(uShallow, uDeep, smoothstep(0., 12., depth));
      float r = sin(vW.x*.33 + uTime*1.2) * sin(vW.z*.41 - uTime) + sin((vW.x+vW.z)*.21 + uTime*.7) * .6;
      col = mix(col, uSky, smoothstep(1.0, 1.45, r) * .45);
      float s = sin(vW.x*2.1 + uTime*2.7) * sin(vW.z*2.5 - uTime*2.1) * sin((vW.x-vW.z)*1.3 + uTime);
      col += vec3(1.) * smoothstep(.55, .75, s) * .5;
      float foam = 1. - smoothstep(.2, 1.4 + .5*sin(uTime*1.8 + vW.x*.4 + vW.z*.3), depth);
      col = mix(col, uFoam, foam * .8);
      gl_FragColor = vec4(col, 1.);
      #include <tonemapping_fragment>
      #include <encodings_fragment>
    }`,
});
function buildPond() {
  const p = MAP.pond;
  const shape = new T.Shape();
  const N = 120;
  for (let i = 0; i < N; i++) {
    const a = i / N * Math.PI * 2, dx = Math.cos(a), dz = Math.sin(a);
    let lo = 0, hi = 70;
    for (let k = 0; k < 30; k++) { const m = (lo + hi) / 2; if (pondSdf(p.x + dx * m, p.z + dz * m) < -.6) lo = m; else hi = m; }
    const r = hi + .4;
    if (i === 0) shape.moveTo(dx * r, -dz * r); else shape.lineTo(dx * r, -dz * r);
  }
  const g = new T.ShapeGeometry(shape, 12);
  g.rotateX(-Math.PI / 2);
  const m = new T.Mesh(g, waterMat);
  m.position.set(p.x, .12, p.z);
  world.add(m);
  // lily pads
  for (let i = 0; i < 26; i++) {
    const x = p.x + R(-32, 32), z = p.z + R(-24, 24);

    let x = p.x + Math.cos(a) * r, z = p.z + Math.sin(a) * r * .72;

    for (let j = 0; j < 7; j++) {

  for (const s of [-1, 1]) for (let i = 0; i < 4; i++) K.vc.add(GEO.cyl, '#7a5232', [s * 1.5, .5, i * 3], [.2, 1.8, .2]);
  K.vc.push([3.2, 0, 7.5], [0, .25, 0]);
  K.gloss.push([96, 0, 120], [0, -.75, 0]); K.gloss.push([3.2, 0, 7.5], [0, .25, 0]);
  K.gloss.add(GEO.sph, '#d9453a', [0, .35, 0], [1.2, .6, 2.8]);

  K.vc.add(GEO.cyl, '#b8875a', [.9, .9, -.3], [.06, 2.6, .06], [1.2, 0, .3]);

  const fan = new T.Group();

/* ---------- wind-swayed grass tufts + wildflowers (instanced) ---------- */
function windify(mat, strength) {
  mat.onBeforeCompile = sh => {
    sh.uniforms.uTime = SHARED_TIME;
    sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nuniform float uTime;')
      .replace('#include <begin_vertex>', `#include <begin_vertex>
        vec4 ip = instanceMatrix * vec4(0.,0.,0.,1.);
        float sw = sin(uTime*1.8 + ip.x*.13 + ip.z*.09) * .6 + sin(uTime*3.1 + ip.x*.41) * .25;
        transformed.x += sw * ${strength.toFixed(2)} * position.y;
        transformed.z += sw * ${(strength * .5).toFixed(2)} * position.y;`)
      .replace('#include <lights_lambert_vertex>', '#include <lights_lambert_vertex>\n#ifdef DOUBLE_SIDED\nvLightBack = vLightFront; vIndirectBack = vIndirectFront;\n#endif');
  };
  return mat;
}
function buildGrass() {
  const g = new T.BufferGeometry(), pos = [], col = [], nor = [];
  const base = C('#3f9a30'), tip = C('#9fd65a');
  for (let b = 0; b < 5; b++) {
    const a = b / 5 * Math.PI + R(-.2, .2), lean = R(-.3, .3), h = R(.55, .95), w = .17;
    const cx = Math.cos(a) * w, cz = Math.sin(a) * w;
    const tx = Math.cos(a + 1.57) * lean, tz = Math.sin(a + 1.57) * lean;
    pos.push(-cx, 0, -cz, cx, 0, cz, tx, h, tz);
    col.push(base.r, base.g, base.b, base.r, base.g, base.b, tip.r, tip.g, tip.b);
    nor.push(0, 1, 0, 0, 1, 0, 0, 1, 0);
  }
  g.setAttribute('position', new T.Float32BufferAttribute(pos, 3));
  g.setAttribute('normal', new T.Float32BufferAttribute(nor, 3));
  g.setAttribute('color', new T.Float32BufferAttribute(col, 3));
  const mat = windify(lambert({ side: T.DoubleSide }), .35);
  const N = 7000;
  const im = new T.InstancedMesh(g, mat, N);
  const d = new T.Object3D(), c = new T.Color();
  let n = 0;
  for (let i = 0; i < N * 3 && n < N; i++) {
    const x = R(-205, 205), z = R(-205, 205);
    if (!isGrassy(x, z)) continue;
    if (fbm(x * .03, z * .03) < .45 && rnd() < .8) continue; // clumped patches with open lawn between
    d.position.set(x, 0, z); d.rotation.set(0, R(0, 6.28), 0);
    const s = R(1.0, 1.8); d.scale.set(s, s * R(.8, 1.2), s); d.updateMatrix();
    im.setMatrixAt(n, d.matrix);
    im.setColorAt(n, c.setRGB(R(.85, 1.1), R(.9, 1.1), R(.8, 1)));
    n++;
  }
  im.count = n;
  im.receiveShadow = true; im.frustumCulled = false;
  world.add(im);
  // wildflowers
  const fg = new T.BufferGeometry(), fp = [], fc = [], fnor = [];
  const stem = C('#4f9a36');
  const petal = (cx, cy, cz, r, col) => {
    for (let i = 0; i < 5; i++) {
      const a0 = i / 5 * Math.PI * 2, a1 = (i + .5) / 5 * Math.PI * 2;
      fp.push(cx, cy, cz, cx + Math.cos(a0) * r, cy, cz + Math.sin(a0) * r, cx + Math.cos(a1) * r * .9, cy + .02, cz + Math.sin(a1) * r * .9);
      for (let k = 0; k < 3; k++) { fc.push(col.r, col.g, col.b); fnor.push(0, 1, 0); }
    }
  };
  fp.push(-.03, 0, 0, .03, 0, 0, 0, .75, 0); for (let k = 0; k < 3; k++) { fc.push(stem.r, stem.g, stem.b); fnor.push(0, 1, 0); }
  petal(0, .75, 0, .28, new T.Color(1, 1, 1));
  fg.setAttribute('position', new T.Float32BufferAttribute(fp, 3));
  fg.setAttribute('normal', new T.Float32BufferAttribute(fnor, 3));
  fg.setAttribute('color', new T.Float32BufferAttribute(fc, 3));
  const fmat = windify(lambert({ side: T.DoubleSide }), .25);
  const FN2 = 900, fl = new T.InstancedMesh(fg, fmat, FN2);
  const cols = ['#ffffff', '#ffd23f', '#ff7aa2', '#c28bff', '#ff9a3d'].map(C);
  n = 0;
  for (let i = 0; i < FN2 * 4 && n < FN2; i++) {
    const x = R(-205, 205), z = R(-205, 205);
    if (!isGrassy(x, z) || fbm(x * .02 + 9, z * .02) < .5) continue;
    d.position.set(x, 0, z); d.rotation.set(0, R(0, 6.28), 0); d.scale.setScalar(R(1.2, 1.8)); d.updateMatrix();
    fl.setMatrixAt(n, d.matrix); fl.setColorAt(n, pick(cols)); n++;
  }
  fl.count = n; fl.frustumCulled = false;
  world.add(fl);
}

  else k.add(GEO.sphLo, pupil, [x + d.x * r * .5, y + d.y * r * .5, z + d.z * r * .5], r * .64);
  k.add(GEO.sphLo, '#ffffff', [x + d.x * r * .88, y + d.y * r * .88 + r * .28, z + d.z * r * .88], r * .2);

function makeRig(kind, variant = 0) {

function makeEnvMap() {
  const tex = canvasTex(256, (g, s) => {
    const grd = g.createLinearGradient(0, 0, 0, s);
    grd.addColorStop(0, '#5fb3f0'); grd.addColorStop(.45, '#e9f7ff'); grd.addColorStop(.52, '#ffffff'); grd.addColorStop(.58, '#9fce6a'); grd.addColorStop(1, '#4f8a38');
    g.fillStyle = grd; g.fillRect(0, 0, s, s);
    g.fillStyle = 'rgba(255,255,240,.9)'; g.beginPath(); g.arc(s * .3, s * .18, 10, 0, 7); g.fill();
  }, false);
  tex.mapping = T.EquirectangularReflectionMapping;
  const pm = new T.PMREMGenerator(renderer);
  const env = pm.fromEquirectangular(tex).texture;
  pm.dispose();
  return env;
}

   10. EFFECTS — beam, particles, blob shadows, tomatoes, splats, dizzy stars

function beamMat(color, strength) {
  return new T.ShaderMaterial({
    transparent: true, depthWrite: false, blending: T.AdditiveBlending, side: T.DoubleSide, toneMapped: false, fog: false,
    uniforms: { uTime: SHARED_TIME, uPower: { value: 0 }, uColor: { value: C(color) }, uStr: { value: strength }, uLift: { value: 0 } },
    vertexShader: `varying float vH; varying vec3 vN; varying vec3 vV; varying float vA;
      void main(){ vH = -position.y; vA = atan(position.x, position.z);
        vec4 mv = modelViewMatrix * vec4(position,1.); vN = normalize(normalMatrix * normal); vV = normalize(-mv.xyz);
        gl_Position = projectionMatrix * mv; }`,
    fragmentShader: `uniform float uTime, uPower, uStr, uLift; uniform vec3 uColor; varying float vH; varying vec3 vN; varying vec3 vV; varying float vA;
      void main(){
        float rim = 1. - abs(dot(vN, vV)); rim = pow(rim, 1.6);
        float bands = smoothstep(.55, 1., fract(vH * 5. + uTime * (1.4 + uLift*1.5)));
        float swirl = .5 + .5 * sin(vA * 6. + vH * 9. + uTime * 4.);
        float fadeTop = smoothstep(0., .08, vH), fadeBot = 1. - smoothstep(.82, 1., vH);
        float a = (rim * .9 + .18 + bands * .35 + swirl * .12) * fadeTop * fadeBot * uPower * uStr;
        gl_FragColor = vec4(uColor * a, a);
        #include <encodings_fragment>
      }`,
  });
}
const BEAMFX = {};
function buildBeamFx() {
  const cone = new T.CylinderGeometry(1.25, 5.4, 1, 40, 1, true);

  // ground pool with expanding rings
  BEAMFX.pool = new T.Mesh(new T.CircleGeometry(6.2, 48), new T.ShaderMaterial({
    transparent: true, depthWrite: false, blending: T.AdditiveBlending, toneMapped: false,
    uniforms: { uTime: SHARED_TIME, uPower: { value: 0 }, uColor: { value: C('#44ffd5') } },
    vertexShader: 'varying vec2 vP; void main(){ vP = position.xy / 6.2; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }',
    fragmentShader: `uniform float uTime, uPower; uniform vec3 uColor; varying vec2 vP;
      void main(){ float r = length(vP); float ring = smoothstep(.12, 0., abs(fract(r * 2.2 - uTime * 1.3) - .5) - .32);
        float a = (ring * .55 + (1. - r) * .45) * smoothstep(1., .8, r) * uPower;

  BEAMFX.lock = new T.Mesh(new T.RingGeometry(.82, 1, 48), new T.MeshBasicMaterial({ color: C('#ffd84a'), transparent: true, opacity: .95, depthWrite: false, depthTest: false, toneMapped: false, side: T.DoubleSide }));

  for (const m of [BEAMFX.scoutUfo, ...BEAMFX.scoutFarmers]) { m.renderOrder = 9; m.visible = false; scene.add(m); }
  for (const k of ['outer', 'inner', 'pool', 'lock']) { BEAMFX[k].visible = false; scene.add(BEAMFX[k]); }

class Particles {
  constructor(max, additive) {
    this.max = max; this.n = 0;
    const g = new T.BufferGeometry();
    this.pos = new Float32Array(max * 3); this.col = new Float32Array(max * 3); this.size = new Float32Array(max); this.alpha = new Float32Array(max);
    g.setAttribute('position', new T.BufferAttribute(this.pos, 3).setUsage(T.DynamicDrawUsage));
    g.setAttribute('color', new T.BufferAttribute(this.col, 3).setUsage(T.DynamicDrawUsage));
    g.setAttribute('size', new T.BufferAttribute(this.size, 1).setUsage(T.DynamicDrawUsage));
    g.setAttribute('alpha', new T.BufferAttribute(this.alpha, 1).setUsage(T.DynamicDrawUsage));
    this.geo = g;
    this.mat = new T.ShaderMaterial({
      transparent: true, depthWrite: false, blending: additive ? T.AdditiveBlending : T.NormalBlending, toneMapped: false, vertexColors: true,
      uniforms: { uTex: { value: TEX.dot }, uScale: { value: 400 } },
      vertexShader: `attribute float size; attribute float alpha; varying vec3 vC; varying float vA; uniform float uScale;
        void main(){ vC = color; vA = alpha; vec4 mv = modelViewMatrix * vec4(position,1.); gl_PointSize = size * uScale / -mv.z; gl_Position = projectionMatrix * mv; }`,
      fragmentShader: `uniform sampler2D uTex; varying vec3 vC; varying float vA;
        void main(){ vec4 t = texture2D(uTex, gl_PointCoord); gl_FragColor = vec4(vC, t.a * vA);
          #include <encodings_fragment>
        }`,
    });
    this.points = new T.Points(g, this.mat);
    this.points.frustumCulled = false;
    this.points.renderOrder = 8;
    this.p = []; // live particle records
    scene.add(this.points);
  }
  emit(o) {
    if (this.p.length >= this.max) this.p.shift();
    this.p.push({ x: o.x, y: o.y, z: o.z, vx: o.vx || 0, vy: o.vy || 0, vz: o.vz || 0, life: o.life || 1, t: 0,
      s0: o.size || 1, s1: o.size1 === undefined ? (o.size || 1) : o.size1, c: o.color || C('#ffffff'), g: o.grav || 0, drag: o.drag || 0, a: o.alpha || 1 });
  }
  update(dt) {
    let n = 0;
    for (let i = this.p.length - 1; i >= 0; i--) {
      const q = this.p[i];
      q.t += dt;
      if (q.t >= q.life) { this.p.splice(i, 1); continue; }
    }
    for (const q of this.p) {
      q.vy -= q.g * dt;
      const d = Math.exp(-q.drag * dt); q.vx *= d; q.vy *= d; q.vz *= d;
      q.x += q.vx * dt; q.y += q.vy * dt; q.z += q.vz * dt;
      if (q.y < .05 && q.g > 0) { q.y = .05; q.vy *= -.3; q.vx *= .6; q.vz *= .6; }
      const k = q.t / q.life;
      this.pos[n * 3] = q.x; this.pos[n * 3 + 1] = q.y; this.pos[n * 3 + 2] = q.z;
      this.col[n * 3] = q.c.r; this.col[n * 3 + 1] = q.c.g; this.col[n * 3 + 2] = q.c.b;
      this.size[n] = lerp(q.s0, q.s1, k);
      this.alpha[n] = q.a * (k < .15 ? k / .15 : 1 - smooth((k - .15) / .85));
      n++;
    }
    this.geo.setDrawRange(0, n);
    for (const a of ['position', 'color', 'size', 'alpha']) this.geo.attributes[a].needsUpdate = true;
  }
  clear() { this.p.length = 0; this.geo.setDrawRange(0, 0); }
}

  $('pauseGoal').textContent = G.level.goal ? `${rem} to go · ${goalText(G.level)}` : 'Free Flight';
  $('pauseMute').textContent = 'Sound: ' + (Snd.muted ? 'Off' : 'On');
  Snd.stopMusic(); Snd.setBeam(0, false, 0);
  show('scrPause');
}
function resume() { if (G.mode !== 'paused') return; G.mode = 'play'; show(null); Snd.startMusic(); }
function endMission(won, reason = '') {
  if (G.ended) return;
  G.ended = true; G.won = won; G.reason = reason; G.endT = 0;
  if (beam.target) releaseTarget(false);
  input.btnBeam = false; hint(null);
  Snd.stopMusic();
  if (won) { Snd.win(); toast(G.level.free ? 'Nice flying!' : 'MISSION COMPLETE!'); }
  else { Snd.lose(); toast(reason, true); }
}
function showResult() {
  G.resultShown = true; G.mode = 'result';
  const L = G.level, won = G.won;
  const timeBonus = won && L.time ? Math.ceil(G.timeLeft) * TUNE.score.timeBonus : 0;
  const shieldBonus = won && !L.free ? G.shields * 50 : 0;
  const total = G.score + timeBonus + shieldBonus;
  const speedy = won && L.time && G.timeLeft / L.time >= .33;
  const untouched = won && G.hits <= 1;
  const stars = won ? 1 + (speedy ? 1 : 0) + (untouched ? 1 : 0) : 0;
  if (!L.free && won) Save.record(L.id, stars, total); // a lost run never overwrites your best
  $('resTitle').textContent = won ? (stars === 3 ? 'Perfect Abduction!' : 'Mission Complete!') : 'Mission Failed';
  $('resSub').textContent = won ? `${L.name} · best ${Save.level(L.id).best}` : `${G.reason} ${goalRemaining()} to go. Have another go!`;
  const starsEl = $('resStars'); starsEl.style.display = L.free ? 'none' : '';
  [...starsEl.children].forEach((s, i) => { s.classList.remove('on'); if (i < stars) setTimeout(() => { s.classList.add('on'); Snd.tone(700 + i * 200, .15, { type: 'triangle', vol: .18 }); }, 350 + i * 320); });
  $('resWhy').innerHTML = L.free ? '' : `<span class="${won ? 'on' : ''}">⭐ Finished</span><span class="${speedy ? 'on' : ''}">⭐ Speedy (⅓ time left)</span><span class="${untouched ? 'on' : ''}">⭐ Hit at most once</span>`;
  const rows = Object.entries(G.breakdown).map(([k, v]) => `<div><span>${k === 'farmer' ? '👨‍🌾 Farmer' : SPECIES[k].emoji + ' ' + SPECIES[k].name}</span><span>${v}</span></div>`);
  if (timeBonus) rows.push(`<div><span>⏱ Time bonus</span><span>${timeBonus}</span></div>`);
  if (shieldBonus) rows.push(`<div><span>🛡 Shield bonus</span><span>${shieldBonus}</span></div>`);
  rows.push(`<div class="tot"><span>Total</span><span>${total}</span></div>`);
  $('resBrk').innerHTML = rows.join('');
  const hasNext = won && G.levelIdx + 1 < LEVELS.length && !LEVELS[G.levelIdx + 1].free;
  $('resNext').style.display = hasNext ? '' : 'none';
  show('scrResult');
}
document.addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('[data-act]');
  if (!b) return;
  Snd.unlock(); Snd.click();
  switch (b.dataset.act) {
    case 'levels': openLevels(); break;
    case 'title': toTitle(); break;
    case 'start': startLevel(G.levelIdx); break;
    case 'resume': resume(); break;
    case 'restart': startLevel(G.levelIdx); break;
    case 'next': openBrief(G.levelIdx + 1); break;
    case 'mute':
      Snd.setMuted(!Snd.muted); Save.data.muted = Snd.muted; Save.write();
      document.querySelectorAll('[data-act=mute]').forEach(el => { el.textContent = el.id === 'pauseMute' ? 'Sound: ' + (Snd.muted ? 'Off' : 'On') : (Snd.muted ? '🔇' : '🔊'); });
      break;
  }
});
$('pauseBtn').addEventListener('click', () => { Snd.click(); pause(); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { pause(); if (Snd.ctx) Snd.ctx.suspend(); }
  else if (Snd.ctx) Snd.ctx.resume();
});

/* ==========================================================================
   23. MAIN LOOP
   ========================================================================== */
function tutorial(dt) {
  if (!G.level || !G.level.tutorial || G.ended) return;
  G.tutT += dt;
  const moved = Math.hypot(ufo.pos.x - G.flags.sx, ufo.pos.z - G.flags.sz);
  switch (G.tut) {
    case 0: hint('Drag on the left side to fly'); if (moved > 18) { G.tut = 1; G.tutT = 0; } break;
    case 1: hint('Fly over an animal. Look for the gold ring'); if (beam.cand) { G.tut = 2; G.tutT = 0; } break;
    case 2: hint(beam.target ? 'Keep holding…' : 'Hold BEAM to beam it up!'); break;
    case 3: hint(`Got one! ${goalRemaining()} more to go`); if (G.tutT > 3) { G.tut = 4; G.tutT = 0; } break;
    case 4: hint('Hold SCOUT to see the whole farm'); if (input.scout || G.tutT > 8) { G.tut = 5; G.tutT = 0; } break;
    case 5: hint(input.scout ? 'Animals are the little dots. Let go to fly back in' : null); if (G.tutT > 6 || !input.scout) G.tut = 6; break;
    default: hint(null);
  }
}
function advance(dt) {
  G.time += dt;
  SHARED_TIME.value = G.time;
  CLOUD_OFF.value.set(G.time * .0045, G.time * .0028);
  composeInput();
  BLOBS.n = 0;
  if (G.mode === 'play' && !G.ended) {
    if (G.level.time) {
      G.timeLeft -= dt;
      if (G.timeLeft <= 20 && !G.flags.hurry) { G.flags.hurry = true; toast('Hurry!', true); }
      if (G.timeLeft <= 0) { G.timeLeft = 0; endMission(false, "Time's up!"); }
    }
    G.sinceHit += dt;
    if (G.sinceHit > TUNE.shields.regenDelay && G.shields < TUNE.shields.max) {
      G.regenT += dt;
      if (G.regenT >= TUNE.shields.regenEvery) { G.regenT = 0; G.shields++; Snd.shieldUp(); }
    }
    if (G.hits === 1 && !G.flags.hitHint && !G.level.tutorial) { G.flags.hitHint = true; hint('Tomatoes knock animals out of the beam. Keep moving!'); setTimeout(() => { if (hud.hintTxt && hud.hintTxt.startsWith('Tomatoes')) hint(null); }, 3500); }
  }
  if (G.mode !== 'paused') {
    updateUfo(dt);
    updateBeam(dt);
    for (const a of ents.animals) {
      a.update(dt);
      const s = a.r * 2.3 * a.shrink * Math.max(.25, 1 - a.y * .045);
      blob(a.x, a.z, s * .8, s * 1.1, a.yaw);
    }
    separateAnimals();
    for (const f of ents.farmers) { f.update(dt); if (f.state !== 'gone') blob(f.x, f.z, 2.4 * Math.max(.3, 1 - f.y * .05)); }
    updateTomatoes(dt);
    for (const t of ents.tomatoes) blob(t.x, t.z, .9);
    updateDecals(dt);
    sparks.update(dt); dust.update(dt);
    if (world.userData.fan) world.userData.fan.rotation.z -= dt * 2.2;
    tutorial(dt);
    if (G.ended) {
      G.endT += dt;
      if (G.won) {
        ufo.alt += dt * 5 * Math.min(1, G.endT); ufo.m.tilt.rotation.y += dt * 8;
        if (G.endT < 1.2) sparks.emit({ x: ufo.pos.x + R(-6, 6), y: ufo.pos.y + R(0, 6), z: ufo.pos.z + R(-6, 6), vx: R(-3, 3), vy: R(2, 6), vz: R(-3, 3), life: 1.2, size: .9, size1: .2, color: pick(['#ffd84a', '#ff7aa2', '#6dfff0', '#8cf542'].map(C)), grav: 4 });
      } else {
        ufo.wob = .6;
        if (Math.random() < .3) dust.emit({ x: ufo.pos.x, y: ufo.pos.y + .5, z: ufo.pos.z, vx: R(-1, 1), vy: R(2, 4), vz: R(-1, 1), life: 1.4, size: 1.2, size1: 3, color: C('#8a8f96'), alpha: .7 });
      }
      if (G.endT > 1.9 && !G.resultShown) showResult();
    }
  }
  BLOBS.mesh.count = BLOBS.n;
  BLOBS.mesh.instanceMatrix.needsUpdate = true;
  updateCamera(dt);
  updateScoutMarks();
  updateHud(dt);
  Snd.tick();
}
const QUALITY = { cap: 2, ema: 16, t: 0, steps: 0 };
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, QUALITY.cap));
  renderer.setSize(w, h, false);
  cam.aspect = w / h; camera.aspect = cam.aspect;
  cam.scoutDist = solveScout(cam.aspect, playParams(cam.aspect).fov);
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 250));
function render() {
  const s = renderer.getDrawingBufferSize(new T.Vector2()).y / (2 * Math.tan(camera.fov / 2 * DEG));
  sparks.mat.uniforms.uScale.value = s; dust.mat.uniforms.uScale.value = s;
  renderer.render(scene, camera);
}
let last = performance.now(), running = true;
function frame(now) {
  if (!running) return;
  requestAnimationFrame(frame);
  const ms = now - last; last = now;
  const dt = Math.min(.05, Math.max(0, ms / 1000));
  advance(dt);
  render();
  // adaptive resolution: step down if the device can't hold ~40fps in play
  QUALITY.ema = lerp(QUALITY.ema, ms, .05);
  if (G.mode === 'play') {
    QUALITY.t += dt;
    if (QUALITY.t > 3 && QUALITY.ema > 25 && QUALITY.cap > 1) { QUALITY.cap = Math.max(1, QUALITY.cap - .25); QUALITY.steps++; QUALITY.t = 0; resize(); }
  }
}

/* ==========================================================================
   24. BOOT
   ========================================================================== */
Save.load();
Snd.muted = Save.data.muted;
document.querySelectorAll('.icon-btn[data-act=mute]').forEach(el => { el.textContent = Snd.muted ? '🔇' : '🔊'; });
buildWorld();
buildBeamFx();
buildBlobs();
sparks = new Particles(460, true);
dust = new Particles(320, false);
ufo = { m: makeUfo(), pos: new T.Vector3(-40, 20, -10), vel: new T.Vector3(), alt: 19, inv: 0, wob: 0, cheer: 0 };
scene.add(ufo.m.root);
applyLight('day');
resize();
G.mode = 'title';
spawnHerd(LEVELS[5].herd);
updateCamera(0, true);
render();
$('loading').classList.add('gone');
show('scrTitle');
requestAnimationFrame(t => { last = t; frame(t); });

// Test/automation hook: lets headless runs drive the game deterministically.
window.__BA = {
  G, ents, beam, input, LEVELS, MAP, TUNE, camera, renderer, scene,
  get ufo() { return ufo; },
  startLevel, toTitle, openBrief, pause, resume, endMission,
  stop() { running = false; }, go() { if (!running) { running = true; last = performance.now(); requestAnimationFrame(frame); } },
  step(n = 1, dt = 1 / 60) { for (let i = 0; i < n; i++) advance(dt); render(); },
  sim(n = 1, dt = 1 / 60) { for (let i = 0; i < n; i++) advance(dt); }, // no render: for long automated loops
  setInput(o) { input.override = true; Object.assign(input, o); },
  clearInput() { input.override = false; input.x = input.z = 0; input.beam = input.scout = false; },
  fly(x, z) { ufo.pos.x = x; ufo.pos.z = z; ufo.vel.set(0, 0, 0); updateCamera(0, true); },
  fenceNdc() { // max |NDC| of the fence under the live camera: scout must be ≤ margin
    let m = 0; camera.updateMatrixWorld();
    for (const [x, z] of FENCE_SAMPLES) for (const y of [0, 1.8]) { _pv.set(x, y, z).project(camera); m = Math.max(m, Math.abs(_pv.x), Math.abs(_pv.y)); }
    return m;
  },
  resize, quality: QUALITY, drawCalls: () => renderer.info.render.calls, tris: () => renderer.info.render.triangles,
};
})();
</script>
</body>
