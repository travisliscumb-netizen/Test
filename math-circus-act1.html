          g.strokeStyle = 'rgba(18,32,58,.25)'; g.lineWidth = 2; g.setLineDash([3, 3]);
          g.beginPath(); g.arc(c.x + c.s / 2, c.y + c.s / 2, Math.max(5, c.s * 0.26), 0, 7); g.stroke();
          g.setLineDash([]);
        }
        /* tap surface + cursor */
        reg('grid', G.x0, G.y0, G.cell * puz.size, G.cell * puz.size, {});
        if (cursor){
          const c = cellAt(cursor.x, cursor.y);
          g.strokeStyle = C.red; g.lineWidth = 3;
          g.strokeRect(c.x + 2, c.y + 2, c.s - 4, c.s - 4);
          g.fillStyle = 'rgba(196,30,58,.18)';
          g.fillRect(c.x + 2, c.y + 2, c.s - 4, c.s - 4);
        }
        badge(12, G.btnY - 4, 92, 50, 'CURSOR', cursor ? '(' + cursor.x + ', ' + cursor.y + ')' : '--',
          {size:15});
        button('place', 112, G.btnY - 4, V.w - 126, 50,
          cursor ? 'PLACE BOLT' : 'TAP THE GRID', {fill: cursor ? C.gold : C.creamDark,
          color: cursor ? C.ink : C.slate, disabled:!cursor, size:17});
        if (noteT > 0){
          panel(16, G.btnY - 62, V.w - 32, 40, {fill:C.red, stroke:C.navy, r:10, lw:2});
          Twrap(note, V.w / 2, G.btnY - 48, V.w - 50, 15, {size:12.5, weight:700, color:C.cream});
        }
      },
      up(hit, p, wasPressed){
        if (!hit || hit.id !== wasPressed) return;
        if (hit.id === 'grid'){
          const G = geo();
          const gx = Math.floor((p.x - G.x0) / G.cell) + 1;
          const gy = puz.size - Math.floor((p.y - G.y0) / G.cell);
          if (gx < 1 || gx > puz.size || gy < 1 || gy > puz.size) return;
          cursor = {x:gx, y:gy}; Sfx.click();
          return;
        }
        if (hit.id === 'place' && !hit.disabled) place();
      }
    };
  }
};


/* ===========================================================================
   GAME 11 - CLOWN FORMATION  (sequencing / directional logic)
   ========================================================================= */
const DIRS = [{x:0, y:-1, n:'Up'}, {x:1, y:0, n:'Right'}, {x:0, y:1, n:'Down'}, {x:-1, y:0, n:'Left'}];
const CLOWN_COLS = ['#C41E3A', '#2F6FB5', '#2E9E5B', '#6B4BA8', '#E8821E'];
/* One simultaneous step. cmds[i] is a direction index or null (that clown waits).
   Walking into a wall leaves a clown where it is; sharing a square or swapping
   squares is a pile-up. */
function clownStep(pos, cmds, faces, size, rotate){
  const next = pos.map((p, i) => {
    const c = cmds[i];
    if (c === null || c === undefined) return {x:p.x, y:p.y};
    const d = DIRS[rotate ? (c + faces[i]) % 4 : c];
    const nx = p.x + d.x, ny = p.y + d.y;
    if (nx < 0 || ny < 0 || nx >= size || ny >= size) return {x:p.x, y:p.y};
    return {x:nx, y:ny};
  });
  for (let i = 0; i < next.length; i++){
    for (let j = i + 1; j < next.length; j++){
      if (next[i].x === next[j].x && next[i].y === next[j].y) return null;
      if (next[i].x === pos[j].x && next[i].y === pos[j].y &&
          next[j].x === pos[i].x && next[j].y === pos[i].y) return null;
    }
  }
  return next;
}
function manhattanPath(from, to, xFirst){
  const out = [];
  const stepsX = to.x - from.x, stepsY = to.y - from.y;
  const xs = () => { for (let i = 0; i < Math.abs(stepsX); i++) out.push(stepsX > 0 ? 1 : 3); };
  const ys = () => { for (let i = 0; i < Math.abs(stepsY); i++) out.push(stepsY > 0 ? 2 : 0); };
  if (xFirst){ xs(); ys(); } else { ys(); xs(); }
  return out;
}
function genClowns(diff){
  if (diff === 'easy'){
    const size = 2;
    const start = {x:rndI(0, 1), y:rndI(0, 1)};
    let target = {x:rndI(0, 1), y:rndI(0, 1)};
    while (target.x === start.x && target.y === start.y) target = {x:rndI(0, 1), y:rndI(0, 1)};
    return {size, shared:false, starts:[start], targets:[target], faces:[0],
            min:Math.abs(target.x - start.x) + Math.abs(target.y - start.y)};
  }
  if (diff === 'medium'){
    const size = 4, n = 3;
    for (let a = 0; a < 800; a++){
      const cells = shuffle(Array.from({length:size * size}, (_, i) => ({x:i % size, y:(i / size) | 0})));
      const starts = cells.slice(0, n), targets = shuffle(cells.slice()).slice(0, n);
      const dists = starts.map((s, i) => Math.abs(targets[i].x - s.x) + Math.abs(targets[i].y - s.y));
      if (dists.some(d => d < 1 || d > 4)) continue;
      if (targets.some((t, i) => targets.some((u, j) => j !== i && u.x === t.x && u.y === t.y))) continue;
      /* a collision-free optimal run must exist, or three stars is unreachable */
      let ok = false;
      for (let mask = 0; mask < 8 && !ok; mask++){
        const qs = starts.map((s, i) => manhattanPath(s, targets[i], !!(mask & (1 << i))));
        const len = Math.max(...qs.map(q => q.length));
        let pos = starts.map(p => ({x:p.x, y:p.y})), good = true;
        for (let st = 0; st < len; st++){
          const cmds = qs.map(q => st < q.length ? q[st] : null);
          pos = clownStep(pos, cmds, [0, 0, 0], size, false);
          if (!pos){ good = false; break; }
        }
        if (good && pos.every((p, i) => p.x === targets[i].x && p.y === targets[i].y)) ok = true;
      }
      if (!ok) continue;
      return {size, shared:false, starts, targets, faces:[0, 0, 0],
              min:dists.reduce((a2, b) => a2 + b, 0)};
    }
  }
  const size = 5, n = 5;
  for (let a = 0; a < 800; a++){
    const cells = shuffle(Array.from({length:size * size}, (_, i) => ({x:i % size, y:(i / size) | 0})));
    const starts = cells.slice(0, n);
    const faces = starts.map(() => rndI(0, 3));
    const len = rndI(3, 4);
    let pos = starts.map(p => ({x:p.x, y:p.y}));
    const seq = [];
    let good = true;
    for (let s = 0; s < len; s++){
      const c = rndI(0, 3);
      const nxt = clownStep(pos, starts.map(() => c), faces, size, true);
      if (!nxt){ good = false; break; }
      seq.push(c); pos = nxt;
    }
    if (!good) continue;
    if (pos.every((p, i) => p.x === starts[i].x && p.y === starts[i].y)) continue;
    const targets = pos;
    const min = bfsShared(starts, targets, faces, size, len);
    if (!min) continue;
    return {size, shared:true, starts, targets, faces, min};
  }
  return {size:5, shared:true, starts:[{x:0, y:0}], targets:[{x:1, y:0}], faces:[1], min:1};
}
/* Shortest shared command sequence that lands every clown on its target. */
function bfsShared(starts, targets, faces, size, maxDepth){
  const key = pos => pos.map(p => p.x + ',' + p.y).join(';');
  const goal = key(targets);
  let frontier = [starts.map(p => ({x:p.x, y:p.y}))];
  const seen = new Set([key(starts)]);
  for (let depth = 1; depth <= maxDepth + 2; depth++){
    const next = [];
    for (const pos of frontier){
      for (let c = 0; c < 4; c++){
        const n = clownStep(pos, pos.map(() => c), faces, size, true);
        if (!n) continue;
        const k = key(n);
        if (k === goal) return depth;
        if (seen.has(k)) continue;
        seen.add(k); next.push(n);
      }
    }
    if (!next.length) return 0;
    frontier = next;
  }
  return 0;
}

        if (id.indexOf('pick') === 0){ sel = parseInt(id.slice(4), 10); Sfx.click(); return; }

/* ===========================================================================
   GAME 12 - LION ARRANGEMENT  (sorting / ordering by criteria)
   ========================================================================= */
const LION_NAMES = ['Leo', 'Nala', 'Rex', 'Kiba', 'Sasha', 'Tor'];
function genLions(diff){
  const n = diff === 'easy' ? 4 : diff === 'medium' ? 5 : 6;
  for (let a = 0; a < 500; a++){
    const lions = LION_NAMES.slice(0, n).map((name, id) => ({
      id, name, age:rndI(2, 14), tricks:rndI(1, 9)
    }));
    let prompt = '', cmp = null;
    if (diff === 'easy'){
      const ages = lions.map(l => l.age);
      if (new Set(ages).size !== n) continue;
      prompt = 'Youngest first.';
      cmp = (x, y) => x.age - y.age;
    } else if (diff === 'medium'){
      const desc = Math.random() < 0.5;
      const tr = lions.map(l => l.tricks);
      const counts = {};
      for (const t of tr) counts[t] = (counts[t] || 0) + 1;
      const ties = Object.values(counts).filter(c => c > 1);
      if (ties.length !== 1 || ties[0] !== 2) continue;      /* exactly one tie */
      if (new Set(lions.map(l => l.age)).size !== n) continue;
      prompt = (desc ? 'Most tricks first.' : 'Fewest tricks first.') +
               ' If two lions have the same number of tricks, the older one goes first.';
      cmp = (x, y) => (desc ? y.tricks - x.tricks : x.tricks - y.tricks) || (y.age - x.age);
    } else {
      const totals = lions.map(l => l.age + l.tricks);
      const counts = {};
      for (const t of totals) counts[t] = (counts[t] || 0) + 1;
      if (!Object.values(counts).some(c => c === 2)) continue; /* at least one tiebreak */
      if (Object.values(counts).some(c => c > 2)) continue;
      const trick = lions.map(l => l.tricks);
      if (new Set(trick).size !== n) continue;
      prompt = 'Add age and tricks together: biggest total first. If two totals match, fewer tricks goes first.';
      cmp = (x, y) => (y.age + y.tricks) - (x.age + x.tricks) || (x.tricks - y.tricks);
    }
    const order = lions.slice().sort(cmp);
    let unique = true;
    for (let i = 0; i + 1 < order.length; i++) if (cmp(order[i], order[i + 1]) === 0) unique = false;
    if (!unique) continue;
    return {lions:shuffle(lions.slice()), order:order.map(l => l.id), prompt, n};
  }
  const lions = LION_NAMES.slice(0, n).map((name, id) => ({id, name, age:2 + id * 2, tricks:1 + id}));
  return {lions:shuffle(lions.slice()), order:lions.map(l => l.id), prompt:'Youngest first.', n};
}
function drawLion(x, y, s, lion, o){
  o = o || {};
  const g = ctx;
  g.fillStyle = o.bad ? '#D9A0A8' : '#C98A2E';
  for (let i = 0; i < 9; i++){
    const a = i / 9 * Math.PI * 2;
    g.beginPath(); g.arc(x + Math.cos(a) * s * 0.52, y + Math.sin(a) * s * 0.52, s * 0.26, 0, 7); g.fill();
  }
  g.fillStyle = o.bad ? C.red : C.gold;
  g.beginPath(); g.arc(x, y, s * 0.46, 0, 7); g.fill();
  g.lineWidth = 2; g.strokeStyle = C.navy; g.stroke();
  g.fillStyle = C.ink;
  g.beginPath(); g.arc(x - s * 0.17, y - s * 0.1, s * 0.06, 0, 7); g.fill();
  g.beginPath(); g.arc(x + s * 0.17, y - s * 0.1, s * 0.06, 0, 7); g.fill();
  g.fillStyle = '#8E5A18';
  g.beginPath(); g.moveTo(x - s * 0.1, y + s * 0.12); g.lineTo(x + s * 0.1, y + s * 0.12);
  g.lineTo(x, y + s * 0.24); g.closePath(); g.fill();
}
GAMES.lions = {
  name:'Lion Arrangement', short:'Lions', skill:'Sorting & ordering',
  desc:'Read the order the ringmaster wants, then drag each lion onto the right pedestal.',
  create(diff){
    const puz = genLions(diff);
    const n = puz.n;
    const slots = new Array(n).fill(null);         /* pedestal -> lion id */
    let drag = null, placements = 0, wrongSet = [], note = '', noteT = 0;
    const lionOf = id => puz.lions.find(l => l.id === id);
    const slotOfLion = id => slots.indexOf(id);
    const geo = () => {
      const top = instrBottom(puz.prompt) + 6;
      const rows = Math.ceil(n / 3), chh = 88;
      const penH = 26 + rows * chh;
      const blockH = 162 + penH;                    /* pedestals + stats + pen */
      const gap = Math.max(8, (V.h - 16 - top - blockH) / 2);
      const pedY = top + gap + 70;
      const pw = Math.min(56, (V.w - 16) / n);
      return {top, pedY, penY:pedY + 92, penH, chh, rows, pw, px0:(V.w - pw * n) / 2};
    };
    function checkOrder(){
      if (slots.some(s => s === null)) return;
      const wrong = [];
      for (let i = 0; i < n; i++) if (slots[i] !== puz.order[i]) wrong.push(i);
      if (!wrong.length){
        const fixes = placements - n;
        const stars = fixes === 0 ? 3 : fixes <= 2 ? 2 : 1;
        finishGame(stars, fixes, fixes === 0 ? 'Perfect line-up, first time.'
          : 'Line-up correct after ' + fixes + ' change' + (fixes === 1 ? '' : 's') + '.');
        return;
      }
      wrongSet = wrong; Sfx.bad();
      note = wrong.length + ' pedestal' + (wrong.length === 1 ? ' is' : 's are') + ' wrong. Swap them around.';
      noteT = 3;
    }
    return {
      debug(){ return {n, order:puz.order.slice(), slots:slots.slice(), placements,
                       prompt:puz.prompt, wrong:wrongSet.slice(),
                       lions:puz.lions.map(l => ({id:l.id, name:l.name, age:l.age, tricks:l.tricks}))}; },
      hudNote(){ return 'Placed ' + slots.filter(s => s !== null).length + '/' + n; },
      update(dt){ if (noteT > 0) noteT -= dt; },
      draw(){
        const g = ctx, G = geo();
        g.fillStyle = C.cream; g.fillRect(0, 0, V.w, V.h);
        sawdustFloor(G.pedY + 48);
        instr(puz.prompt);
        T('1st', G.px0 + G.pw / 2, G.pedY - 62, {size:11, weight:800, color:C.slate});
        T(n + 'th', G.px0 + G.pw * (n - 0.5), G.pedY - 62, {size:11, weight:800, color:C.slate});
        /* pedestals */
        for (let i = 0; i < n; i++){
          const x = G.px0 + i * G.pw, y = G.pedY;
          reg('ped' + i, x, y - 56, G.pw, 108, {ped:i});
          const bad = wrongSet.indexOf(i) >= 0;
          g.fillStyle = bad ? C.red : C.navy;
          rr(g, x + 3, y, G.pw - 6, 46, 6); g.fill();
          T(String(i + 1), x + G.pw / 2, y + 32, {size:15, weight:800, color:C.gold, num:true});
          const id = slots[i];
          if (id === null){
            g.strokeStyle = 'rgba(18,32,58,.3)'; g.lineWidth = 2; g.setLineDash([4, 4]);
            g.beginPath(); g.arc(x + G.pw / 2, y - 22, 18, 0, 7); g.stroke();
            g.setLineDash([]);
          } else if (!drag || drag.id !== id){
            const l = lionOf(id);
            drawLion(x + G.pw / 2, y - 24, 34, l, {bad});
            T(l.name, x + G.pw / 2, y + 12, {size:10.5, weight:800, color:C.cream, maxWidth:G.pw - 6});
            reg('take' + id, x, y - 50, G.pw, 54, {lion:id});
          }
        }
        /* pen */
        const pen = puz.lions.filter(l => slotOfLion(l.id) < 0);
        panel(8, G.penY, V.w - 16, G.penH, {fill:C.white, stroke:C.navy, r:12, lw:2, shadow:false});
        T('THE PRIDE', V.w / 2, G.penY + 14, {size:10.5, weight:800, color:C.slate});
        const cols = 3, cw = (V.w - 32) / cols;
        for (let i = 0; i < pen.length; i++){
          const col = i % cols, row = (i / cols) | 0;
          const x = 16 + col * cw, y = G.penY + 22 + row * G.chh;
          if (drag && drag.id === pen[i].id) continue;
          reg('take' + pen[i].id, x, y, cw - 4, G.chh - 4, {lion:pen[i].id});
          drawLion(x + cw / 2 - 2, y + 30, 34, pen[i]);
          T(pen[i].name, x + cw / 2 - 2, y + 62, {size:12.5, weight:800, color:C.navy});
          T('Age ' + pen[i].age + '  ·  ' + pen[i].tricks + ' tricks', x + cw / 2 - 2, y + 76,
            {size:10.5, weight:700, color:C.slate, num:true, maxWidth:cw - 8});
        }
        /* stats for seated lions, so they can still be compared */
        for (let i = 0; i < n; i++){
          const id = slots[i];
          if (id === null) continue;
          const l = lionOf(id);
          T(l.age + '/' + l.tricks, G.px0 + i * G.pw + G.pw / 2, G.pedY + 60,
            {size:10.5, weight:800, color:C.navy, num:true});
        }
        if (slots.some(v => v !== null))
          T('age / tricks', V.w / 2, G.pedY + 76, {size:9.5, weight:700, color:C.slate});
        if (drag){
          const l = lionOf(drag.id);
          drawLion(drag.x, drag.y, 40, l);
          T(l.name, drag.x, drag.y + 28, {size:11, weight:800, color:C.navy});
        }
        if (noteT > 0){
          panel(16, G.penY - 30, V.w - 32, 26, {fill:C.red, stroke:C.navy, r:8, lw:2, shadow:false});
          T(note, V.w / 2, G.penY - 17, {size:11.5, weight:700, color:C.cream, maxWidth:V.w - 44});
        }
      },
      down(hit, p){
        if (!hit || hit.lion === undefined) return;
        drag = {id:hit.lion, x:p.x, y:p.y - 16};
        Sfx.pop();
      },
      move(p){ if (drag){ drag.x = p.x; drag.y = p.y - 16; } },
      cancel(){ drag = null; },
      up(hit, p, wasPressed){
        if (!drag) return;
        const id = drag.id;
        const G = geo();
        drag = null;
        let target = -1;
        for (let i = 0; i < n; i++){
          const x = G.px0 + i * G.pw;
          if (p.x >= x && p.x <= x + G.pw && p.y >= G.pedY - 70 && p.y <= G.pedY + 60) target = i;
        }
        const from = slotOfLion(id);
        if (target < 0){
          if (from >= 0) slots[from] = null;            /* back to the pride */
          return;
        }
        if (slots[target] === id) return;
        const displaced = slots[target];
        if (from >= 0) slots[from] = null;
        slots[target] = id;
        if (displaced !== null && displaced !== undefined) { /* bumped lion returns to the pen */ }
        placements++; wrongSet = []; Sfx.click();
        checkOrder();
      }
    };
  }
};

/* ===========================================================================
   PWA: inline manifest (in <head>) + blob-URL service worker
   ========================================================================= */
/* Offline story, honestly:
   A service worker is the only way to make a page load with the network off, and
   the Service Worker spec (and every current engine - Chromium and WebKit alike)
   only accepts a script URL whose scheme is http/https. A blob: or data: script
   URL is refused outright:
     TypeError: Failed to register a ServiceWorker: The URL protocol of the
     script ('blob:http://...') is not supported.
   So a genuinely single-file page cannot install one. We still attempt it (a
   future engine may relax the rule, and it costs nothing), record exactly what
   happened, and report it in Settings instead of implying the game is installed
   and offline-ready when it is not. Everything else - the game, the save data,
   the inline manifest and icon - needs no network at all. */
const SW_STATUS = {supported:false, attempted:false, ok:false, reason:'not attempted'};
function registerSW(){
  SW_STATUS.supported = 'serviceWorker' in navigator;
  if (!SW_STATUS.supported){ SW_STATUS.reason = 'no service worker support'; return; }
  const local = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  if (location.protocol !== 'https:' && !local){
    SW_STATUS.reason = 'needs https (page is ' + location.protocol + ')';
    return;
  }
  const swSource = [
    "const CACHE = 'math-circus-act1-v1';",
    "const DOC = new URL(self.registration.scope).href;",
    "self.addEventListener('install', e => {",
    "  e.waitUntil((async () => {",
    "    const c = await caches.open(CACHE);",
    "    /* one at a time: addAll is atomic, so a single 404 would leave an empty cache */",
    "    await c.add(SELF_URL).catch(() => {});",
    "    if (DOC !== SELF_URL) await c.add(DOC).catch(() => {});",
    "    await self.skipWaiting();",
    "  })());",
    "});",
    "self.addEventListener('activate', e => {",
    "  e.waitUntil(caches.keys().then(ks => Promise.all(ks.filter(k => k !== CACHE).map(k => caches.delete(k)))).then(() => self.clients.claim()));",
    "});",
    "self.addEventListener('fetch', e => {",
    "  if (e.request.method !== 'GET') return;",
    "  e.respondWith(caches.match(e.request, {ignoreSearch:true}).then(hit => hit || fetch(e.request).then(res => {",
    "    if (res && res.ok && res.type === 'basic'){ const copy = res.clone(); caches.open(CACHE).then(c => c.put(e.request, copy)); }",
    "    return res;",
    "  }).catch(() => caches.match(SELF_URL, {ignoreSearch:true}))));",
    "});"
  ].join('\n').replace(/SELF_URL/g, JSON.stringify(location.href.split('#')[0]));
  try {
    const url = URL.createObjectURL(new Blob([swSource], {type:'application/javascript'}));
    SW_STATUS.attempted = true;
    navigator.serviceWorker.register(url)
      .then(() => { SW_STATUS.ok = true; SW_STATUS.reason = 'registered'; })
      .catch(err => { SW_STATUS.reason = (err && err.message) || String(err); });
  } catch(e){ SW_STATUS.reason = (e && e.message) || String(e); }
}

/* ------------------------------------------------------------------- boot */
function boot(){
  loadSave();
  fit();
  requestAnimationFrame(frame);
  registerSW();
}

  tapId(id){
    const r = regions.find(rr2 => rr2.id === id);
    if (!r) throw new Error('no region: ' + id);
    const p = {x:r.x + r.w / 2, y:r.y + r.h / 2};
    const lay = modal ? 'modal' : 'base';
    if (r.layer !== lay) throw new Error('region not on active layer: ' + id);
    pressed = id;
    if (modal) modalUp(r, p, id);
    else if (screen === 'hub') hubUp(r, p, id);
    else if (current) current.up(r, p, id);
    pressed = null;
    return true;
  },
  hasRegion(id){ const lay = modal ? 'modal' : 'base'; return regions.some(r => r.id === id && r.layer === lay); },

};
