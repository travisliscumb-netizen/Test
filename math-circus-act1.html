<style>
  :root{
    --red:#C41E3A; --red-dark:#8E1428; --gold:#F2B705; --cream:#FFF8E7; --ink:#0E1626;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0E1626;
    overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    font-family:-apple-system,"Avenir Next","Trebuchet MS",Verdana,sans-serif;color:var(--cream)}
  #stage{position:fixed;top:env(safe-area-inset-top,0px);left:env(safe-area-inset-left,0px);
    right:env(safe-area-inset-right,0px);bottom:env(safe-area-inset-bottom,0px)}
  #c{display:block;width:100%;height:100%;touch-action:none}
  /* Visible error / status banner: the target device has no attached debugger, so
     anything that would normally be console.error has to be readable on-screen. */
  #toast{position:fixed;left:8px;right:8px;top:calc(env(safe-area-inset-top,0px) + 8px);
    z-index:20;display:none;pointer-events:none;padding:10px 12px;border-radius:12px;
    background:rgba(14,22,38,.94);border:2px solid var(--gold);color:var(--cream);
    font-size:15px;line-height:1.35;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.45)}
  #toast.err{border-color:#FF6B6B}
  #toast b{display:block;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);margin-bottom:2px}
  #toast.err b{color:#FF9B9B}

<div id="stage"><canvas id="c"></canvas></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
/* ============================================================================
   MATH CIRCUS: ACT 1 - fan rebuild (single-file, offline, touch-only)
   Sections: constants | save | audio | engine | draw helpers | hub | games | boot
   ========================================================================= */

/* ---------------------------------------------------------------- constants */
const C = {
  red:'#C41E3A', redDark:'#8E1428', redLight:'#E2536B',
  gold:'#F2B705', goldDark:'#B98B00', goldLight:'#FFD95C',
  cream:'#FFF8E7', creamDark:'#EFE0BF',
  navy:'#12203A', ink:'#0E1626', slate:'#3B4A63',
  green:'#2E9E5B', greenDark:'#1F7442', blue:'#2F6FB5', purple:'#6B4BA8',
  sawdust:'#E0C48C', sawdustDark:'#C9A96A', white:'#FFFFFF'
};
const DISPLAY = '-apple-system,"Avenir Next","Trebuchet MS",Verdana,sans-serif';
/* Numerals get a stack whose 1/l/I and 0/O are unambiguous at small sizes. */
const NUMER   = 'Verdana,Tahoma,"DejaVu Sans","Helvetica Neue",sans-serif';
const DIFFS = ['easy','medium','hard'];
const DIFF_LABEL = {easy:'Easy', medium:'Medium', hard:'Hard'};
const DIFF_COLOR = {easy:C.green, medium:C.blue, hard:C.red};

/* ------------------------------------------------------------------- save */
const SAVE_KEY = 'mathCircusSave';
const SAVE_VERSION = 1;
const GAME_IDS = ['seals','trapeze','magician','traffic','cannon','riddle',
                  'balance','tickets','elephant','bolts','clowns','lions'];
/* Which per-game number we keep, and whether bigger is better. */
const SCORE_FIELD = {
  seals:'bestMoves', trapeze:'bestStreak', magician:'bestHits', traffic:'bestTries',
  cannon:'bestShots', riddle:'bestMisses', balance:'bestMoves', tickets:'bestCorrect',
  elephant:'bestPours', bolts:'bestTaps', clowns:'bestMoves', lions:'bestFixes'
};
const SCORE_HIGHER = {trapeze:true, tickets:true};
const SCORE_LABEL = {
  seals:'Fewest swaps', trapeze:'Best clean run', magician:'Fewest hits', traffic:'Fewest tries',
  cannon:'Fewest shots', riddle:'Fewest misses', balance:'Fewest moves', tickets:'Best served',
  elephant:'Fewest pours', bolts:'Fewest taps', clowns:'Fewest commands', lions:'Fewest fixes'
};

function freshSave(){
  const g = {};
  for (const id of GAME_IDS) g[id] = {stars:0, [SCORE_FIELD[id]]:null, difficulty:'easy'};
  return {version:SAVE_VERSION, games:g, settings:{sound:true}};
}
let gameState = freshSave();

function loadSave(){
  let raw = null;
  try { raw = localStorage.getItem(SAVE_KEY); } catch(e){ raw = null; }
  const fresh = freshSave();
  if (!raw) { gameState = fresh; return; }
  let parsed = null;
  try { parsed = JSON.parse(raw); } catch(e){ parsed = null; }
  if (!parsed || typeof parsed !== 'object') { gameState = fresh; return; }
  /* Merge field by field so a partial or older blob can never throw. */
  const out = fresh;
  if (parsed.settings && typeof parsed.settings.sound === 'boolean') out.settings.sound = parsed.settings.sound;
  const pg = parsed.games && typeof parsed.games === 'object' ? parsed.games : {};
  for (const id of GAME_IDS){
    const src = pg[id];
    if (!src || typeof src !== 'object') continue;
    const st = Number(src.stars);
    if (Number.isFinite(st)) out.games[id].stars = Math.max(0, Math.min(3, Math.round(st)));
    const f = SCORE_FIELD[id], v = Number(src[f]);
    if (src[f] !== null && src[f] !== undefined && Number.isFinite(v)) out.games[id][f] = v;
    if (DIFFS.includes(src.difficulty)) out.games[id].difficulty = src.difficulty;
  }
  gameState = out;
}
function persist(){
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(gameState)); return true; }
  catch(e){ toast('Progress could not be saved on this device.', true); return false; }
}
function recordResult(id, stars, scoreValue){
  const rec = gameState.games[id];
  if (!rec) return;
  rec.stars = Math.max(rec.stars, stars);
  const f = SCORE_FIELD[id];
  if (Number.isFinite(scoreValue)){
    const cur = rec[f];
    if (cur === null || cur === undefined) rec[f] = scoreValue;
    else rec[f] = SCORE_HIGHER[id] ? Math.max(cur, scoreValue) : Math.min(cur, scoreValue);
  }
  persist();
}

/* ------------------------------------------------------------------ toast */
let toastTimer = 0, lastToastMsg = '', lastToastAt = 0;
function toast(msg, isError){
  const el = document.getElementById('toast');
  if (!el) return;
  const now = Date.now();
  if (msg === lastToastMsg && now - lastToastAt < 4000) return; /* don't spam */
  lastToastMsg = msg; lastToastAt = now;
  el.className = isError ? 'err' : '';
  el.innerHTML = '<b>' + (isError ? 'Something went wrong' : 'Note') + '</b>';
  el.appendChild(document.createTextNode(msg));
  el.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.style.display = 'none'; }, isError ? 7000 : 3200);
}
window.addEventListener('error', e => toast((e.message || 'Unknown error'), true));
window.addEventListener('unhandledrejection', e => toast('Async error: ' + (e.reason && e.reason.message || e.reason), true));

/* ------------------------------------------------------------------ audio */
const Sfx = {
  ctx:null,
  ensure(){
    if (!gameState.settings.sound) return null;
    try {
      if (!this.ctx){
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        this.ctx = new AC();
      }
      if (this.ctx.state === 'suspended') this.ctx.resume();
      return this.ctx;
    } catch(e){ return null; }
  },
  tone(freq, dur, when, type, vol){
    const ac = this.ensure(); if (!ac) return;
    const t0 = ac.currentTime + (when || 0);
    const osc = ac.createOscillator(), g = ac.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.16, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g); g.connect(ac.destination);
    osc.start(t0); osc.stop(t0 + dur + 0.02);
  },
  click(){ this.tone(880, 0.05, 0, 'square', 0.05); },
  good(){ this.tone(660, 0.12, 0, 'sine', 0.14); this.tone(990, 0.20, 0.10, 'sine', 0.14); },
  bad(){ this.tone(150, 0.22, 0, 'sawtooth', 0.10); },
  fanfare(){ this.tone(523, 0.16, 0, 'triangle', 0.15); this.tone(659, 0.16, 0.15, 'triangle', 0.15);
             this.tone(784, 0.32, 0.30, 'triangle', 0.17); this.tone(1046, 0.40, 0.46, 'triangle', 0.13); },
  pop(){ this.tone(420, 0.07, 0, 'triangle', 0.10); }
};

/* ----------------------------------------------------------------- engine */
const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d');
/* Virtual coordinate space: 360 wide, height follows the device aspect so the
   layout breathes on tall phones instead of letterboxing. */
const V = {w:360, h:640, s:1, ox:0, oy:0};
let DPR = 1;

function fit(){
  const rect = cvs.getBoundingClientRect();
  const cw = Math.max(1, rect.width), ch = Math.max(1, rect.height);
  DPR = Math.min(3, window.devicePixelRatio || 1);
  cvs.width = Math.round(cw * DPR); cvs.height = Math.round(ch * DPR);
  let s = cw / V.w, vh = ch / s;
  if (vh > 900){ vh = 900; s = ch / vh; }
  if (vh < 560){ vh = 560; s = ch / vh; }
  V.h = vh; V.s = s;
  V.ox = (cw - V.w * s) / 2;
  V.oy = (ch - V.h * s) / 2;
}
window.addEventListener('resize', fit);
window.addEventListener('orientationchange', () => setTimeout(fit, 120));

/* Hit regions are rebuilt by draw() every frame; input hit-tests the last frame.
   Topmost (drawn last) wins. */
let regions = [], layer = 'base';
function reg(id, x, y, w, h, data){
  const r = Object.assign({id, x, y, w, h, layer}, data || {});
  regions.push(r); return r;
}
function pick(x, y){
  for (let i = regions.length - 1; i >= 0; i--){
    const r = regions[i];
    if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) return r;
  }
  return null;
}
function inRect(r, x, y){ return x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h; }

/* screen: 'hub' | 'game'   modal: null | {kind:...} */
let screen = 'hub';
let current = null;         /* active game module instance */
let modal = null;
let pressed = null;         /* region id currently held, for button feedback */
let hubTime = 0;

function openModal(m){ modal = m; }
function closeModal(){ modal = null; }

function goHub(){
  current = null; screen = 'hub'; modal = null; pressed = null;
}
function startGame(id, diff){
  const def = GAMES[id];
  if (!def){ toast('Unknown game: ' + id, true); return; }
  gameState.games[id].difficulty = diff; persist();
  try {
    current = def.create(diff);
    current.id = id; current.def = def; current.diff = diff;
    current.done = false;
    /* Wrap input so the always-visible chrome (Big Top / pause) is handled once,
       centrally, instead of being re-implemented by every game module. */
    const rawUp = current.up, rawDown = current.down;
    current.up = function(hit, p, wasPressed){
      if (chromeUp(hit, wasPressed)) return;
      if (rawUp) rawUp.call(current, hit, p, wasPressed);
    };
    current.down = function(hit, p){
      if (hit && typeof hit.id === 'string' && hit.id.indexOf('g_') === 0){ Sfx.click(); return; }
      if (rawDown) rawDown.call(current, hit, p);
    };
    screen = 'game'; modal = null;
  } catch(e){ toast('Could not start ' + def.name + ': ' + e.message, true); goHub(); }
}
function restartGame(){
  if (!current) return;
  startGame(current.id, current.diff);
}
/* Called by a game when the player finishes a level. */
function finishGame(stars, scoreValue, message){
  if (!current || current.done) return;
  current.done = true;
  stars = Math.max(0, Math.min(3, stars));
  const prev = gameState.games[current.id].stars;
  recordResult(current.id, stars, scoreValue);
  if (stars >= 3) Sfx.fanfare(); else Sfx.good();
  openModal({kind:'result', stars, message: message || '', t:0, improved: stars > prev});
}
function failGame(message){
  if (!current || current.done) return;
  current.done = true;
  Sfx.bad();
  openModal({kind:'result', stars:0, message: message || 'Not this time!', t:0, failed:true});
}

/* ------------------------------------------------------------------ input */
function toV(e){
  const rect = cvs.getBoundingClientRect();
  return {x:(e.clientX - rect.left - V.ox) / V.s, y:(e.clientY - rect.top - V.oy) / V.s};
}
function guard(fn){
  return function(e){
    try { fn(e); }
    catch(err){ toast(err && err.message ? err.message : String(err), true); }
  };
}
cvs.addEventListener('pointerdown', guard(e => {
  e.preventDefault();
  if (cvs.setPointerCapture) { try { cvs.setPointerCapture(e.pointerId); } catch(_){} }
  Sfx.ensure();
  const p = toV(e), r = pick(p.x, p.y);
  const lay = modal ? 'modal' : 'base';
  const hit = r && r.layer === lay ? r : null;
  pressed = hit ? hit.id : null;
  if (modal) { modalDown(hit, p); return; }
  if (screen === 'hub') hubDown(hit, p);
  else if (current && current.down) current.down(hit, p);
}), {passive:false});

cvs.addEventListener('pointermove', guard(e => {
  e.preventDefault();
  const p = toV(e);
  if (modal) return;
  if (screen === 'game' && current && current.move) current.move(p);
}), {passive:false});

const onUp = guard(e => {
  e.preventDefault();
  const p = toV(e), r = pick(p.x, p.y);
  const lay = modal ? 'modal' : 'base';
  const hit = r && r.layer === lay ? r : null;
  const wasPressed = pressed; pressed = null;
  if (modal) { modalUp(hit, p, wasPressed); return; }
  if (screen === 'hub') hubUp(hit, p, wasPressed);
  else if (current && current.up) current.up(hit, p, wasPressed);
});
cvs.addEventListener('pointerup', onUp, {passive:false});
cvs.addEventListener('pointercancel', guard(e => { pressed = null; if (current && current.cancel) current.cancel(); }), {passive:false});
document.addEventListener('gesturestart', e => e.preventDefault());

/* ------------------------------------------------------------- draw utils */
function rr(g, x, y, w, h, r){
  r = Math.max(0, Math.min(r, Math.min(w, h) / 2));
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}
function panel(x, y, w, h, o){
  o = o || {};
  const g = ctx;
  if (o.shadow !== false){
    g.save(); g.globalAlpha = 0.22; g.fillStyle = C.ink;
    rr(g, x + 2, y + 4, w, h, o.r == null ? 14 : o.r); g.fill(); g.restore();
  }
  g.fillStyle = o.fill || C.cream;
  rr(g, x, y, w, h, o.r == null ? 14 : o.r); g.fill();
  if (o.stroke !== false){
    g.lineWidth = o.lw || 3; g.strokeStyle = o.stroke || C.navy; g.stroke();
  }
}
function T(s, x, y, o){
  o = o || {};
  const g = ctx;
  g.font = (o.weight || 700) + ' ' + (o.size || 16) + 'px ' + (o.num ? NUMER : DISPLAY);
  g.textAlign = o.align || 'center';
  g.textBaseline = o.baseline || 'middle';
  if (o.outline){ g.lineWidth = o.outline; g.strokeStyle = o.outlineColor || C.ink;
    g.lineJoin = 'round'; g.strokeText(s, x, y); }
  g.fillStyle = o.color || C.ink;
  if (o.maxWidth) g.fillText(s, x, y, o.maxWidth); else g.fillText(s, x, y);
}
/* Word-wrap into lines that fit `w`; returns number of lines drawn. */
function Twrap(s, x, y, w, lh, o){
  o = o || {};
  const g = ctx;
  g.font = (o.weight || 600) + ' ' + (o.size || 15) + 'px ' + (o.num ? NUMER : DISPLAY);
  const words = String(s).split(' ');
  const lines = []; let line = '';
  for (const wd of words){
    const t = line ? line + ' ' + wd : wd;
    if (g.measureText(t).width > w && line){ lines.push(line); line = wd; }
    else line = t;
  }
  if (line) lines.push(line);
  for (let i = 0; i < lines.length; i++) T(lines[i], x, y + i * lh, o);
  return lines.length;
}
function starPath(g, cx, cy, r){
  g.beginPath();
  for (let i = 0; i < 10; i++){
    const a = -Math.PI / 2 + i * Math.PI / 5, rr2 = (i % 2) ? r * 0.44 : r;
    const px = cx + Math.cos(a) * rr2, py = cy + Math.sin(a) * rr2;
    if (i === 0) g.moveTo(px, py); else g.lineTo(px, py);
  }
  g.closePath();
}
function drawStar(cx, cy, r, filled, o){
  o = o || {};
  const g = ctx;
  starPath(g, cx, cy, r);
  g.fillStyle = filled ? (o.fill || C.gold) : 'rgba(255,255,255,.12)';
  g.fill();
  g.lineWidth = o.lw || 1.6;
  g.strokeStyle = filled ? (o.stroke || C.goldDark) : (o.stroke || 'rgba(14,22,38,.45)');
  g.stroke();
}
function drawStars(cx, cy, n, r, gap, o){
  const total = 3, step = r * 2 + (gap == null ? 3 : gap);
  const x0 = cx - (total - 1) * step / 2;
  for (let i = 0; i < total; i++) drawStar(x0 + i * step, cy, r, i < n, o);
}
function button(id, x, y, w, h, label, o){
  o = o || {};
  const g = ctx, down = pressed === id && !o.disabled;
  const dy = down ? 2 : 0;
  const r = reg(id, x, y, w, h, {disabled:!!o.disabled});
  g.save();
  g.globalAlpha = o.disabled ? 0.45 : 1;
  /* base shadow */
  g.fillStyle = o.shade || C.ink; g.globalAlpha *= 0.85;
  rr(g, x, y + 4, w, h, o.r == null ? 12 : o.r); g.fill();
  g.globalAlpha = o.disabled ? 0.45 : 1;
  g.fillStyle = o.fill || C.gold;
  rr(g, x, y + dy, w, h - 2, o.r == null ? 12 : o.r); g.fill();
  g.lineWidth = 2.5; g.strokeStyle = o.stroke || C.navy; g.stroke();
  T(label, x + w / 2, y + dy + (h - 2) / 2 + 1, {
    size:o.size || 17, weight:800, color:o.color || C.ink, num:!!o.num, maxWidth:w - 14
  });
  g.restore();
  return r;
}
function scrim(a){
  ctx.fillStyle = 'rgba(8,13,24,' + (a == null ? 0.66 : a) + ')';
  ctx.fillRect(-40, -40, V.w + 80, V.h + 80);
}
/* Big-top stripes radiating from a peak above the screen. */
function tentBackdrop(){
  const g = ctx;
  g.fillStyle = C.cream; g.fillRect(0, 0, V.w, V.h);
  const apexX = V.w / 2, apexY = -260, n = 14;
  for (let i = 0; i < n; i++){
    if (i % 2) continue;
    const spread = V.w * 2.2;
    const x1 = apexX - spread / 2 + spread * (i / n);
    const x2 = apexX - spread / 2 + spread * ((i + 1) / n);
    g.beginPath(); g.moveTo(apexX, apexY); g.lineTo(x1, V.h + 40); g.lineTo(x2, V.h + 40);
    g.closePath(); g.fillStyle = C.red; g.globalAlpha = 0.92; g.fill(); g.globalAlpha = 1;
  }
}
function sawdustFloor(y){
  const g = ctx;
  g.fillStyle = C.sawdust; g.fillRect(0, y, V.w, V.h - y);
  g.fillStyle = C.sawdustDark; g.globalAlpha = 0.5;
  for (let i = 0; i < 90; i++){
    const px = ((i * 97) % 360), py = y + 6 + ((i * 53) % Math.max(10, (V.h - y - 10)));
    g.fillRect(px, py, 3, 2);
  }
  g.globalAlpha = 1;
  g.fillStyle = C.navy; g.fillRect(0, y - 2, V.w, 2);
}
function bunting(y, w){
  const g = ctx, n = 12, step = (w || V.w) / n;
  g.strokeStyle = C.navy; g.lineWidth = 2;
  g.beginPath(); g.moveTo(0, y); g.lineTo(w || V.w, y); g.stroke();
  for (let i = 0; i < n; i++){
    g.beginPath();
    g.moveTo(i * step, y); g.lineTo((i + 1) * step, y); g.lineTo(i * step + step / 2, y + 13);
    g.closePath();
    g.fillStyle = (i % 3 === 0) ? C.gold : (i % 3 === 1) ? C.cream : C.red;
    g.fill(); g.lineWidth = 1.5; g.strokeStyle = C.navy; g.stroke();
  }
}

      g.lineTo(x + Math.cos(a2) * s * 0.74, y + Math.sin(a2) * s * 0.74);
    }
    g.closePath(); g.fill();
    g.strokeStyle = C.navy; g.lineWidth = 2; g.stroke();
    g.fillStyle = C.red;
    g.beginPath(); g.arc(x, y, s * 0.34, 0, 7); g.fill();
  }
};

/* ===========================================================================
   GAME 1 - SEALS & BALLS  (sequencing / number matching)
   ========================================================================= */
function minSwapsOf(perm){
  const n = perm.length, seen = new Array(n).fill(false);
  let cycles = 0;
  for (let i = 0; i < n; i++){
    if (seen[i]) continue;
    cycles++;
    let j = i;
    while (!seen[j]){ seen[j] = true; j = perm[j] - 1; }
  }
  return n - cycles;
}
GAMES.seals = {
  name:'Seals & Balls', short:'Seals & Balls', skill:'Sequencing & matching',
  desc:'Every seal wants the ball that matches the number on its stand. Tap one ball, then tap another to swap them.',
  create(diff){
    const conf = {easy:{n:4, cols:2, lo:1, hi:1}, medium:{n:6, cols:3, lo:2, hi:3},
                  hard:{n:9, cols:3, lo:4, hi:8}}[diff];
    let perm = null, par = 0;
    for (let tries = 0; tries < 800; tries++){
      const cand = shuffle(Array.from({length:conf.n}, (_, i) => i + 1));
      const p = minSwapsOf(cand);
      if (p >= conf.lo && p <= conf.hi){ perm = cand; par = p; break; }
    }
    if (!perm){ /* guaranteed fallback: build a cycle of exactly conf.lo+1 length */
      perm = Array.from({length:conf.n}, (_, i) => i + 1);
      for (let i = 0; i <= conf.lo; i++){ const j = (i + 1) % (conf.lo + 1); const t = perm[i]; perm[i] = perm[j]; perm[j] = t; }
      par = minSwapsOf(perm);
    }
    let sel = null, moves = 0, flash = 0;
    const cellsRect = () => {
      const rows = Math.ceil(conf.n / conf.cols);
      const top = 118, bot = V.h - 20;
      const cw = Math.min((V.w - 24) / conf.cols, 116);
      const ch = Math.min((bot - top) / rows, 132);
      const x0 = (V.w - cw * conf.cols) / 2;
      const y0 = top + Math.min(24, Math.max(0, (bot - top) - ch * rows));
      return {cw, ch, x0, y0, rows};
    };
    function solved(){ return perm.every((v, i) => v === i + 1); }
    return {
      debug(){ return {perm:perm.slice(), par, moves, sel, n:conf.n}; },
      hudNote(){ return 'Swaps ' + moves + '  ·  par ' + par; },
      update(dt){ if (flash > 0) flash = Math.max(0, flash - dt); },
      draw(){
        const g = ctx;
        g.fillStyle = C.cream; g.fillRect(0, 0, V.w, V.h);
        sawdustFloor(V.h - 26);
        instr('Tap two balls to swap them. Ball number must match the stand number.');
        const L = cellsRect();
        for (let i = 0; i < conf.n; i++){
          const col = i % conf.cols, row = (i / conf.cols) | 0;
          const x = L.x0 + col * L.cw, y = L.y0 + row * L.ch;
          reg('s' + i, x, y, L.cw, L.ch, {});
          const cx = x + L.cw / 2, cy = y + L.ch / 2, S = Math.min(L.cw, L.ch);
          const ok = perm[i] === i + 1, isSel = sel === i;
          /* stand */
          g.fillStyle = ok ? C.green : C.navy;
          rr(g, cx - S * 0.28, cy + S * 0.26, S * 0.56, S * 0.2, 5); g.fill();
          T(String(i + 1), cx, cy + S * 0.36, {size:S * 0.15, weight:800, color:C.gold, num:true});
          /* seal */
          g.fillStyle = '#6E7C8F';
          g.beginPath(); g.ellipse(cx - S * 0.05, cy + S * 0.12, S * 0.28, S * 0.13, 0, 0, 7); g.fill();
          g.beginPath(); g.ellipse(cx + S * 0.11, cy - S * 0.05, S * 0.1, S * 0.16, 0.25, 0, 7); g.fill();
          g.fillStyle = C.ink;
          g.beginPath(); g.arc(cx + S * 0.14, cy - S * 0.12, S * 0.025, 0, 7); g.fill();
          g.strokeStyle = '#6E7C8F'; g.lineWidth = S * 0.06; g.lineCap = 'round';
          g.beginPath(); g.moveTo(cx + S * 0.14, cy - S * 0.19); g.lineTo(cx + S * 0.05, cy - S * 0.26); g.stroke();

          g.beginPath(); g.arc(bx, by, br * 0.62, Math.PI * 0.9, Math.PI * 1.6); g.stroke();

      },
      up(hit, p, wasPressed){
        if (!hit || hit.id !== wasPressed || hit.id[0] !== 's') return;

};

GAMES.trapeze = {
  name:'Trapeze Timing', short:'Trapeze', skill:'Timing & estimation',
  desc:'Let go at the very top of the swing, then tap again the instant you meet the next bar.',
  create(diff){
    const conf = {easy:{gaps:1, win:0.40, T:2.4, dT:0}, medium:{gaps:2, win:0.25, T:1.8, dT:0.0},
                  hard:{gaps:3, win:0.15, T:1.5, dT:0.15}}[diff];
    /* Rig geometry scales with viewport height. The amplitude is derived from the
       rope length so the widest swing always stays on screen at any phone size. */
    function geo(){
      const ny = V.h - 46, piv = 150;
      const L = Math.max(110, Math.min(196, (ny - piv) * 0.45));
      return {ny, piv, L, A: Math.min(0.55, Math.asin(Math.min(0.95, 50 / L)))};
    }
    const n = conf.gaps + 1;
    const bars = [];
    for (let i = 0; i < n; i++){
      const x = n === 1 ? V.w / 2 : 58 + i * ((V.w - 116) / (n - 1));
      bars.push({x, T: Math.max(0.8, conf.T - conf.dT * i), phase: Math.random() * Math.PI * 2});
    }
    let t = 0, idx = 0, phase = 'swing', arriveT = 0, flyFrom = null, flyTo = null, flyStart = 0;
    let misses = 0, streak = 0, best = 0, fallT = 0, fallFrom = null, msg = '', msgT = 0;
    const w2 = bar => 2 * Math.PI / bar.T;
    const ang = bar => geo().A * Math.cos(w2(bar) * t + bar.phase);
    const posOf = (bar, a) => {
      const G = geo();
      return {x: bar.x + Math.sin(a) * G.L, y: G.piv + Math.cos(a) * G.L};
    };
    function errToRightApex(bar){
      const u = ((w2(bar) * t + bar.phase) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);
      return Math.min(u, 2 * Math.PI - u) / w2(bar);
    }
    function nextLeftApex(bar, after){
      const w = w2(bar);
      const k = Math.ceil((after * w + bar.phase - Math.PI) / (2 * Math.PI));
      return (Math.PI + 2 * Math.PI * k - bar.phase) / w;
    }
    function fall(reason){
      fallFrom = artistPos();           /* capture BEFORE the phase flips */

      if (phase === 'swing'){ const b = bars[idx]; const p = posOf(b, ang(b)); return {x:p.x, y:p.y + 22}; }
      if (phase === 'fly'){

                y: flyFrom.y + (flyTo.y - flyFrom.y) * u - Math.sin(Math.PI * u) * 58};

      if (phase === 'fall'){
        const u = Math.min(1, fallT / 0.75);
        return {x: fallFrom.x, y: fallFrom.y + u * u * (V.h - 52 - fallFrom.y)};

      const b = bars[idx]; const p = posOf(b, ang(b)); return {x:p.x, y:p.y + 22};

    function release(){

      const e = errToRightApex(b);

      const target = bars[idx + 1];
      arriveT = nextLeftApex(target, t + 0.75);

      flyFrom = artistPos();
      const aArrive = geo().A * Math.cos(w2(target) * arriveT + target.phase);

      idx++; streak++; best = Math.max(best, streak);

          : 'Across in ' + (misses + 1) + ' attempts (' + misses + ' fall' + (misses === 1 ? '' : 's') + ').');
      } else { phase = 'swing'; msg = 'Caught it!'; msgT = 1.0; }

    return {
      debug(){
        const b = bars[Math.min(idx, bars.length - 1)];
        const err = phase === 'swing' ? errToRightApex(b) : phase === 'fly' ? Math.abs(t - arriveT) : 99;

      },
      hudNote(){ return 'Gap ' + Math.min(idx + 1, conf.gaps) + '/' + conf.gaps + '  ·  falls ' + misses; },
      update(dt){

        g.fillStyle = 'rgba(8,13,24,.55)';
        for (let i = 0; i < 16; i++){

/* ===========================================================================
   GAME 3 - MAGICIAN'S RESCUE  (pattern recognition / sequences)
   ========================================================================= */
function seqDistractors(ans, step, k){
  const cands = [ans + 1, ans - 1, ans + 2, ans - 2, ans + step, ans - step,
                 ans * 2, Math.round(ans / 2), ans + 3, ans - 3, ans + 2 * step];
  const out = [];
  for (const c of shuffle(cands.slice()))
    if (c !== ans && c >= 0 && Number.isFinite(c) && out.indexOf(c) < 0) out.push(c);
  while (out.length < k) out.push(ans + out.length + 4);
  return out.slice(0, k);
}
/* who: 'witch' (additive families) | 'monster' (multiplying / two-step families) */
function makeSequence(diff, who){
  const n = 5;
  let terms = [], rule = '', step = 1;
  if (diff === 'easy'){
    const d = who === 'witch' ? rndI(1, 2) : rndI(2, 3);
    const a = rndI(1, 9);
    for (let i = 0; i < n; i++) terms.push(a + i * d);
    rule = 'add ' + d + ' each time'; step = d;
  } else if (diff === 'medium'){
    if (who === 'witch'){
      const down = Math.random() < 0.5, d = rndI(2, 5);
      const a = down ? rndI(30, 48) : rndI(2, 12);
      for (let i = 0; i < n; i++) terms.push(down ? a - i * d : a + i * d);
      rule = (down ? 'subtract ' : 'add ') + d + ' each time'; step = d;
    } else {
      const r = rndI(2, 3), a = rndI(1, 4);
      for (let i = 0; i < n; i++) terms.push(a * Math.pow(r, i));
      rule = 'multiply by ' + r + ' each time'; step = a * (r - 1);
    }
  } else {
    if (who === 'witch'){
      const d = rndI(1, 4), m = 2, a = rndI(1, 5);
      terms.push(a);
      for (let i = 1; i < n; i++) terms.push(i % 2 ? terms[i - 1] + d : terms[i - 1] * m);
      rule = 'add ' + d + ', then double, repeating'; step = d;
    } else {
      const d = rndI(1, 3), k = rndI(1, 3), a = rndI(1, 8);
      terms.push(a);
      for (let i = 1; i < n; i++) terms.push(terms[i - 1] + d + (i - 1) * k);
      rule = 'the gap grows by ' + k + ' each time'; step = d + k;
    }
  }
  const hideIdx = rndI(2, n - 1);
  return {terms, hideIdx, answer:terms[hideIdx], rule, step};
}

        g.fillStyle = '#F0C9A0';
        g.beginPath(); g.arc(cx, sceneY + 40, 11, 0, 7); g.fill();
        g.fillStyle = C.blue;
        g.beginPath(); g.moveTo(cx - 15, sceneY + 32); g.lineTo(cx + 15, sceneY + 32); g.lineTo(cx, sceneY + 4); g.closePath(); g.fill();
        g.fillStyle = C.gold; starPath(g, cx, sceneY + 24, 5); g.fill();
        const barsLeft = Math.max(0, 5 - Math.round(round / conf.rounds * 5));
        g.strokeStyle = 'rgba(255,248,231,.75)'; g.lineWidth = 3;
        for (let i = 0; i < barsLeft; i++){
          const bx = cx - 26 + i * 13;
          g.beginPath(); g.moveTo(bx, sceneY + 2); g.lineTo(bx, sceneY + 96); g.stroke();
        }
        g.restore();
        /* sequence row */
        const by = sceneY + sceneH + 8, bw = 56, bh = 50, gap = 6;
        const x0 = (V.w - (5 * bw + 4 * gap)) / 2;
        for (let i = 0; i < 5; i++){
          const bx = x0 + i * (bw + gap), hidden = i === q.hideIdx;
          const reveal = hidden && phase !== 'ask';
          panel(bx, by, bw, bh, {fill: hidden ? (reveal ? C.green : C.navy) : C.cream,
            stroke: hidden ? C.gold : C.navy, r:10, lw: hidden ? 3 : 2});
          T(hidden && !reveal ? '?' : String(q.terms[i]), bx + bw / 2, by + bh / 2,
            {size: hidden && !reveal ? 26 : 20, weight:800,
             color: hidden ? (reveal ? C.cream : C.gold) : C.navy, num:true, maxWidth:bw - 8});
        }
        /* timer */
        const tw = 260, tx = (V.w - tw) / 2, ty = by + bh + 12;
        const frac = Math.max(0, timer / conf.time);
        panel(tx, ty, tw, 14, {fill:'rgba(8,13,24,.55)', stroke:C.cream, r:7, lw:2, shadow:false});
        g.save(); g.beginPath(); rr(g, tx, ty, tw, 14, 7); g.clip();
        g.fillStyle = frac > 0.5 ? C.green : frac > 0.25 ? C.gold : C.red;
        g.fillRect(tx, ty, tw * frac, 14);
        g.restore();
        /* options */
        const oy = ty + 30, ow = 150, oh = 62, ogap = 10;
        const ox0 = (V.w - (2 * ow + ogap)) / 2;
        for (let i = 0; i < options.length; i++){
          const col = i % 2, row = (i / 2) | 0;
          const bx = ox0 + col * (ow + ogap), byy = oy + row * (oh + ogap);
          let fill = C.cream, col2 = C.navy;
          if (phase !== 'ask'){
            if (options[i] === q.answer){ fill = C.green; col2 = C.cream; }
            else if (i === chosen){ fill = C.red; col2 = C.cream; }
          }
          button('o' + i, bx, byy, ow, oh, String(options[i]),
            {fill, color:col2, size:26, num:true, r:14});
        }
        if (phase === 'feedback'){
          T(chosen >= 0 && options[chosen] === q.answer ? 'Correct!' : (chosen < 0 ? 'Too slow!' : 'Wrong!'),
            V.w / 2, oy + 2 * (oh + ogap) + 14,
            {size:17, weight:800, color: chosen >= 0 && options[chosen] === q.answer ? C.green : C.red});
          T('Pattern: ' + q.rule, V.w / 2, oy + 2 * (oh + ogap) + 36,
            {size:12.5, weight:700, color:C.creamDark});
        }
      },
      up(hit, p, wasPressed){
        if (!hit || hit.id !== wasPressed || hit.id[0] !== 'o') return;
        answer(parseInt(hit.id.slice(1), 10));
      }
    };
  }
};

/* ===========================================================================
   GAME 4 - CIRCUS TRAFFIC  (elapsed time / route comparison)
   ========================================================================= */
function fmtMin(m){
  const w = Math.floor(m + 1e-9), half = Math.abs(m - w - 0.5) < 1e-9;
  return (w === 0 && half ? '' : String(w)) + (half ? '½' : '') + ' min';
}
GAMES.traffic = {
  name:'Circus Traffic', short:'Traffic', skill:'Adding times',
  desc:'Add up each route - driving plus every traffic-light wait - and pick the one that reaches the big top before the deadline.',
  create(diff){
    const conf = {easy:{routes:2, half:false, maxSeg:6, segs:[3, 3], transfer:false},
                  medium:{routes:3, half:false, maxSeg:14, segs:[4, 5], transfer:true},
                  hard:{routes:3, half:true, maxSeg:12, segs:[4, 5], transfer:true}}[diff];
    const NAMES = ['River Road', 'Market Street', 'Old Mill Lane'];
    let routes = null, deadline = 0;
    for (let attempt = 0; attempt < 400; attempt++){
      const rs = [];
      for (let i = 0; i < conf.routes; i++){
        const count = rndI(conf.segs[0], conf.segs[1]);
        const segs = [];
        for (let j = 0; j < count; j++){
          const isLight = j % 2 === 1 && j !== count - 1;
          let m = isLight ? rndI(1, 3) : rndI(2, conf.maxSeg);
          if (conf.half && Math.random() < 0.55) m += 0.5;
          segs.push({kind: isLight ? 'light' : 'drive', mins:m});
        }
        if (conf.transfer && i === 0) segs.splice(Math.min(2, segs.length - 1), 0, {kind:'transfer', mins: conf.half ? 1.5 : 2});
        rs.push({name:NAMES[i], segs, total: segs.reduce((a, b) => a + b.mins, 0)});
      }
      const totals = rs.map(r => r.total).slice().sort((a, b) => a - b);
      if (totals[1] - totals[0] < 1.5) continue;
      if (conf.routes === 3 && totals[2] - totals[1] < 1) continue;
      const cap = diff === 'easy' ? 20 : 60;
      if (totals[totals.length - 1] > cap) continue;
      if (diff === 'hard' && !rs.some(r => Math.abs(r.total % 1 - 0.5) < 1e-9)) continue;
      routes = rs;
      deadline = totals[0] + (conf.half ? 0.5 : 1);
      break;
    }
    if (!routes){
      routes = [{name:NAMES[0], segs:[{kind:'drive', mins:4}, {kind:'light', mins:2}, {kind:'drive', mins:3}], total:9},
                {name:NAMES[1], segs:[{kind:'drive', mins:6}, {kind:'light', mins:3}, {kind:'drive', mins:5}], total:14}];
      deadline = 10;
    }
    const onTime = routes.filter(r => r.total <= deadline);
    let phase = 'choose', sel = -1, tries = 0, options = [], wrongIdx = -1, note = '', noteT = 0;
    function buildOptions(total){
      const set = [total];
      const deltas = conf.half ? [0.5, -0.5, 1, -1, 1.5, 2] : [1, -1, 2, -2, 3, 5];
      for (const d of shuffle(deltas.slice())){
        const v = total + d;
        if (v > 0 && set.indexOf(v) < 0) set.push(v);
        if (set.length === 4) break;
      }
      return shuffle(set);
    }
    return {
      debug(){ return {phase, tries, deadline, totals:routes.map(r => r.total), sel,
                       options:options.slice(), onTime:routes.map(r => r.total <= deadline)}; },
      hudNote(){ return 'Be there in ' + fmtMin(deadline) + '  ·  tries ' + tries; },
      update(dt){ if (noteT > 0) noteT -= dt; },
      draw(){
        const g = ctx;
        g.fillStyle = C.cream; g.fillRect(0, 0, V.w, V.h);
        const top = instr(phase === 'choose'
          ? 'Total up each route, then tap the one that arrives in ' + fmtMin(deadline) + ' or less.'
          : 'How long is ' + routes[sel].name + ' in total?');
        /* Pad is computed from the TALLEST layout (map + answer panel) so the map
           does not jump when the answer choices appear. */
        const laneHs = routes.map(r => 30 + Math.ceil(r.segs.length / 4) * 34);
        const contentH = 42 + laneHs.reduce((a, b) => a + b + 8, 0) + 16 + 22 + 2 * 64 + 48;
        const pad = Math.max(0, Math.min(50, (V.h - top - contentH) / 2));
        panel(8, top + 8 + pad, V.w - 16, 34, {fill:C.gold, stroke:C.navy, r:10, lw:2, shadow:false});
        T('⏱  Deadline: ' + fmtMin(deadline), V.w / 2, top + 25 + pad, {size:15, weight:800, color:C.ink, num:true});
        let y = top + 52 + pad;
        for (let i = 0; i < routes.length; i++){
          const r = routes[i];
          const chips = r.segs.length;
          const perRow = 4, rows = Math.ceil(chips / perRow);
          const laneH = 30 + rows * 34;
          const active = phase === 'total' && sel === i;
          if (phase === 'choose') reg('r' + i, 8, y, V.w - 16, laneH, {});
          panel(8, y, V.w - 16, laneH, {
            fill: active ? '#E8F3EA' : (pressed === 'r' + i ? C.creamDark : C.white),
            stroke: active ? C.green : C.navy, r:12, lw: active ? 3 : 2, shadow:false});
          T(r.name, 18, y + 15, {size:13.5, weight:800, color:C.navy, align:'left'});
          if (phase === 'choose') T('TAP TO PICK', V.w - 18, y + 15, {size:10.5, weight:800, color:C.slate, align:'right'});
          for (let j = 0; j < chips; j++){
            const col = j % perRow, row = (j / perRow) | 0;
            const cw = (V.w - 32) / perRow, cx = 16 + col * cw, cy = y + 26 + row * 34;
            const s = r.segs[j];
            const fill = s.kind === 'light' ? C.red : s.kind === 'transfer' ? C.purple : C.blue;
            panel(cx, cy, cw - 6, 28, {fill, stroke:C.navy, r:8, lw:1.5, shadow:false});
            T((s.kind === 'light' ? '● ' : s.kind === 'transfer' ? '⇄ ' : '▸ ') + fmtMin(s.mins),
              cx + (cw - 6) / 2, cy + 14, {size:11.5, weight:800, color:C.cream, num:true, maxWidth:cw - 12});
          }
          y += laneH + 8;
        }
        T('▸ drive    ● traffic light    ⇄ change over', V.w / 2, y + 6,
          {size:10.5, weight:700, color:C.slate});
        if (phase === 'total'){
          const oy = y + 22, ow = 150, oh = 54, gp = 10, ox0 = (V.w - (2 * ow + gp)) / 2;
          for (let i = 0; i < options.length; i++){
            const col = i % 2, row = (i / 2) | 0;
            button('t' + i, ox0 + col * (ow + gp), oy + row * (oh + gp), ow, oh, fmtMin(options[i]),
              {fill: wrongIdx === i ? C.red : C.cream, color: wrongIdx === i ? C.cream : C.navy, size:17, num:true});
          }
          button('back', (V.w - 180) / 2, oy + 2 * (oh + gp) + 2, 180, 44, 'Pick another route',
            {fill:C.creamDark, color:C.navy, size:14});
        }
        if (noteT > 0){
          panel(20, V.h - 68, V.w - 40, 44, {fill:C.navy, stroke:C.gold, r:12, lw:2});
          Twrap(note, V.w / 2, V.h - 52, V.w - 60, 16, {size:13, weight:700, color:C.cream});
        }
      },
      up(hit, p, wasPressed){
        if (!hit || hit.id !== wasPressed) return;
        const id = hit.id;
        if (phase === 'choose' && id[0] === 'r'){
          sel = parseInt(id.slice(1), 10);
          options = buildOptions(routes[sel].total);
          wrongIdx = -1; phase = 'total'; Sfx.click();
          return;
        }
        if (phase === 'total' && id === 'back'){ phase = 'choose'; sel = -1; Sfx.click(); return; }
        if (phase === 'total' && id[0] === 't'){
          const i = parseInt(id.slice(1), 10);
          tries++;
          if (options[i] !== routes[sel].total){
            wrongIdx = i; Sfx.bad();
            note = 'Not quite - add every chip on that lane again.'; noteT = 2.4;
            return;
          }
          if (routes[sel].total <= deadline){
            const stars = tries === 1 ? 3 : tries === 2 ? 2 : 1;
            finishGame(stars, tries, routes[sel].name + ' takes ' + fmtMin(routes[sel].total) +
              ' - you made it with ' + fmtMin(deadline - routes[sel].total) + ' to spare.');
          } else {
            Sfx.bad();
            note = 'Right total, wrong route: ' + fmtMin(routes[sel].total) + ' is later than the ' +
                   fmtMin(deadline) + ' deadline. Try another lane.';
            noteT = 3.4; phase = 'choose'; sel = -1;
          }
        }
      }
    };
  }
};

/* ===========================================================================
   PWA: inline manifest (in <head>) + blob-URL service worker
   ========================================================================= */
function registerSW(){
  if (!('serviceWorker' in navigator)) return;
  if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') return;
  const swSource = [
    "const CACHE = 'math-circus-act1-v1';",
    "const DOC = new URL(self.registration.scope).href;",
    "self.addEventListener('install', e => {",
    "  e.waitUntil(caches.open(CACHE).then(c => c.addAll([DOC, SELF_URL])).then(() => self.skipWaiting()).catch(() => self.skipWaiting()));",
    "});",
    "self.addEventListener('activate', e => {",
    "  e.waitUntil(caches.keys().then(ks => Promise.all(ks.filter(k => k !== CACHE).map(k => caches.delete(k)))).then(() => self.clients.claim()));",
    "});",
    "self.addEventListener('fetch', e => {",
    "  if (e.request.method !== 'GET') return;",
    "  e.respondWith(caches.match(e.request, {ignoreSearch:true}).then(hit => hit || fetch(e.request).then(res => {",
    "    if (res && res.ok && res.type === 'basic'){ const copy = res.clone(); caches.open(CACHE).then(c => c.put(e.request, copy)); }",
    "    return res;",
    "  }).catch(() => caches.match(SELF_URL, {ignoreSearch:true}))));",
    "});"
  ].join('\n').replace(/SELF_URL/g, JSON.stringify(location.href.split('#')[0]));
  try {
    const url = URL.createObjectURL(new Blob([swSource], {type:'application/javascript'}));
    navigator.serviceWorker.register(url).catch(() => { /* offline cache unavailable; game still runs */ });
  } catch(e){ /* non-fatal */ }
}

/* ------------------------------------------------------------------- boot */
function boot(){
  loadSave();
  fit();
  requestAnimationFrame(frame);
  registerSW();
}
/* Test/debug surface. Harmless in play; the automated playtest drives this. */
window.MC = {
  get state(){ return gameState; },
  get screen(){ return screen; },
  get modal(){ return modal; },
  get current(){ return current; },
  get regions(){ return regions; },
  GAMES, V, startGame, goHub, finishGame, loadSave, persist, freshSave,
  openModal, closeModal, SAVE_KEY, GAME_IDS, SCORE_FIELD,
  tapId(id){
    const r = regions.find(rr2 => rr2.id === id);
    if (!r) throw new Error('no region: ' + id);
    const p = {x:r.x + r.w / 2, y:r.y + r.h / 2};
    const lay = modal ? 'modal' : 'base';
    if (r.layer !== lay) throw new Error('region not on active layer: ' + id);
    pressed = id;
    if (modal) modalUp(r, p, id);
    else if (screen === 'hub') hubUp(r, p, id);
    else if (current) current.up(r, p, id);
    pressed = null;
    return true;
  },
  hasRegion(id){ const lay = modal ? 'modal' : 'base'; return regions.some(r => r.id === id && r.layer === lay); },
  ids(){ const lay = modal ? 'modal' : 'base'; return regions.filter(r => r.layer === lay).map(r => r.id); }
};
boot();
