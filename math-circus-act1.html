<style>
  :root{
    --red:#C41E3A; --red-dark:#8E1428; --gold:#F2B705; --cream:#FFF8E7; --ink:#0E1626;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0E1626;
    overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    font-family:-apple-system,"Avenir Next","Trebuchet MS",Verdana,sans-serif;color:var(--cream)}
  #stage{position:fixed;top:env(safe-area-inset-top,0px);left:env(safe-area-inset-left,0px);
    right:env(safe-area-inset-right,0px);bottom:env(safe-area-inset-bottom,0px)}
  #c{display:block;width:100%;height:100%;touch-action:none}
  /* Visible error / status banner: the target device has no attached debugger, so
     anything that would normally be console.error has to be readable on-screen. */
  #toast{position:fixed;left:8px;right:8px;top:calc(env(safe-area-inset-top,0px) + 8px);
    z-index:20;display:none;pointer-events:none;padding:10px 12px;border-radius:12px;
    background:rgba(14,22,38,.94);border:2px solid var(--gold);color:var(--cream);
    font-size:15px;line-height:1.35;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.45)}
  #toast.err{border-color:#FF6B6B}
  #toast b{display:block;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);margin-bottom:2px}
  #toast.err b{color:#FF9B9B}

<div id="stage"><canvas id="c"></canvas></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
/* ============================================================================
   MATH CIRCUS: ACT 1 - fan rebuild (single-file, offline, touch-only)
   Sections: constants | save | audio | engine | draw helpers | hub | games | boot
   ========================================================================= */

/* ---------------------------------------------------------------- constants */
const C = {
  red:'#C41E3A', redDark:'#8E1428', redLight:'#E2536B',
  gold:'#F2B705', goldDark:'#B98B00', goldLight:'#FFD95C',
  cream:'#FFF8E7', creamDark:'#EFE0BF',
  navy:'#12203A', ink:'#0E1626', slate:'#3B4A63',
  green:'#2E9E5B', greenDark:'#1F7442', blue:'#2F6FB5', purple:'#6B4BA8',
  sawdust:'#E0C48C', sawdustDark:'#C9A96A', white:'#FFFFFF'
};
const DISPLAY = '-apple-system,"Avenir Next","Trebuchet MS",Verdana,sans-serif';
/* Numerals get a stack whose 1/l/I and 0/O are unambiguous at small sizes. */
const NUMER   = 'Verdana,Tahoma,"DejaVu Sans","Helvetica Neue",sans-serif';
const DIFFS = ['easy','medium','hard'];
const DIFF_LABEL = {easy:'Easy', medium:'Medium', hard:'Hard'};
const DIFF_COLOR = {easy:C.green, medium:C.blue, hard:C.red};

/* ------------------------------------------------------------------- save */
const SAVE_KEY = 'mathCircusSave';
const SAVE_VERSION = 1;
const GAME_IDS = ['seals','trapeze','magician','traffic','cannon','riddle',
                  'balance','tickets','elephant','bolts','clowns','lions'];
/* Which per-game number we keep, and whether bigger is better. */
const SCORE_FIELD = {
  seals:'bestMoves', trapeze:'bestStreak', magician:'bestHits', traffic:'bestTries',
  cannon:'bestShots', riddle:'bestMisses', balance:'bestMoves', tickets:'bestCorrect',
  elephant:'bestPours', bolts:'bestTaps', clowns:'bestMoves', lions:'bestFixes'
};
const SCORE_HIGHER = {trapeze:true, tickets:true};
const SCORE_LABEL = {
  seals:'Fewest swaps', trapeze:'Best clean run', magician:'Fewest hits', traffic:'Fewest tries',
  cannon:'Fewest shots', riddle:'Fewest misses', balance:'Fewest moves', tickets:'Best served',
  elephant:'Fewest pours', bolts:'Fewest taps', clowns:'Fewest commands', lions:'Fewest fixes'
};

function freshSave(){
  const g = {};
  for (const id of GAME_IDS) g[id] = {stars:0, [SCORE_FIELD[id]]:null, difficulty:'easy'};
  return {version:SAVE_VERSION, games:g, settings:{sound:true}};
}
let gameState = freshSave();

function loadSave(){
  let raw = null;
  try { raw = localStorage.getItem(SAVE_KEY); } catch(e){ raw = null; }
  const fresh = freshSave();
  if (!raw) { gameState = fresh; return; }
  let parsed = null;
  try { parsed = JSON.parse(raw); } catch(e){ parsed = null; }
  if (!parsed || typeof parsed !== 'object') { gameState = fresh; return; }
  /* Merge field by field so a partial or older blob can never throw. */
  const out = fresh;
  if (parsed.settings && typeof parsed.settings.sound === 'boolean') out.settings.sound = parsed.settings.sound;
  const pg = parsed.games && typeof parsed.games === 'object' ? parsed.games : {};
  for (const id of GAME_IDS){
    const src = pg[id];
    if (!src || typeof src !== 'object') continue;
    const st = Number(src.stars);
    if (Number.isFinite(st)) out.games[id].stars = Math.max(0, Math.min(3, Math.round(st)));
    const f = SCORE_FIELD[id], v = Number(src[f]);
    if (src[f] !== null && src[f] !== undefined && Number.isFinite(v)) out.games[id][f] = v;
    if (DIFFS.includes(src.difficulty)) out.games[id].difficulty = src.difficulty;
  }
  gameState = out;
}
function persist(){
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(gameState)); return true; }
  catch(e){ toast('Progress could not be saved on this device.', true); return false; }
}
function recordResult(id, stars, scoreValue){
  const rec = gameState.games[id];
  if (!rec) return;
  rec.stars = Math.max(rec.stars, stars);
  const f = SCORE_FIELD[id];
  if (Number.isFinite(scoreValue)){
    const cur = rec[f];
    if (cur === null || cur === undefined) rec[f] = scoreValue;
    else rec[f] = SCORE_HIGHER[id] ? Math.max(cur, scoreValue) : Math.min(cur, scoreValue);
  }
  persist();
}

/* ------------------------------------------------------------------ toast */
let toastTimer = 0, lastToastMsg = '', lastToastAt = 0;
function toast(msg, isError){
  const el = document.getElementById('toast');
  if (!el) return;
  const now = Date.now();
  if (msg === lastToastMsg && now - lastToastAt < 4000) return; /* don't spam */
  lastToastMsg = msg; lastToastAt = now;
  el.className = isError ? 'err' : '';
  el.innerHTML = '<b>' + (isError ? 'Something went wrong' : 'Note') + '</b>';
  el.appendChild(document.createTextNode(msg));
  el.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.style.display = 'none'; }, isError ? 7000 : 3200);
}
window.addEventListener('error', e => toast((e.message || 'Unknown error'), true));
window.addEventListener('unhandledrejection', e => toast('Async error: ' + (e.reason && e.reason.message || e.reason), true));

/* ------------------------------------------------------------------ audio */
const Sfx = {
  ctx:null,
  ensure(){
    if (!gameState.settings.sound) return null;
    try {
      if (!this.ctx){
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        this.ctx = new AC();
      }
      if (this.ctx.state === 'suspended') this.ctx.resume();
      return this.ctx;
    } catch(e){ return null; }
  },
  tone(freq, dur, when, type, vol){
    const ac = this.ensure(); if (!ac) return;
    const t0 = ac.currentTime + (when || 0);
    const osc = ac.createOscillator(), g = ac.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.16, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g); g.connect(ac.destination);
    osc.start(t0); osc.stop(t0 + dur + 0.02);
  },
  click(){ this.tone(880, 0.05, 0, 'square', 0.05); },
  good(){ this.tone(660, 0.12, 0, 'sine', 0.14); this.tone(990, 0.20, 0.10, 'sine', 0.14); },
  bad(){ this.tone(150, 0.22, 0, 'sawtooth', 0.10); },
  fanfare(){ this.tone(523, 0.16, 0, 'triangle', 0.15); this.tone(659, 0.16, 0.15, 'triangle', 0.15);
             this.tone(784, 0.32, 0.30, 'triangle', 0.17); this.tone(1046, 0.40, 0.46, 'triangle', 0.13); },
  pop(){ this.tone(420, 0.07, 0, 'triangle', 0.10); }
};

/* ----------------------------------------------------------------- engine */
const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d');
/* Virtual coordinate space: 360 wide, height follows the device aspect so the
   layout breathes on tall phones instead of letterboxing. */
const V = {w:360, h:640, s:1, ox:0, oy:0};
let DPR = 1;

function fit(){
  const rect = cvs.getBoundingClientRect();
  const cw = Math.max(1, rect.width), ch = Math.max(1, rect.height);
  DPR = Math.min(3, window.devicePixelRatio || 1);
  cvs.width = Math.round(cw * DPR); cvs.height = Math.round(ch * DPR);
  let s = cw / V.w, vh = ch / s;
  if (vh > 900){ vh = 900; s = ch / vh; }
  if (vh < 560){ vh = 560; s = ch / vh; }
  V.h = vh; V.s = s;
  V.ox = (cw - V.w * s) / 2;
  V.oy = (ch - V.h * s) / 2;
}
window.addEventListener('resize', fit);
window.addEventListener('orientationchange', () => setTimeout(fit, 120));

/* Hit regions are rebuilt by draw() every frame; input hit-tests the last frame.
   Topmost (drawn last) wins. */
let regions = [], layer = 'base';
function reg(id, x, y, w, h, data){
  const r = Object.assign({id, x, y, w, h, layer}, data || {});
  regions.push(r); return r;
}
function pick(x, y){
  for (let i = regions.length - 1; i >= 0; i--){
    const r = regions[i];
    if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) return r;
  }
  return null;
}
function inRect(r, x, y){ return x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h; }

/* screen: 'hub' | 'game'   modal: null | {kind:...} */
let screen = 'hub';
let current = null;         /* active game module instance */
let modal = null;
let pressed = null;         /* region id currently held, for button feedback */
let hubTime = 0;

function openModal(m){ modal = m; }
function closeModal(){ modal = null; }

function goHub(){
  current = null; screen = 'hub'; modal = null; pressed = null;
}
function startGame(id, diff){
  const def = GAMES[id];
  if (!def){ toast('Unknown game: ' + id, true); return; }
  gameState.games[id].difficulty = diff; persist();
  try {
    current = def.create(diff);
    current.id = id; current.def = def; current.diff = diff;
    current.done = false;
    /* Wrap input so the always-visible chrome (Big Top / pause) is handled once,
       centrally, instead of being re-implemented by every game module. */
    const rawUp = current.up, rawDown = current.down;
    current.up = function(hit, p, wasPressed){
      if (chromeUp(hit, wasPressed)) return;
      if (rawUp) rawUp.call(current, hit, p, wasPressed);
    };
    current.down = function(hit, p){
      if (hit && typeof hit.id === 'string' && hit.id.indexOf('g_') === 0){ Sfx.click(); return; }
      if (rawDown) rawDown.call(current, hit, p);
    };
    screen = 'game'; modal = null;
  } catch(e){ toast('Could not start ' + def.name + ': ' + e.message, true); goHub(); }
}
function restartGame(){
  if (!current) return;
  startGame(current.id, current.diff);
}
/* Called by a game when the player finishes a level. */
function finishGame(stars, scoreValue, message){
  if (!current || current.done) return;
  current.done = true;
  stars = Math.max(0, Math.min(3, stars));
  const prev = gameState.games[current.id].stars;
  recordResult(current.id, stars, scoreValue);
  if (stars >= 3) Sfx.fanfare(); else Sfx.good();
  openModal({kind:'result', stars, message: message || '', t:0, improved: stars > prev});
}
function failGame(message){
  if (!current || current.done) return;
  current.done = true;
  Sfx.bad();
  openModal({kind:'result', stars:0, message: message || 'Not this time!', t:0, failed:true});
}

/* ------------------------------------------------------------------ input */
function toV(e){
  const rect = cvs.getBoundingClientRect();
  return {x:(e.clientX - rect.left - V.ox) / V.s, y:(e.clientY - rect.top - V.oy) / V.s};
}
function guard(fn){
  return function(e){
    try { fn(e); }
    catch(err){ toast(err && err.message ? err.message : String(err), true); }
  };
}
cvs.addEventListener('pointerdown', guard(e => {
  e.preventDefault();
  if (cvs.setPointerCapture) { try { cvs.setPointerCapture(e.pointerId); } catch(_){} }
  Sfx.ensure();
  const p = toV(e), r = pick(p.x, p.y);
  const lay = modal ? 'modal' : 'base';
  const hit = r && r.layer === lay ? r : null;
  pressed = hit ? hit.id : null;
  if (modal) { modalDown(hit, p); return; }
  if (screen === 'hub') hubDown(hit, p);
  else if (current && current.down) current.down(hit, p);
}), {passive:false});

cvs.addEventListener('pointermove', guard(e => {
  e.preventDefault();
  const p = toV(e);
  if (modal) return;
  if (screen === 'game' && current && current.move) current.move(p);
}), {passive:false});

const onUp = guard(e => {
  e.preventDefault();
  const p = toV(e), r = pick(p.x, p.y);
  const lay = modal ? 'modal' : 'base';
  const hit = r && r.layer === lay ? r : null;
  const wasPressed = pressed; pressed = null;
  if (modal) { modalUp(hit, p, wasPressed); return; }
  if (screen === 'hub') hubUp(hit, p, wasPressed);
  else if (current && current.up) current.up(hit, p, wasPressed);
});
cvs.addEventListener('pointerup', onUp, {passive:false});
cvs.addEventListener('pointercancel', guard(e => { pressed = null; if (current && current.cancel) current.cancel(); }), {passive:false});
document.addEventListener('gesturestart', e => e.preventDefault());

/* ------------------------------------------------------------- draw utils */
function rr(g, x, y, w, h, r){
  r = Math.max(0, Math.min(r, Math.min(w, h) / 2));
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}
function panel(x, y, w, h, o){
  o = o || {};
  const g = ctx;
  if (o.shadow !== false){
    g.save(); g.globalAlpha = 0.22; g.fillStyle = C.ink;
    rr(g, x + 2, y + 4, w, h, o.r == null ? 14 : o.r); g.fill(); g.restore();
  }
  g.fillStyle = o.fill || C.cream;
  rr(g, x, y, w, h, o.r == null ? 14 : o.r); g.fill();
  if (o.stroke !== false){
    g.lineWidth = o.lw || 3; g.strokeStyle = o.stroke || C.navy; g.stroke();
  }
}
function T(s, x, y, o){
  o = o || {};
  const g = ctx;
  g.font = (o.weight || 700) + ' ' + (o.size || 16) + 'px ' + (o.num ? NUMER : DISPLAY);
  g.textAlign = o.align || 'center';
  g.textBaseline = o.baseline || 'middle';
  if (o.outline){ g.lineWidth = o.outline; g.strokeStyle = o.outlineColor || C.ink;
    g.lineJoin = 'round'; g.strokeText(s, x, y); }
  g.fillStyle = o.color || C.ink;
  if (o.maxWidth) g.fillText(s, x, y, o.maxWidth); else g.fillText(s, x, y);
}
/* Word-wrap into lines that fit `w`; returns number of lines drawn. */
function Twrap(s, x, y, w, lh, o){
  o = o || {};
  const g = ctx;
  g.font = (o.weight || 600) + ' ' + (o.size || 15) + 'px ' + (o.num ? NUMER : DISPLAY);
  const words = String(s).split(' ');
  const lines = []; let line = '';
  for (const wd of words){
    const t = line ? line + ' ' + wd : wd;
    if (g.measureText(t).width > w && line){ lines.push(line); line = wd; }
    else line = t;
  }
  if (line) lines.push(line);
  for (let i = 0; i < lines.length; i++) T(lines[i], x, y + i * lh, o);
  return lines.length;
}
function starPath(g, cx, cy, r){
  g.beginPath();
  for (let i = 0; i < 10; i++){
    const a = -Math.PI / 2 + i * Math.PI / 5, rr2 = (i % 2) ? r * 0.44 : r;
    const px = cx + Math.cos(a) * rr2, py = cy + Math.sin(a) * rr2;
    if (i === 0) g.moveTo(px, py); else g.lineTo(px, py);
  }
  g.closePath();
}
function drawStar(cx, cy, r, filled, o){
  o = o || {};
  const g = ctx;
  starPath(g, cx, cy, r);
  g.fillStyle = filled ? (o.fill || C.gold) : 'rgba(255,255,255,.12)';
  g.fill();
  g.lineWidth = o.lw || 1.6;
  g.strokeStyle = filled ? (o.stroke || C.goldDark) : (o.stroke || 'rgba(14,22,38,.45)');
  g.stroke();
}
function drawStars(cx, cy, n, r, gap, o){
  const total = 3, step = r * 2 + (gap == null ? 3 : gap);
  const x0 = cx - (total - 1) * step / 2;
  for (let i = 0; i < total; i++) drawStar(x0 + i * step, cy, r, i < n, o);
}
function button(id, x, y, w, h, label, o){
  o = o || {};
  const g = ctx, down = pressed === id && !o.disabled;
  const dy = down ? 2 : 0;
  const r = reg(id, x, y, w, h, {disabled:!!o.disabled});
  g.save();
  g.globalAlpha = o.disabled ? 0.45 : 1;
  /* base shadow */
  g.fillStyle = o.shade || C.ink; g.globalAlpha *= 0.85;
  rr(g, x, y + 4, w, h, o.r == null ? 12 : o.r); g.fill();
  g.globalAlpha = o.disabled ? 0.45 : 1;
  g.fillStyle = o.fill || C.gold;
  rr(g, x, y + dy, w, h - 2, o.r == null ? 12 : o.r); g.fill();
  g.lineWidth = 2.5; g.strokeStyle = o.stroke || C.navy; g.stroke();
  T(label, x + w / 2, y + dy + (h - 2) / 2 + 1, {
    size:o.size || 17, weight:800, color:o.color || C.ink, num:!!o.num, maxWidth:w - 14
  });
  g.restore();
  return r;
}
function scrim(a){
  ctx.fillStyle = 'rgba(8,13,24,' + (a == null ? 0.66 : a) + ')';
  ctx.fillRect(-40, -40, V.w + 80, V.h + 80);
}
/* Big-top stripes radiating from a peak above the screen. */
function tentBackdrop(){
  const g = ctx;
  g.fillStyle = C.cream; g.fillRect(0, 0, V.w, V.h);
  const apexX = V.w / 2, apexY = -260, n = 14;
  for (let i = 0; i < n; i++){
    if (i % 2) continue;
    const spread = V.w * 2.2;
    const x1 = apexX - spread / 2 + spread * (i / n);
    const x2 = apexX - spread / 2 + spread * ((i + 1) / n);
    g.beginPath(); g.moveTo(apexX, apexY); g.lineTo(x1, V.h + 40); g.lineTo(x2, V.h + 40);
    g.closePath(); g.fillStyle = C.red; g.globalAlpha = 0.92; g.fill(); g.globalAlpha = 1;
  }
}
function sawdustFloor(y){
  const g = ctx;
  g.fillStyle = C.sawdust; g.fillRect(0, y, V.w, V.h - y);
  g.fillStyle = C.sawdustDark; g.globalAlpha = 0.5;
  for (let i = 0; i < 90; i++){
    const px = ((i * 97) % 360), py = y + 6 + ((i * 53) % Math.max(10, (V.h - y - 10)));
    g.fillRect(px, py, 3, 2);
  }
  g.globalAlpha = 1;
  g.fillStyle = C.navy; g.fillRect(0, y - 2, V.w, 2);
}
function bunting(y, w){
  const g = ctx, n = 12, step = (w || V.w) / n;
  g.strokeStyle = C.navy; g.lineWidth = 2;
  g.beginPath(); g.moveTo(0, y); g.lineTo(w || V.w, y); g.stroke();
  for (let i = 0; i < n; i++){
    g.beginPath();
    g.moveTo(i * step, y); g.lineTo((i + 1) * step, y); g.lineTo(i * step + step / 2, y + 13);
    g.closePath();
    g.fillStyle = (i % 3 === 0) ? C.gold : (i % 3 === 1) ? C.cream : C.red;
    g.fill(); g.lineWidth = 1.5; g.strokeStyle = C.navy; g.stroke();
  }
}

      g.lineTo(x + Math.cos(a2) * s * 0.74, y + Math.sin(a2) * s * 0.74);
    }
    g.closePath(); g.fill();
    g.strokeStyle = C.navy; g.lineWidth = 2; g.stroke();
    g.fillStyle = C.red;
    g.beginPath(); g.arc(x, y, s * 0.34, 0, 7); g.fill();
  }
};

const GAMES = {};
const rndI = (a, b) => a + Math.floor(Math.random() * (b - a + 1));

function shuffle(a){
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function wrapLines(s, w, size, weight, num){
  ctx.font = (weight || 600) + ' ' + size + 'px ' + (num ? NUMER : DISPLAY);
  const words = String(s).split(' '), out = []; let line = '';
  for (const wd of words){
    const t = line ? line + ' ' + wd : wd;
    if (ctx.measureText(t).width > w && line){ out.push(line); line = wd; }
    else line = t;
  }
  if (line) out.push(line);
  return out;
}

/* ===========================================================================
   GAME 1 - SEALS & BALLS  (sequencing / number matching)
   ========================================================================= */
function minSwapsOf(perm){
  const n = perm.length, seen = new Array(n).fill(false);
  let cycles = 0;
  for (let i = 0; i < n; i++){
    if (seen[i]) continue;
    cycles++;
    let j = i;
    while (!seen[j]){ seen[j] = true; j = perm[j] - 1; }
  }
  return n - cycles;
}
GAMES.seals = {
  name:'Seals & Balls', short:'Seals & Balls', skill:'Sequencing & matching',
  desc:'Every seal wants the ball that matches the number on its stand. Tap one ball, then tap another to swap them.',
  create(diff){
    const conf = {easy:{n:4, cols:2, lo:1, hi:1}, medium:{n:6, cols:3, lo:2, hi:3},
                  hard:{n:9, cols:3, lo:4, hi:8}}[diff];
    let perm = null, par = 0;
    for (let tries = 0; tries < 800; tries++){
      const cand = shuffle(Array.from({length:conf.n}, (_, i) => i + 1));
      const p = minSwapsOf(cand);
      if (p >= conf.lo && p <= conf.hi){ perm = cand; par = p; break; }
    }
    if (!perm){ /* guaranteed fallback: build a cycle of exactly conf.lo+1 length */
      perm = Array.from({length:conf.n}, (_, i) => i + 1);
      for (let i = 0; i <= conf.lo; i++){ const j = (i + 1) % (conf.lo + 1); const t = perm[i]; perm[i] = perm[j]; perm[j] = t; }
      par = minSwapsOf(perm);
    }
    let sel = null, moves = 0, flash = 0;
    const cellsRect = () => {
      const rows = Math.ceil(conf.n / conf.cols);
      const top = 118, bot = V.h - 20;
      const cw = Math.min((V.w - 24) / conf.cols, 116);
      const ch = Math.min((bot - top) / rows, 132);
      const x0 = (V.w - cw * conf.cols) / 2;
      const y0 = top + Math.min(24, Math.max(0, (bot - top) - ch * rows));
      return {cw, ch, x0, y0, rows};
    };
    function solved(){ return perm.every((v, i) => v === i + 1); }
    return {
      debug(){ return {perm:perm.slice(), par, moves, sel, n:conf.n}; },
      hudNote(){ return 'Swaps ' + moves + '  ·  par ' + par; },
      update(dt){ if (flash > 0) flash = Math.max(0, flash - dt); },
      draw(){
        const g = ctx;
        g.fillStyle = C.cream; g.fillRect(0, 0, V.w, V.h);
        sawdustFloor(V.h - 26);
        instr('Tap two balls to swap them. Ball number must match the stand number.');
        const L = cellsRect();
        for (let i = 0; i < conf.n; i++){
          const col = i % conf.cols, row = (i / conf.cols) | 0;
          const x = L.x0 + col * L.cw, y = L.y0 + row * L.ch;
          reg('s' + i, x, y, L.cw, L.ch, {});
          const cx = x + L.cw / 2, cy = y + L.ch / 2, S = Math.min(L.cw, L.ch);
          const ok = perm[i] === i + 1, isSel = sel === i;
          /* stand */
          g.fillStyle = ok ? C.green : C.navy;
          rr(g, cx - S * 0.28, cy + S * 0.26, S * 0.56, S * 0.2, 5); g.fill();
          T(String(i + 1), cx, cy + S * 0.36, {size:S * 0.15, weight:800, color:C.gold, num:true});
          /* seal */
          g.fillStyle = '#6E7C8F';
          g.beginPath(); g.ellipse(cx - S * 0.05, cy + S * 0.12, S * 0.28, S * 0.13, 0, 0, 7); g.fill();
          g.beginPath(); g.ellipse(cx + S * 0.11, cy - S * 0.05, S * 0.1, S * 0.16, 0.25, 0, 7); g.fill();
          g.fillStyle = '#5B687A';
          g.beginPath(); g.ellipse(cx - S * 0.3, cy + S * 0.16, S * 0.12, S * 0.06, -0.5, 0, 7); g.fill();
          g.beginPath(); g.ellipse(cx + S * 0.02, cy + S * 0.2, S * 0.09, S * 0.05, 0.3, 0, 7); g.fill();
          g.fillStyle = C.ink;
          g.beginPath(); g.arc(cx + S * 0.14, cy - S * 0.12, S * 0.025, 0, 7); g.fill();
          g.strokeStyle = '#6E7C8F'; g.lineWidth = S * 0.06; g.lineCap = 'round';
          g.beginPath(); g.moveTo(cx + S * 0.14, cy - S * 0.19); g.lineTo(cx + S * 0.05, cy - S * 0.26); g.stroke();
          g.strokeStyle = 'rgba(14,22,38,.5)'; g.lineWidth = 1;
          for (let wk = -1; wk <= 1; wk++){
            g.beginPath();
            g.moveTo(cx + S * 0.16, cy - S * 0.1);
            g.lineTo(cx + S * 0.3, cy - S * 0.08 + wk * S * 0.05);
            g.stroke();
          }
          /* ball */
          const br = S * 0.17, bx = cx, by = cy - S * 0.33;
          if (isSel){
            g.strokeStyle = C.gold; g.lineWidth = 4;
            g.beginPath(); g.arc(bx, by, br + 6, 0, 7); g.stroke();
          }
          g.fillStyle = ok ? C.green : C.red;
          g.beginPath(); g.arc(bx, by, br, 0, 7); g.fill();
          g.lineWidth = 2; g.strokeStyle = C.navy; g.stroke();
          g.strokeStyle = 'rgba(255,255,255,.7)'; g.lineWidth = 1.5;
          g.beginPath(); g.arc(bx, by, br * 0.62, Math.PI * 0.9, Math.PI * 1.6); g.stroke();
          T(String(perm[i]), bx, by + 1, {size:br * 1.15, weight:800, color:C.cream, num:true});
        }
      },
      up(hit, p, wasPressed){
        if (!hit || hit.id !== wasPressed || hit.id[0] !== 's') return;
        const i = parseInt(hit.id.slice(1), 10);
        if (!Number.isFinite(i)) return;
        if (sel === null){ sel = i; Sfx.pop(); return; }
        if (sel === i){ sel = null; Sfx.click(); return; }
        const t = perm[sel]; perm[sel] = perm[i]; perm[i] = t;
        moves++; sel = null; Sfx.click();
        if (solved()){
          const stars = moves <= par ? 3 : moves <= par + 2 ? 2 : 1;
          finishGame(stars, moves, 'Solved in ' + moves + ' swap' + (moves === 1 ? '' : 's') + '. Par was ' + par + '.');
        }
      }
    };
  }
};

/* ===========================================================================
   GAME 2 - TRAPEZE TIMING  (time estimation / rhythm)
   ========================================================================= */
GAMES.trapeze = {
  name:'Trapeze Timing', short:'Trapeze', skill:'Timing & estimation',
  desc:'Let go at the very top of the swing, then tap again the instant you meet the next bar.',
  create(diff){
    const conf = {easy:{gaps:1, win:0.40, T:2.4, dT:0}, medium:{gaps:2, win:0.25, T:1.8, dT:0.0},
                  hard:{gaps:3, win:0.15, T:1.5, dT:0.15}}[diff];
    /* Rig geometry scales with viewport height. The amplitude is derived from the
       rope length so the widest swing always stays on screen at any phone size. */
    function geo(){
      const ny = V.h - 46, piv = 150;
      const L = Math.max(110, Math.min(196, (ny - piv) * 0.45));
      return {ny, piv, L, A: Math.min(0.55, Math.asin(Math.min(0.95, 50 / L)))};
    }
    const n = conf.gaps + 1;
    const bars = [];
    for (let i = 0; i < n; i++){
      const x = n === 1 ? V.w / 2 : 58 + i * ((V.w - 116) / (n - 1));
      bars.push({x, T: Math.max(0.8, conf.T - conf.dT * i), phase: Math.random() * Math.PI * 2});
    }
    let t = 0, idx = 0, phase = 'swing', arriveT = 0, flyFrom = null, flyTo = null, flyStart = 0;
    let misses = 0, streak = 0, best = 0, fallT = 0, fallFrom = null, msg = '', msgT = 0;
    const w2 = bar => 2 * Math.PI / bar.T;
    const ang = bar => geo().A * Math.cos(w2(bar) * t + bar.phase);
    const posOf = (bar, a) => {
      const G = geo();
      return {x: bar.x + Math.sin(a) * G.L, y: G.piv + Math.cos(a) * G.L};
    };
    function errToRightApex(bar){
      const u = ((w2(bar) * t + bar.phase) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);
      return Math.min(u, 2 * Math.PI - u) / w2(bar);
    }
    function nextLeftApex(bar, after){
      const w = w2(bar);
      const k = Math.ceil((after * w + bar.phase - Math.PI) / (2 * Math.PI));
      return (Math.PI + 2 * Math.PI * k - bar.phase) / w;
    }
    function fall(reason){
      fallFrom = artistPos();           /* capture BEFORE the phase flips */
      phase = 'fall'; fallT = 0; misses++; streak = 0; msg = reason; msgT = 1.6;
      Sfx.bad();
    }
    function artistPos(){
      if (phase === 'swing'){ const b = bars[idx]; const p = posOf(b, ang(b)); return {x:p.x, y:p.y + 22}; }
      if (phase === 'fly'){
        const u = Math.max(0, Math.min(1, (t - flyStart) / Math.max(0.001, arriveT - flyStart)));
        return {x: flyFrom.x + (flyTo.x - flyFrom.x) * u,
                y: flyFrom.y + (flyTo.y - flyFrom.y) * u - Math.sin(Math.PI * u) * 58};
      }
      if (phase === 'fall'){
        const u = Math.min(1, fallT / 0.75);
        return {x: fallFrom.x, y: fallFrom.y + u * u * (V.h - 52 - fallFrom.y)};
      }
      const b = bars[idx]; const p = posOf(b, ang(b)); return {x:p.x, y:p.y + 22};
    }
    function release(){
      const b = bars[idx];
      const e = errToRightApex(b);
      if (e > conf.win){ fall(e > conf.win * 2.4 ? 'Way too early!' : 'Missed the release zone!'); return; }
      const target = bars[idx + 1];
      arriveT = nextLeftApex(target, t + 0.75);
      flyStart = t;
      flyFrom = artistPos();
      const aArrive = geo().A * Math.cos(w2(target) * arriveT + target.phase);
      const tp = posOf(target, aArrive);
      flyTo = {x: tp.x, y: tp.y + 22};
      phase = 'fly';
      Sfx.pop();
    }
    function grab(){
      const e = Math.abs(t - arriveT);
      if (e > conf.win){ fall(t < arriveT ? 'Grabbed too soon!' : 'Grabbed too late!'); return; }
      idx++; streak++; best = Math.max(best, streak);
      Sfx.good();
      if (idx >= conf.gaps){
        const stars = misses === 0 ? 3 : misses === 1 ? 2 : 1;
        phase = 'done';
        finishGame(stars, best, misses === 0 ? 'A clean run across ' + conf.gaps + ' gap' + (conf.gaps === 1 ? '' : 's') + '!'
          : 'Across in ' + (misses + 1) + ' attempts (' + misses + ' fall' + (misses === 1 ? '' : 's') + ').');
      } else { phase = 'swing'; msg = 'Caught it!'; msgT = 1.0; }
    }
    return {
      debug(){
        const b = bars[Math.min(idx, bars.length - 1)];
        const err = phase === 'swing' ? errToRightApex(b) : phase === 'fly' ? Math.abs(t - arriveT) : 99;
        return {phase, idx, gaps:conf.gaps, win:conf.win, err, misses, best};
      },
      hudNote(){ return 'Gap ' + Math.min(idx + 1, conf.gaps) + '/' + conf.gaps + '  ·  falls ' + misses; },
      update(dt){
        t += dt;
        if (msgT > 0) msgT -= dt;
        if (phase === 'fly' && t > arriveT + conf.win) fall('You sailed straight past the bar!');
        if (phase === 'fall'){
          fallT += dt;
          if (fallT > 1.1){ phase = 'swing'; }
        }
      },
      draw(){
        const g = ctx;
        g.fillStyle = '#1B2A45'; g.fillRect(0, 0, V.w, V.h);
        /* tent ribs */
        g.strokeStyle = 'rgba(255,255,255,.07)'; g.lineWidth = 2;
        for (let i = -2; i < 8; i++){
          g.beginPath(); g.moveTo(V.w / 2, -40); g.lineTo(i * 70 - 60, V.h); g.stroke();
        }
        const bottom = instr('Tap in the gold zone at the top of the swing to let go, then tap when you meet the next bar.');
        reg('tap', 0, bottom, V.w, V.h - bottom, {});
        /* spotlight cone + crowd silhouette: the height is the drama, but the
           middle band still needs something to read against */
        const spot = g.createLinearGradient(0, 120, 0, V.h - 40);
        spot.addColorStop(0, 'rgba(255,248,231,.16)');
        spot.addColorStop(1, 'rgba(255,248,231,0)');
        g.fillStyle = spot;
        g.beginPath(); g.moveTo(V.w / 2 - 26, 120); g.lineTo(V.w / 2 + 26, 120);
        g.lineTo(V.w / 2 + 150, V.h - 40); g.lineTo(V.w / 2 - 150, V.h - 40); g.closePath(); g.fill();
        g.fillStyle = 'rgba(8,13,24,.55)';
        for (let i = 0; i < 16; i++){
          const cx2 = i * 24 + 10;
          g.beginPath(); g.arc(cx2, V.h - 28, 9, 0, 7); g.fill();
          g.fillRect(cx2 - 10, V.h - 22, 20, 24);
        }
        /* rig */
        const G = geo();
        g.fillStyle = C.slate; g.fillRect(0, G.piv - 10, V.w, 8);
        /* net */
        g.strokeStyle = 'rgba(255,248,231,.5)'; g.lineWidth = 1.5;
        const ny = G.ny;
        for (let i = 0; i <= 12; i++){
          g.beginPath(); g.moveTo(i * V.w / 12, ny); g.lineTo(i * V.w / 12 - 16, ny + 26); g.stroke();
          g.beginPath(); g.moveTo(i * V.w / 12 - 16, ny); g.lineTo(i * V.w / 12, ny + 26); g.stroke();
        }
        g.strokeStyle = C.cream; g.lineWidth = 3;
        g.beginPath(); g.moveTo(0, ny); g.lineTo(V.w, ny); g.stroke();
        /* bars */
        for (let i = 0; i < bars.length; i++){
          const b = bars[i], a = ang(b), p = posOf(b, a);
          /* release zone on the current bar */
          if (i === idx && phase === 'swing'){
            /* the gold wedge is exactly the set of rope angles whose timing error
               is inside the release window, so what you see is what is scored */
            const a1 = G.A * Math.cos(Math.min(Math.PI / 2, w2(b) * conf.win)), a2 = G.A;
            g.strokeStyle = 'rgba(242,183,5,.28)'; g.lineWidth = 30; g.lineCap = 'butt';
            g.beginPath(); g.arc(b.x, G.piv, G.L + 2, Math.PI / 2 - a2, Math.PI / 2 - a1); g.stroke();
            g.strokeStyle = C.gold; g.lineWidth = 4;
            g.beginPath(); g.arc(b.x, G.piv, G.L + 19, Math.PI / 2 - a2, Math.PI / 2 - a1); g.stroke();
          }
          g.strokeStyle = i === idx ? C.gold : 'rgba(255,248,231,.45)';
          g.lineWidth = 2;
          g.beginPath(); g.moveTo(b.x, G.piv); g.lineTo(p.x, p.y); g.stroke();
          g.strokeStyle = i <= idx ? C.gold : C.creamDark; g.lineWidth = 5; g.lineCap = 'round';
          g.beginPath(); g.moveTo(p.x - 13, p.y); g.lineTo(p.x + 13, p.y); g.stroke();
        }
        /* platforms */
        g.fillStyle = C.red;
        g.fillRect(bars[0].x - 36, G.piv + G.L + 30, 32, 9);
        g.fillRect(bars[bars.length - 1].x + 6, G.piv + G.L + 30, 32, 9);
        /* artist */
        const ap = artistPos();
        g.fillStyle = phase === 'fall' ? C.slate : C.red;
        g.beginPath(); g.arc(ap.x, ap.y - 14, 7, 0, 7); g.fill();
        g.strokeStyle = phase === 'fall' ? C.slate : C.red; g.lineWidth = 5; g.lineCap = 'round';
        g.beginPath();
        g.moveTo(ap.x, ap.y - 8); g.lineTo(ap.x, ap.y + 8);
        g.moveTo(ap.x, ap.y + 8); g.lineTo(ap.x - 8, ap.y + 20);
        g.moveTo(ap.x, ap.y + 8); g.lineTo(ap.x + 8, ap.y + 20);
        g.moveTo(ap.x - 9, ap.y - 20); g.lineTo(ap.x, ap.y - 6);
        g.moveTo(ap.x + 9, ap.y - 20); g.lineTo(ap.x, ap.y - 6);
        g.stroke();
        /* grab ring while flying */
        if (phase === 'fly'){
          const rem = arriveT - t;
          const rad = 12 + Math.abs(rem) * 150;
          g.strokeStyle = Math.abs(rem) <= conf.win ? C.gold : 'rgba(255,248,231,.5)';
          g.lineWidth = 3;
          g.beginPath(); g.arc(ap.x, ap.y - 8, Math.min(90, rad), 0, 7); g.stroke();
          g.strokeStyle = C.gold; g.lineWidth = 2;
          g.beginPath(); g.arc(ap.x, ap.y - 8, 12, 0, 7); g.stroke();
        }
        /* Timing meter: the same numbers the scorer uses, made readable. The gold
           band is the release/grab window; tap while the marker is inside it. */
        if (phase === 'swing' || phase === 'fly'){
          const mw = 244, mh = 16, mx = (V.w - mw) / 2, my = V.h - 118;
          let u = 0, z0 = 0;
          if (phase === 'swing'){
            const b = bars[idx], a = ang(b), a1 = G.A * Math.cos(Math.min(Math.PI / 2, w2(b) * conf.win));
            u = (a / G.A + 1) / 2; z0 = (a1 / G.A + 1) / 2;
          } else {
            const span = (arriveT + conf.win) - flyStart;
            u = (t - flyStart) / span; z0 = (arriveT - conf.win - flyStart) / span;
          }
          panel(mx, my, mw, mh, {fill:'rgba(8,13,24,.6)', stroke:C.cream, r:mh / 2, lw:2, shadow:false});
          g.save(); g.beginPath(); rr(g, mx, my, mw, mh, mh / 2); g.clip();
          g.fillStyle = C.gold;
          g.fillRect(mx + Math.max(0, z0) * mw, my, Math.max(4, (1 - Math.max(0, z0)) * mw), mh);
          g.restore();
          const px = mx + Math.max(0, Math.min(1, u)) * mw;
          g.fillStyle = C.cream; rr(g, px - 3.5, my - 6, 7, mh + 12, 3.5); g.fill();
          g.lineWidth = 2; g.strokeStyle = C.ink; g.stroke();
          T(phase === 'swing' ? 'RELEASE WINDOW' : 'GRAB WINDOW', V.w / 2, my - 18,
            {size:10.5, weight:800, color:C.creamDark});
        }
        if (msgT > 0){
          T(msg, V.w / 2, V.h - 80, {size:16, weight:800, color:C.gold, outline:4, outlineColor:C.ink});
        }
        T(phase === 'swing' ? 'TAP TO RELEASE' : phase === 'fly' ? 'TAP TO GRAB' : phase === 'fall' ? 'INTO THE NET...' : '',
          V.w / 2, V.h - 18, {size:13, weight:800, color:C.cream});
      },
      up(hit, p, wasPressed){
        if (!hit || hit.id !== 'tap' || wasPressed !== 'tap') return;
        if (phase === 'swing') release();
        else if (phase === 'fly') grab();
      }
    };
  }
};


/* ===========================================================================
   GAME 3 - MAGICIAN'S RESCUE  (pattern recognition / sequences)
   ========================================================================= */
function seqDistractors(ans, step, k){
  const cands = [ans + 1, ans - 1, ans + 2, ans - 2, ans + step, ans - step,
                 ans * 2, Math.round(ans / 2), ans + 3, ans - 3, ans + 2 * step];
  const out = [];
  for (const c of shuffle(cands.slice()))
    if (c !== ans && c >= 0 && Number.isFinite(c) && out.indexOf(c) < 0) out.push(c);
  while (out.length < k) out.push(ans + out.length + 4);
  return out.slice(0, k);
}
/* who: 'witch' (additive families) | 'monster' (multiplying / two-step families) */
function makeSequence(diff, who){
  const n = 5;
  let terms = [], rule = '', step = 1;
  if (diff === 'easy'){
    const d = who === 'witch' ? rndI(1, 2) : rndI(2, 3);
    const a = rndI(1, 9);
    for (let i = 0; i < n; i++) terms.push(a + i * d);
    rule = 'add ' + d + ' each time'; step = d;
  } else if (diff === 'medium'){
    if (who === 'witch'){
      const down = Math.random() < 0.5, d = rndI(2, 5);
      const a = down ? rndI(30, 48) : rndI(2, 12);
      for (let i = 0; i < n; i++) terms.push(down ? a - i * d : a + i * d);
      rule = (down ? 'subtract ' : 'add ') + d + ' each time'; step = d;
    } else {
      const r = rndI(2, 3), a = rndI(1, 4);
      for (let i = 0; i < n; i++) terms.push(a * Math.pow(r, i));
      rule = 'multiply by ' + r + ' each time'; step = a * (r - 1);
    }
  } else {
    if (who === 'witch'){
      const d = rndI(1, 4), m = 2, a = rndI(1, 5);
      terms.push(a);
      for (let i = 1; i < n; i++) terms.push(i % 2 ? terms[i - 1] + d : terms[i - 1] * m);
      rule = 'add ' + d + ', then double, repeating'; step = d;
    } else {
      const d = rndI(1, 3), k = rndI(1, 3), a = rndI(1, 8);
      terms.push(a);
      for (let i = 1; i < n; i++) terms.push(terms[i - 1] + d + (i - 1) * k);
      rule = 'the gap grows by ' + k + ' each time'; step = d + k;
    }
  }
  const hideIdx = rndI(2, n - 1);
  return {terms, hideIdx, answer:terms[hideIdx], rule, step};
}
GAMES.magician = {
  name:"Magician's Rescue", short:'Magician', skill:'Patterns & sequences',
  desc:'The witch and the monster attack with number patterns. Tap the missing number before the spell timer runs out.',
  create(diff){
    const conf = {easy:{time:6, opts:3, rounds:8}, medium:{time:4.5, opts:4, rounds:8},
                  hard:{time:3, opts:4, rounds:8}}[diff];

    let q = null, options = [], timer = conf.time, who = 'witch';
    function nextRound(){
      who = round % 2 === 0 ? 'witch' : 'monster';
      q = makeSequence(diff, who);

      timer = conf.time; phase = 'ask'; chosen = -1;
    }
    function takeHit(){
      hp--; hits++; shake = 0.5; Sfx.bad();

    }
    function answer(i){
      if (phase !== 'ask') return;

    }
    nextRound();
    return {
      debug(){ return {round, hp, hits, phase, timer, options:options.slice(), answer:q.answer,
                       correctIdx:options.indexOf(q.answer), rounds:conf.rounds, opts:conf.opts, time:conf.time}; },
      hudNote(){ return 'Round ' + Math.min(round + 1, conf.rounds) + '/' + conf.rounds + '  ·  HP ' + hp; },
      update(dt){
        if (shake > 0) shake = Math.max(0, shake - dt);
        if (phase === 'ask'){
          timer -= dt;
          if (timer <= 0){ timer = 0; phase = 'feedback'; fbT = 0; chosen = -1; takeHit(); }
        } else if (phase === 'feedback'){
          fbT += dt;
          if (fbT > 0.85){
            round++;
            if (round >= conf.rounds){
              phase = 'over';
              const stars = hits === 0 ? 3 : hits === 1 ? 2 : 1;
              finishGame(stars, hits, hits === 0 ? 'Flawless! The magician walks free.'
                : 'Rescued with ' + hits + ' hit' + (hits === 1 ? '' : 's') + ' taken.');

          }
        }
      },
      draw(){
        const g = ctx;
        g.fillStyle = '#241A38'; g.fillRect(0, 0, V.w, V.h);
        const top = instr('Find the missing number in the pattern before the timer empties.');
        g.fillStyle = 'rgba(107,75,168,.30)';
        for (let i = 0; i < 9; i++){
          starPath(g, 24 + (i * 97) % 336, top + 30 + (i * 137) % Math.max(60, V.h - top - 60), 8 + (i % 3) * 2);
          g.fill();
        }
        const sx = shake > 0 ? Math.sin(shake * 60) * 4 : 0;
        /* lives strip, then the scene; padding keeps the block off the top on tall phones */
        for (let i = 0; i < 3; i++){

          g.beginPath();
          g.moveTo(hx, hy + 9);
          g.bezierCurveTo(hx - 10, hy - 1, hx - 2, hy - 9, hx, hy - 3);
          g.bezierCurveTo(hx + 2, hy - 9, hx + 10, hy - 1, hx, hy + 9);
          g.fill();
        }
        T('LIVES', 95, top + 16, {size:11, weight:800, color:C.creamDark, align:'left'});
        const pad = Math.max(0, Math.min(56, (V.h - top - 430) / 2));
        const sceneY = top + 34 + pad, sceneH = 118;

  }
};

/* ===========================================================================
   GAME 4 - CIRCUS TRAFFIC  (elapsed time / route comparison)
   ========================================================================= */
function fmtMin(m){
  const w = Math.floor(m + 1e-9), half = Math.abs(m - w - 0.5) < 1e-9;
  return (w === 0 && half ? '' : String(w)) + (half ? '½' : '') + ' min';
}
GAMES.traffic = {
  name:'Circus Traffic', short:'Traffic', skill:'Adding times',
  desc:'Add up each route - driving plus every traffic-light wait - and pick the one that reaches the big top before the deadline.',
  create(diff){
    const conf = {easy:{routes:2, half:false, maxSeg:6, segs:[3, 3], transfer:false},
                  medium:{routes:3, half:false, maxSeg:14, segs:[4, 5], transfer:true},
                  hard:{routes:3, half:true, maxSeg:12, segs:[4, 5], transfer:true}}[diff];
    const NAMES = ['River Road', 'Market Street', 'Old Mill Lane'];
    let routes = null, deadline = 0;
    for (let attempt = 0; attempt < 400; attempt++){
      const rs = [];
      for (let i = 0; i < conf.routes; i++){
        const count = rndI(conf.segs[0], conf.segs[1]);
        const segs = [];
        for (let j = 0; j < count; j++){
          const isLight = j % 2 === 1 && j !== count - 1;
          let m = isLight ? rndI(1, 3) : rndI(2, conf.maxSeg);
          if (conf.half && Math.random() < 0.55) m += 0.5;
          segs.push({kind: isLight ? 'light' : 'drive', mins:m});
        }
        if (conf.transfer && i === 0) segs.splice(Math.min(2, segs.length - 1), 0, {kind:'transfer', mins: conf.half ? 1.5 : 2});
        rs.push({name:NAMES[i], segs, total: segs.reduce((a, b) => a + b.mins, 0)});
      }
      const totals = rs.map(r => r.total).slice().sort((a, b) => a - b);
      if (totals[1] - totals[0] < 1.5) continue;
      if (conf.routes === 3 && totals[2] - totals[1] < 1) continue;
      const cap = diff === 'easy' ? 20 : 60;
      if (totals[totals.length - 1] > cap) continue;
      if (diff === 'hard' && !rs.some(r => Math.abs(r.total % 1 - 0.5) < 1e-9)) continue;
      routes = rs;
      deadline = totals[0] + (conf.half ? 0.5 : 1);
      break;
    }
    if (!routes){
      routes = [{name:NAMES[0], segs:[{kind:'drive', mins:4}, {kind:'light', mins:2}, {kind:'drive', mins:3}], total:9},
                {name:NAMES[1], segs:[{kind:'drive', mins:6}, {kind:'light', mins:3}, {kind:'drive', mins:5}], total:14}];
      deadline = 10;
    }
    const onTime = routes.filter(r => r.total <= deadline);
    let phase = 'choose', sel = -1, tries = 0, options = [], wrongIdx = -1, note = '', noteT = 0;
    function buildOptions(total){
      const set = [total];
      const deltas = conf.half ? [0.5, -0.5, 1, -1, 1.5, 2] : [1, -1, 2, -2, 3, 5];
      for (const d of shuffle(deltas.slice())){
        const v = total + d;
        if (v > 0 && set.indexOf(v) < 0) set.push(v);
        if (set.length === 4) break;
      }
      return shuffle(set);
    }
    return {
      debug(){ return {phase, tries, deadline, totals:routes.map(r => r.total), sel,
                       options:options.slice(), onTime:routes.map(r => r.total <= deadline)}; },
      hudNote(){ return 'Be there in ' + fmtMin(deadline) + '  ·  tries ' + tries; },
      update(dt){ if (noteT > 0) noteT -= dt; },
      draw(){
        const g = ctx;
        g.fillStyle = C.cream; g.fillRect(0, 0, V.w, V.h);
        const top = instr(phase === 'choose'
          ? 'Total up each route, then tap the one that arrives in ' + fmtMin(deadline) + ' or less.'
          : 'How long is ' + routes[sel].name + ' in total?');
        /* Pad is computed from the TALLEST layout (map + answer panel) so the map
           does not jump when the answer choices appear. */
        const laneHs = routes.map(r => 30 + Math.ceil(r.segs.length / 4) * 34);
        const contentH = 42 + laneHs.reduce((a, b) => a + b + 8, 0) + 16 + 22 + 2 * 64 + 48;
        const pad = Math.max(0, Math.min(50, (V.h - top - contentH) / 2));
        panel(8, top + 8 + pad, V.w - 16, 34, {fill:C.gold, stroke:C.navy, r:10, lw:2, shadow:false});
        T('⏱  Deadline: ' + fmtMin(deadline), V.w / 2, top + 25 + pad, {size:15, weight:800, color:C.ink, num:true});
        let y = top + 52 + pad;
        for (let i = 0; i < routes.length; i++){
          const r = routes[i];
          const chips = r.segs.length;
          const perRow = 4, rows = Math.ceil(chips / perRow);
          const laneH = 30 + rows * 34;
          const active = phase === 'total' && sel === i;
          if (phase === 'choose') reg('r' + i, 8, y, V.w - 16, laneH, {});
          panel(8, y, V.w - 16, laneH, {
            fill: active ? '#E8F3EA' : (pressed === 'r' + i ? C.creamDark : C.white),
            stroke: active ? C.green : C.navy, r:12, lw: active ? 3 : 2, shadow:false});
          T(r.name, 18, y + 15, {size:13.5, weight:800, color:C.navy, align:'left'});
          if (phase === 'choose') T('TAP TO PICK', V.w - 18, y + 15, {size:10.5, weight:800, color:C.slate, align:'right'});
          for (let j = 0; j < chips; j++){
            const col = j % perRow, row = (j / perRow) | 0;
            const cw = (V.w - 32) / perRow, cx = 16 + col * cw, cy = y + 26 + row * 34;
            const s = r.segs[j];
            const fill = s.kind === 'light' ? C.red : s.kind === 'transfer' ? C.purple : C.blue;
            panel(cx, cy, cw - 6, 28, {fill, stroke:C.navy, r:8, lw:1.5, shadow:false});
            T((s.kind === 'light' ? '● ' : s.kind === 'transfer' ? '⇄ ' : '▸ ') + fmtMin(s.mins),
              cx + (cw - 6) / 2, cy + 14, {size:11.5, weight:800, color:C.cream, num:true, maxWidth:cw - 12});
          }
          y += laneH + 8;
        }
        T('▸ drive    ● traffic light    ⇄ change over', V.w / 2, y + 6,
          {size:10.5, weight:700, color:C.slate});
        if (phase === 'total'){
          const oy = y + 22, ow = 150, oh = 54, gp = 10, ox0 = (V.w - (2 * ow + gp)) / 2;
          for (let i = 0; i < options.length; i++){
            const col = i % 2, row = (i / 2) | 0;
            button('t' + i, ox0 + col * (ow + gp), oy + row * (oh + gp), ow, oh, fmtMin(options[i]),
              {fill: wrongIdx === i ? C.red : C.cream, color: wrongIdx === i ? C.cream : C.navy, size:17, num:true});
          }
          button('back', (V.w - 180) / 2, oy + 2 * (oh + gp) + 2, 180, 44, 'Pick another route',
            {fill:C.creamDark, color:C.navy, size:14});
        }
        if (noteT > 0){
          panel(20, V.h - 68, V.w - 40, 44, {fill:C.navy, stroke:C.gold, r:12, lw:2});
          Twrap(note, V.w / 2, V.h - 52, V.w - 60, 16, {size:13, weight:700, color:C.cream});
        }
      },
      up(hit, p, wasPressed){
        if (!hit || hit.id !== wasPressed) return;
        const id = hit.id;
        if (phase === 'choose' && id[0] === 'r'){
          sel = parseInt(id.slice(1), 10);
          options = buildOptions(routes[sel].total);
          wrongIdx = -1; phase = 'total'; Sfx.click();
          return;
        }
        if (phase === 'total' && id === 'back'){ phase = 'choose'; sel = -1; Sfx.click(); return; }
        if (phase === 'total' && id[0] === 't'){
          const i = parseInt(id.slice(1), 10);
          tries++;
          if (options[i] !== routes[sel].total){
            wrongIdx = i; Sfx.bad();
            note = 'Not quite - add every chip on that lane again.'; noteT = 2.4;
            return;
          }
          if (routes[sel].total <= deadline){
            const stars = tries === 1 ? 3 : tries === 2 ? 2 : 1;
            finishGame(stars, tries, routes[sel].name + ' takes ' + fmtMin(routes[sel].total) +
              ' - you made it with ' + fmtMin(deadline - routes[sel].total) + ' to spare.');
          } else {
            Sfx.bad();
            note = 'Right total, wrong route: ' + fmtMin(routes[sel].total) + ' is later than the ' +
                   fmtMin(deadline) + ' deadline. Try another lane.';
            noteT = 3.4; phase = 'choose'; sel = -1;
          }
        }
      }
    };
  }
};

   GAME 5 - CANNON  (proportional reasoning)
   ========================================================================= */
GAMES.cannon = {
  name:'Human Cannonball', short:'Cannon', skill:'Angle, force & distance',
  desc:'Drag the angle and force sliders until the flight path drops into the bucket, then fire.',
  create(diff){
    const conf = {easy:{lockForce:8, tol:44, shots:0, near:[0.45, 0.85]},
                  medium:{lockForce:0, tol:30, shots:0, near:[0.45, 0.85]},
                  hard:{lockForce:0, tol:17, shots:3, near:[0.86, 0.98]}}[diff];
    const G_ACC = 600, KV = 42;
    const maxRange = Math.pow(10 * KV, 2) / G_ACC;           /* force 10 at 45 deg */
    const lockRange = conf.lockForce ? Math.pow(conf.lockForce * KV, 2) / G_ACC : maxRange;
    const dist = Math.round(lockRange * (conf.near[0] + Math.random() * (conf.near[1] - conf.near[0])));
    let angle = 45, force = conf.lockForce || 5;
    let shots = 0, drag = null, ball = null, note = '', noteT = 0, hit = false;
    const geo = () => {
      const slidersTop = V.h - 190;
      /* keep enough sky for the highest arc, then stand on the sawdust */
      const groundY = Math.min(slidersTop - 26, 53 + 47 + 330);
      return {slidersTop, groundY, cx:40, bucketX:40 + dist, rim:groundY - 26};
    };
    const muzzle = () => {
      const G = geo(), a = angle * Math.PI / 180;
      return {x:G.cx + Math.cos(a) * 30, y:G.groundY - 20 - Math.sin(a) * 30};
    };
    const vel = () => {
      const a = angle * Math.PI / 180, v = force * KV;
      return {x:Math.cos(a) * v, y:-Math.sin(a) * v};
    };
    function fire(){
      if (ball || hit) return;
      const m = muzzle(), v = vel();
      /* Position is evaluated analytically, so the flight is exactly the arc the
         dotted preview drew, and it does not drift with frame rate. */
      ball = {x0:m.x, y0:m.y, vx:v.x, vy:v.y, t:0, x:m.x, y:m.y};
      shots++; Sfx.pop();
    }
    const at = (b, t2) => ({x:b.x0 + b.vx * t2, y:b.y0 + b.vy * t2 + 0.5 * G_ACC * t2 * t2});
    function land(result, dx){
      const G = geo();
      ball = null;
      if (result === 'in'){
        hit = true;
        const stars = shots <= 1 ? 3 : shots === 2 ? 2 : 1;
        finishGame(stars, shots, 'In the bucket on shot ' + shots + '!');
        return;
      }
      Sfx.bad();
      note = dx < 0 ? 'Short by ' + Math.round(-dx) + ' - more force or a flatter angle.'
                    : 'Long by ' + Math.round(dx) + ' - ease off.';
      noteT = 3;
      if (conf.shots && shots >= conf.shots)
        failGame('Out of shots. The hard ring only gives you ' + conf.shots + '.');
    }
    return {
      debug(){
        const G = geo(), m = muzzle();
        return {angle, force, dist, shots, tol:conf.tol, lockForce:conf.lockForce,
                maxShots:conf.shots, flying:!!ball, hit, g:G_ACC, kv:KV,
                geo:{groundY:G.groundY, rim:G.rim, bucketX:G.bucketX, mx:m.x, my:m.y}};
      },
      hudNote(){ return conf.shots ? 'Shot ' + Math.min(shots + 1, conf.shots) + '/' + conf.shots
                                   : 'Shots ' + shots; },
      update(dt){
        if (noteT > 0) noteT -= dt;
        if (!ball) return;
        const G = geo(), steps = 8, t0 = ball.t;
        for (let i = 1; i <= steps; i++){
          const t2 = t0 + dt * (i / steps);
          const prev = {x:ball.x, y:ball.y}, now = at(ball, t2);
          ball.x = now.x; ball.y = now.y; ball.t = t2;
          if (prev.y < G.rim && now.y >= G.rim && Math.abs(now.x - G.bucketX) <= conf.tol / 2){
            land('in', 0); return;
          }
          if (now.y >= G.groundY){ land('miss', now.x - G.bucketX); return; }
          if (now.x > V.w + 60 || t2 > 8){ land('miss', now.x - G.bucketX); return; }
        }
      },
      draw(){
        const g = ctx, G = geo();
        /* sky */
        const sky = g.createLinearGradient(0, 40, 0, G.groundY);
        sky.addColorStop(0, '#BFE3F5'); sky.addColorStop(1, '#EAF6FC');
        g.fillStyle = sky; g.fillRect(0, 0, V.w, G.groundY);
        const top = instr(conf.lockForce
          ? 'Force is locked at ' + conf.lockForce + '. Find the angle that drops the ball in the bucket.'
          : 'Set the angle and the force, then fire. Watch the dotted path.');
        /* clouds, so the sky is not a blank panel */
        g.fillStyle = 'rgba(255,255,255,.75)';
        for (const c of [[70, 0.22, 20], [250, 0.34, 26], [150, 0.5, 16]]){
          const cy2 = top + (G.groundY - top) * c[1];
          g.beginPath();
          g.arc(c[0], cy2, c[2], 0, 7);
          g.arc(c[0] + c[2], cy2 + 4, c[2] * 0.75, 0, 7);
          g.arc(c[0] - c[2], cy2 + 4, c[2] * 0.7, 0, 7);
          g.fill();
        }
        /* ground */
        g.fillStyle = C.sawdust; g.fillRect(0, G.groundY, V.w, V.h - G.groundY);
        g.fillStyle = C.navy; g.fillRect(0, G.groundY - 2, V.w, 2);
        /* distance ruler: the bucket distance can be read straight off the floor */
        g.strokeStyle = 'rgba(18,32,58,.45)'; g.lineWidth = 1.5;
        for (let d = 0; d + 40 < V.w; d += 50){
          g.beginPath(); g.moveTo(40 + d, G.groundY - 7); g.lineTo(40 + d, G.groundY + 7); g.stroke();
          T(String(d), 40 + d, G.groundY + 18, {size:10, weight:700, color:'rgba(18,32,58,.6)', num:true});
        }
        T('distance in units', V.w / 2, G.groundY + 38, {size:10.5, weight:700, color:'rgba(18,32,58,.5)'});
        /* bucket */
        const bx = G.bucketX, bw = conf.tol;
        g.fillStyle = C.red;
        g.beginPath();
        g.moveTo(bx - bw / 2, G.rim); g.lineTo(bx + bw / 2, G.rim);
        g.lineTo(bx + bw / 2 - 4, G.groundY); g.lineTo(bx - bw / 2 + 4, G.groundY);
        g.closePath(); g.fill();
        g.fillStyle = C.gold; g.fillRect(bx - bw / 2 - 2, G.rim - 4, bw + 4, 5);
        T(dist + ' units', bx, G.rim - 16, {size:11, weight:800, color:C.navy, num:true});
        /* cannon */
        const a = angle * Math.PI / 180;
        g.save(); g.translate(G.cx, G.groundY - 20); g.rotate(-a);
        g.fillStyle = C.navy; rr(g, -10, -11, 42, 22, 8); g.fill();
        g.fillStyle = C.slate; rr(g, 26, -13, 8, 26, 3); g.fill();
        g.restore();
        g.fillStyle = C.red;
        g.beginPath(); g.arc(G.cx, G.groundY - 10, 13, 0, 7); g.fill();
        g.lineWidth = 2; g.strokeStyle = C.navy; g.stroke();
        /* trajectory preview */
        if (!ball && !hit){
          const m = muzzle(), v = vel();
          g.fillStyle = 'rgba(18,32,58,.5)';
          for (let i = 1; i <= 70; i++){
            const t2 = i * 0.045;
            const px = m.x + v.x * t2, py = m.y + v.y * t2 + 0.5 * G_ACC * t2 * t2;
            if (py > G.groundY || px > V.w + 20) break;
            if (py < top) continue;
            g.beginPath(); g.arc(px, py, 2, 0, 7); g.fill();
          }
        }
        if (ball){
          g.fillStyle = C.ink;
          g.beginPath(); g.arc(ball.x, ball.y, 7, 0, 7); g.fill();
        }
        if (noteT > 0){
          panel(24, G.groundY - 78, V.w - 48, 34, {fill:C.navy, stroke:C.gold, r:10, lw:2});
          Twrap(note, V.w / 2, G.groundY - 61, V.w - 66, 15, {size:12.5, weight:700, color:C.cream});
        }
        /* controls */
        panel(6, G.slidersTop, V.w - 12, 184, {fill:C.cream, stroke:C.navy, r:14, lw:2, shadow:false});
        const track = (id, y, label, value, minV, maxV, disabled) => {
          T(label, 22, y - 14, {size:12, weight:800, color: disabled ? C.slate : C.navy, align:'left'});
          T(String(value) + (id === 'sAngle' ? '°' : ''), V.w - 22, y - 14,
            {size:16, weight:800, color: disabled ? C.slate : C.red, align:'right', num:true});
          const tx = 22, tw = V.w - 44;
          g.fillStyle = disabled ? '#D9D2C2' : C.creamDark;
          rr(g, tx, y - 5, tw, 10, 5); g.fill();
          g.strokeStyle = C.navy; g.lineWidth = 1.5; g.stroke();
          const u = (value - minV) / (maxV - minV);
          if (!disabled){
            g.fillStyle = C.gold; rr(g, tx, y - 5, tw * u, 10, 5); g.fill();
          }
          const hx = tx + tw * u;
          g.fillStyle = disabled ? C.slate : C.red;
          rr(g, hx - 15, y - 17, 30, 34, 9); g.fill();
          g.lineWidth = 2.5; g.strokeStyle = C.navy; g.stroke();
          g.strokeStyle = C.cream; g.lineWidth = 2;
          g.beginPath(); g.moveTo(hx, y - 8); g.lineTo(hx, y + 8); g.stroke();
          if (!disabled) reg(id, tx - 16, y - 24, tw + 32, 48, {track:[tx, tw, minV, maxV]});
        };
        track('sAngle', G.slidersTop + 42, 'ANGLE', angle, 0, 90, false);
        track('sForce', G.slidersTop + 96, 'FORCE', force, 1, 10, !!conf.lockForce);
        button('fire', V.w / 2 - 70, G.slidersTop + 126, 140, 50, ball ? 'FIRING...' : 'FIRE',
          {fill: ball ? C.slate : C.red, color:C.cream, size:19, disabled:!!ball || hit});
      },
      down(hit2, p){
        if (!hit2) return;
        if (hit2.id === 'sAngle' || hit2.id === 'sForce'){ drag = hit2; this.move(p); }
      },
      move(p){
        if (!drag || !drag.track) return;
        const [tx, tw, minV, maxV] = drag.track;
        const u = Math.max(0, Math.min(1, (p.x - tx) / tw));
        const val = Math.round(minV + u * (maxV - minV));
        if (drag.id === 'sAngle') angle = val; else force = val;
      },
      cancel(){ drag = null; },
      up(hit2, p, wasPressed){
        drag = null;
        if (hit2 && hit2.id === 'fire' && wasPressed === 'fire' && !hit2.disabled) fire();
      }
    };
  }
};

/* ===========================================================================
   GAME 6 - RIDDLE BOARD  (logical deduction)
   ========================================================================= */
function makeRiddle(diff){
  const conf = {easy:{max:10, clues:2}, medium:{max:30, clues:3}, hard:{max:50, clues:4}}[diff];
  const N = conf.max;
  const all = Array.from({length:N}, (_, i) => i + 1);
  function divisorsOf(n){
    const d = [];
    for (let k = 2; k <= 9; k++) if (n % k === 0 && n !== k) d.push(k);
    return d;
  }
  const digitSum = n => String(n).split('').reduce((a, c) => a + (+c), 0);
  function clueFor(kind, target){
    switch (kind){
      case 'parity': return target % 2 === 0
        ? {text:'I am an even number', test:n => n % 2 === 0}
        : {text:'I am an odd number', test:n => n % 2 === 1};
      case 'less': { const k = Math.min(N + 1, target + rndI(1, Math.max(2, Math.round(N / 4))));
        return {text:'I am less than ' + k, test:n => n < k}; }
      case 'more': { const k = Math.max(0, target - rndI(1, Math.max(2, Math.round(N / 4))));
        return {text:'I am greater than ' + k, test:n => n > k}; }
      case 'multiple': { const ds = divisorsOf(target); if (!ds.length) return null;
        const k = pickOne(ds);
        return {text:'I am in the ' + k + ' times table', test:n => n % k === 0}; }
      case 'digits': { const s = digitSum(target);
        return {text:'My digits add up to ' + s, test:n => digitSum(n) === s}; }
      case 'between': { const a = Math.max(1, target - rndI(1, 5)), b = Math.min(N, target + rndI(1, 5));
        return {text:'I am between ' + a + ' and ' + b, test:n => n >= a && n <= b}; }
      case 'doubleLess': { const k = 2 * target + 3 + rndI(1, 8);
        return {text:'Double me, add 3, and the answer is less than ' + k, test:n => 2 * n + 3 < k}; }
      case 'halfMore': { const k = Math.max(0, Math.floor(target / 2) - rndI(0, 3));
        return {text:'Half of me is more than ' + k, test:n => n / 2 > k}; }
      default: return null;
    }
  }
  const pool = diff === 'easy' ? ['parity', 'less', 'more', 'multiple', 'between']
             : diff === 'medium' ? ['parity', 'less', 'more', 'multiple', 'digits', 'between']
             : ['parity', 'less', 'more', 'multiple', 'digits'];
  /* Deliberate deviation from the brief's example clue ("double me and add 3, you
     get 15"): an exact-value indirect clue pins the answer on its own, which makes
     the other three clues decorative and turns a deduction puzzle into one sum.
     The indirect clues here constrain without determining, so all four do work. */
  const indirect = ['doubleLess', 'halfMore'];
  for (let attempt = 0; attempt < 4000; attempt++){
    const target = rndI(diff === 'easy' ? 2 : 4, N);
    const kinds = shuffle(pool.slice()).slice(0, conf.clues - (diff === 'hard' ? 1 : 0));
    if (diff === 'hard') kinds.push(pickOne(indirect));
    const clues = [];
    let bad = false;
    for (const k of kinds){
      const c = clueFor(k, target);
      if (!c || !c.test(target)){ bad = true; break; }
      clues.push(c);
    }
    if (bad || clues.length !== conf.clues) continue;
    const survivors = all.filter(n => clues.every(c => c.test(n)));
    if (survivors.length !== 1 || survivors[0] !== target) continue;
    /* every clue must do some work, or it is decoration */
    let redundant = false;
    for (let i = 0; i < clues.length; i++){
      const rest = clues.filter((_, j) => j !== i);
      if (all.filter(n => rest.every(c => c.test(n))).length === 1){ redundant = true; break; }
    }
    if (redundant) continue;
    return {target, clues, max:N};
  }
  /* deterministic fallback */
  const target = Math.min(7, N);
  return {target, max:N, clues:[
    {text:'I am an odd number', test:n => n % 2 === 1},
    {text:'I am greater than 5', test:n => n > 5},
    {text:'I am less than 9', test:n => n < 9}
  ]};
}

/* ===========================================================================
   GAME 7 - BALANCE BEAM  (weight x distance / equivalence)
   ========================================================================= */
/* Find k performers on distinct distances 1..4 whose weight*distance sums to T. */
function findSide(T, k){
  for (let t = 0; t < 4000; t++){
    const ds = shuffle([1, 2, 3, 4]).slice(0, k);
    const out = [];
    let partial = 0;
    for (let i = 0; i < k - 1; i++){ const w = rndI(1, 5); partial += w * ds[i]; out.push({w, d:ds[i]}); }
    const rem = T - partial, dl = ds[k - 1];
    if (rem > 0 && rem % dl === 0 && rem / dl >= 1 && rem / dl <= 5){
      out.push({w:rem / dl, d:dl});
      return out;
    }
  }
  return null;
}
function genBalance(diff){
  if (diff === 'easy'){
    const w = rndI(2, 4), d = rndI(1, 4);
    return {fixed:[{w, side:'L', d}], free:[w], leftovers:0,
            hint:'Both performers weigh the same, so they need the same distance.'};
  }
  if (diff === 'medium'){
    for (let a = 0; a < 200; a++){
      const leftCount = rndI(1, 2);
      const ds = shuffle([1, 2, 3, 4]).slice(0, leftCount);
      const fixed = ds.map(d => ({w:rndI(1, 5), side:'L', d}));
      const T = fixed.reduce((s, p) => s + p.w * p.d, 0);
      const k = leftCount === 1 ? rndI(2, 3) : 2;
      const sol = findSide(T, k);
      if (!sol) continue;
      return {fixed, free:shuffle(sol.map(s => s.w)), leftovers:0,
              hint:'The left side is already set. Match its turning force on the right.'};
    }
  }
  for (let a = 0; a < 400; a++){
    const k1 = rndI(2, 3), k2 = rndI(2, 3);
    if (k1 + k2 < 4 || k1 + k2 > 5) continue;
    const ds = shuffle([1, 2, 3, 4]).slice(0, k1);
    const left = ds.map(d => ({w:rndI(1, 5), d}));
    const T = left.reduce((s, p) => s + p.w * p.d, 0);
    const right = findSide(T, k2);
    if (!right) continue;
    const ws = left.map(p => p.w).concat(right.map(p => p.w));
    ws.push(rndI(1, 5));                       /* the one who sits out */
    return {fixed:[], free:shuffle(ws), leftovers:1,
            hint:'One performer has to sit this act out.'};
  }
  return {fixed:[{w:3, side:'L', d:2}], free:[3], leftovers:0, hint:'Match the turning force.'};
}
GAMES.balance = {

  desc:'Turning force is weight times distance from the middle. Drag performers onto the spots until both sides match.',

        /* beam */

        g.fillStyle = C.navy; rr(g, -4.7 * G.unit, -7, 9.4 * G.unit, 14, 7); g.fill();

        g.fillStyle = C.navy; g.fillRect(G.cx - 34, G.beamY + 58, 68, 8);
        /* slot drop targets + seated performers */
        for (let d = 1; d <= 4; d++){
          for (const side of ['L', 'R']){

      down(hit, p){
        if (!hit) return;
        if (hit.id.indexOf('take_') === 0){
          const who = byId(hit.pid);
          if (!who || who.fixed) return;
          drag = {id:who.id, x:p.x, y:p.y, from:who.slot};
          who.slot = null;
          Sfx.pop();
        }
      },
      move(p){ if (drag){ drag.x = p.x; drag.y = p.y - 16; } },
      cancel(){ drag = null; },
      up(hit, p, wasPressed){
        if (!drag) return;
        const who = byId(drag.id), from = drag.from;
        let target = null;
        for (let d = 1; d <= 4; d++) for (const side of ['L', 'R']){
          const slot = side + d, sp = slotPos(slot);
          const dist = Math.hypot(sp.x - drag.x, sp.y - 18 - drag.y);
          if (dist < 34 && !occupant(slot) && (!target || dist < target.dist)) target = {slot, dist};
        }
        drag = null;
        if (!target){
          who.slot = null;              /* back to the wings, costs nothing */
          return;
        }
        who.slot = target.slot;
        if (target.slot !== from){
          moves++;
          Sfx.click();
          if (moves > limit){
            failGame('Out of moves. You get ' + limit + ' in this ring.');
            return;
          }
        }
        checkWin();
        if (!current.done && placedFree() === mustPlace && torqueOf('L') !== torqueOf('R')){
          note = 'Not level: ' + torqueOf('L') + ' against ' + torqueOf('R') + '. Move someone.';
          noteT = 2.6;
        }
      }
    };
  }
};
function drawPerformer(x, y, p, lifted){
  if (!p) return;
  const g = ctx;
  if (lifted){ g.save(); g.globalAlpha = 0.92; }
  g.fillStyle = C.ink; g.globalAlpha *= 0.2;
  g.beginPath(); g.ellipse(x, y + 20, 14, 4, 0, 0, 7); g.fill();
  g.globalAlpha = lifted ? 0.92 : 1;
  g.fillStyle = p.fixed ? C.slate : C.purple;
  g.beginPath(); g.moveTo(x - 12, y + 18); g.lineTo(x + 12, y + 18); g.lineTo(x, y - 6); g.closePath(); g.fill();
  g.fillStyle = '#F0C9A0';
  g.beginPath(); g.arc(x, y - 10, 9, 0, 7); g.fill();
  g.fillStyle = C.gold;
  g.beginPath(); g.arc(x, y + 6, 11, 0, 7); g.fill();
  g.lineWidth = 2; g.strokeStyle = C.navy; g.stroke();
  T(String(p.w), x, y + 7, {size:14, weight:800, color:C.ink, num:true});
  if (lifted) g.restore();
}

function money(c){ return c % 100 === 0 ? '$' + (c / 100) : '$' + (c / 100).toFixed(2); }
function moneyOptions(correct, unit){
  const set = [correct];
  const deltas = [unit, -unit, 100, -100, 50, -50, 2 * unit];
  for (const d of shuffle(deltas.slice())){
    const v = correct + d;
    if (v > 0 && set.indexOf(v) < 0) set.push(v);
    if (set.length === 4) break;
  }
  while (set.length < 4) set.push(correct + set.length * 25);
  return shuffle(set);
}

/* ===========================================================================
   GAME 9 - ELEPHANT MEDICINE  (measurement / jug puzzle)
   ========================================================================= */
/* Breadth-first search over container states. Ops: fill from the barrel,
   empty into the drain, pour one cup into another. */
function jugSearch(caps){
  const start = caps.map(() => 0);
  const key = v => v.join(',');
  const dist = new Map([[key(start), 0]]);
  let frontier = [start];
  while (frontier.length){
    const next = [];
    for (const st of frontier){
      const d = dist.get(key(st));
      const moves = [];
      for (let i = 0; i < caps.length; i++){
        if (st[i] < caps[i]){ const n = st.slice(); n[i] = caps[i]; moves.push(n); }
        if (st[i] > 0){ const n = st.slice(); n[i] = 0; moves.push(n); }
        for (let j = 0; j < caps.length; j++){
          if (i === j || st[i] === 0 || st[j] === caps[j]) continue;
          const amt = Math.min(st[i], caps[j] - st[j]);
          const n = st.slice(); n[i] -= amt; n[j] += amt; moves.push(n);
        }
      }
      for (const n of moves){
        const k = key(n);
        if (!dist.has(k)){ dist.set(k, d + 1); next.push(n); }
      }
    }
    frontier = next;
  }
  const best = new Map();
  for (const [k, d] of dist){
    for (const v of k.split(',').map(Number)){
      if (v > 0 && (!best.has(v) || best.get(v) > d)) best.set(v, d);
    }
  }
  return best;
}
function genElephant(diff){
  const conf = {easy:{pool:[3, 4, 5, 6], n:2, ops:[2, 2]},
                medium:{pool:[2, 3, 4, 5, 6, 7, 8], n:3, ops:[3, 4]},
                hard:{pool:[3, 5, 7, 8, 9, 11, 12], n:3, ops:[4, 6]}}[diff];
  for (let a = 0; a < 300; a++){
    const caps = shuffle(conf.pool.slice()).slice(0, conf.n).sort((x, y) => x - y);
    if (new Set(caps).size !== caps.length) continue;
    const best = jugSearch(caps);
    const targets = [];
    for (const [t, d] of best){
      if (caps.indexOf(t) >= 0) continue;                 /* a plain fill is no puzzle */
      if (d >= conf.ops[0] && d <= conf.ops[1]) targets.push({t, d});
    }
    if (!targets.length) continue;
    const pickT = pickOne(targets);
    return {caps, target:pickT.t, minOps:pickT.d};
  }
  return {caps:[3, 5], target:4, minOps:6};
}

/* ===========================================================================
   GAME 10 - SCAFFOLDING BOLTS  (coordinate geometry)
   ========================================================================= */
function genBolts(diff){
  if (diff === 'easy'){
    const size = 5;
    const target = {x:rndI(1, size), y:rndI(1, size)};
    const shown = [];
    while (shown.length < 4){
      const p = {x:rndI(1, size), y:rndI(1, size)};
      if ((p.x === target.x && p.y === target.y) || shown.some(q => q.x === p.x && q.y === p.y)) continue;
      shown.push(p);
    }
    return {size, shown, missing:[target], columns:[],
            prompt:'Put the missing bolt at (' + target.x + ', ' + target.y + ').'};
  }
  if (diff === 'medium'){
    const size = 8;
    for (let a = 0; a < 400; a++){
      const m = pickOne([1, 1, 2, -1]), b = rndI(-2, 6);
      const pts = [];
      for (let x = 1; x <= 5; x++){
        const y = m * x + b;
        if (y < 1 || y > size) { pts.length = 0; break; }
        pts.push({x, y});
      }
      if (pts.length !== 5) continue;
      const hideAt = rndI(1, 3);                       /* never an end point */
      const missing = [pts[hideAt]];
      const shown = pts.filter((_, i) => i !== hideAt);
      return {size, shown, missing, columns:[missing[0].x],
              prompt:'The bolts follow a straight line. Where does the missing one go?'};
    }
  }
  const size = 10;
  const S = rndI(6, 11);
  const pts = [];
  for (let x = 1; x <= size; x++){
    const y = S - x;
    if (y >= 1 && y <= size) pts.push({x, y});
  }
  const idxs = shuffle(pts.map((_, i) => i)).slice(0, 2);
  const missing = idxs.map(i => pts[i]);
  const shown = pts.filter((_, i) => idxs.indexOf(i) < 0);
  return {size, shown, missing, columns:missing.map(p => p.x),
          prompt:'Every bolt on this brace obeys one rule. Two are missing.'};
}

          g.beginPath(); g.moveTo(G.x0, G.y0 + i * G.cell); g.lineTo(G.x0 + G.cell * puz.size, G.y0 + i * G.cell); g.stroke();
        }
        /* axis labels */
        const lab = G.cell < 30 ? 9 : 11;
        for (let i = 1; i <= puz.size; i++){
          T(String(i), G.x0 + (i - 0.5) * G.cell, G.y0 + G.cell * puz.size + 11,
            {size:lab, weight:800, color:C.navy, num:true});
          T(String(i), G.x0 - 9, G.y0 + (puz.size - i + 0.5) * G.cell,
            {size:lab, weight:800, color:C.navy, num:true});
        }
        T('x', G.x0 + G.cell * puz.size + 8, G.y0 + G.cell * puz.size + 11, {size:11, weight:800, color:C.red});
        T('y', G.x0 - 9, G.y0 - 10, {size:11, weight:800, color:C.red});
        /* bolts */
        const bolt = (p, col) => {
          const c = cellAt(p.x, p.y);
          g.fillStyle = col;
          g.beginPath(); g.arc(c.x + c.s / 2, c.y + c.s / 2, Math.max(5, c.s * 0.26), 0, 7); g.fill();
          g.lineWidth = 2; g.strokeStyle = C.navy; g.stroke();
        };
        for (const p of puz.shown) bolt(p, C.slate);
        for (const p of found) bolt(p, C.green);

        for (const p of puz.missing){
          if (found.some(f => f.x === p.x && f.y === p.y)) continue;
