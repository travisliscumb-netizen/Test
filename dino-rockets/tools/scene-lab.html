<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:,">
<title>Dino Scene Lab</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:ui-rounded,system-ui,sans-serif}
body{background:linear-gradient(#8FD6FF,#D8F3FF)}
#ground{position:fixed;left:0;right:0;bottom:0;height:110px;background:#3FAE55;border-top:6px solid #8EE06A}
.card{position:fixed;left:14px;right:14px;top:70px;bottom:250px;background:rgba(255,255,255,.96);border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center}
h2{margin:0 0 16px;color:#1E6FE8}
.slots{display:flex;gap:10px;flex-wrap:nowrap}
.slot{width:64px;height:70px;border-radius:16px;background:#FF8A1F;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:36px;font-weight:900;box-shadow:0 5px 0 #C4520A}
.slot .lo{font-size:14px;opacity:.8}
#hud{position:fixed;left:8px;top:8px;z-index:999;background:rgba(10,20,40,.86);color:#fff;font:600 11px/1.45 ui-monospace,monospace;padding:6px 9px;border-radius:9px;white-space:pre}
</style>
<link rel="stylesheet" href="../src/15-stage.css">
</head>
<body>
<div id="ground"></div>
<div class="card" id="card"><h2 id="title">SCENE LAB</h2><div class="slots" id="slots"></div></div>
<div id="fxLayer"></div>
<div id="hud"></div>
<script src="../src/20-core.js"></script>
<script src="../src/40-sfx.js"></script>
<script src="../src/50-dinos.js"></script>
<script src="../src/60-stage.js"></script>
<script>
var CORE = __CORE;
var silent = { play: function(){} };
var stage = createStage({ core: CORE, sfx: silent, art: DINO_ART, memberArt: memberArt, neckPath: brachioNeckPath });
stage.init(document.getElementById('fxLayer'));
/* the lab's crew: the originals fully levelled, and one baby for each power */
var POOL = CORE.CHAR_ORDER.map(function(k){ return { id: k, kind: k, level: 5, grow: 'grown', scale: 1, name: CORE.CHARS[k].name }; })
  .concat(CORE.POWER_ORDER.map(function(p, i){
    var b = CORE.makeBaby(4000 + i * 977, 2);
    var grow = ['baby', 'kid', 'grown', 'kid', 'baby', 'kid'][i];
    return { id: 'p' + i, kind: CORE.CHAR_ORDER[(i + 1) % CORE.CHAR_ORDER.length], power: p, level: grow === 'baby' ? 1 : (grow === 'kid' ? 3 : 5), grow: grow,
             scale: CORE.GROW_SCALE[grow], body: b.body, spots: b.spots, pattern: b.pattern, name: b.name };
  }));
/* a rescue to film: who does it and how (null = whoever the plan picks) */
var RESCUERS = { lasso: 'dash', magnet: 'p2', bubble: 'p1', hook: 'swoop', crane: 'brachio', tailflip: 'stego', tunnel: 'p3', frost: 'p4', jet: 'rex', fetch: 'dash' };
function castFor(sceneId, lead){
  var s = CORE.SCENE_BY_ID[sceneId], need = (s && s.lead) || {}, L = null;
  POOL.forEach(function(m){ if (m.id === lead) L = m; });
  if (!L && need.power) POOL.forEach(function(m){ if (!L && m.power === need.power) L = m; });
  if (!L) L = POOL.filter(function(m){ return m.id === (need.kind || 'dash'); })[0];
  var rest = POOL.filter(function(m){ return m !== L && !m.power; });
  /* the team-ups need a jumper along */
  rest.sort(function(a, b){ return (b.kind === 'dash' || b.kind === 'rex') - (a.kind === 'dash' || a.kind === 'rex'); });
  var cast = [L].concat(rest.slice(0, 3));
  var R = window.__labRescue;
  if (R && RESCUERS[R] && RESCUERS[R] !== L.id && !cast.some(function(m){ return m.id === RESCUERS[R]; })){
    cast[cast.length - 1] = POOL.filter(function(m){ return m.id === RESCUERS[R]; })[0];
  }
  return cast;
}
function groundY(){ return document.getElementById('ground').getBoundingClientRect().top + 8; }
function renderWord(word){
  var box = document.getElementById('slots'); box.innerHTML = '';
  word.split('').forEach(function(ch){
    var s = document.createElement('div'); s.className = 'slot';
    s.innerHTML = '<span>' + ch + '</span><span class="lo">' + ch.toLowerCase() + '</span>';
    box.appendChild(s);
  });
  return box.querySelectorAll('.slot');
}
var lastPlan = null;
window.__lab = {
  scenes: CORE.SCENES.map(function(s){ return { id: s.id, name: s.name, lead: s.lead, min: s.min }; }),
  pool: POOL,
  FUMBLES: ['sky-hook', 'jet-jump', 'tow-truck', 'joy-ride', 'stomp-stack', 'crane-lift', 'tail-flip'],
  RESCUES: Object.keys(RESCUERS),
  setFumble: function(on){ window.__labFumble = !!on; },
  setRescue: function(m){ window.__labRescue = m || null; },
  /* everyone who may lead a scene: every kind for an open scene, plus the power baby */
  leadsFor: function(id){
    var s = CORE.SCENE_BY_ID[id];
    return POOL.filter(function(m){
      return CORE.canLead(s, m) && (!s.needs || CORE.eligibleScenes(m, Math.max(3, s.min || 1), castFor(id, m.id)).some(function(x){ return x.id === id; }));
    }).map(function(m){ return m.id; });
  },
  castFor: function(id, lead){ return castFor(id, lead).map(function(m){ return m.id; }); },
  plan: function(id, word, lead, mirror, watcher){
    var cast = castFor(id, lead);
    return CORE.planScene({ letters: word.length, lead: cast[0].id, cast: cast, forceId: id, mirror: !!mirror, tempo: 1, rnd: CORE.rng(word.length * 13),
      watcher: watcher == null ? true : watcher, fumble: !!window.__labFumble, showoff: true, victory: true,
      rescue: window.__labRescue || null, fumbler: window.__labRescue ? RESCUERS[window.__labRescue] : null });
  },
  run: function(id, word, lead, mirror, watcher){
    document.getElementById('title').textContent = id + ' · ' + lead;
    var els = renderWord(word);
    var plan = this.plan(id, word, lead, mirror, watcher);
    stage.setCast(castFor(id, lead));
    lastPlan = plan;
    var probs = CORE.validatePlan(plan);
    document.getElementById('hud').textContent = plan.id + '  ' + plan.duration + 'ms  n=' + word.length + (probs.length ? '\nPROBLEMS: ' + probs.join('; ') : '');
    window.__labDone = false; window.__labErrors = null;
    return stage.play(plan, els, { layer: document.getElementById('fxLayer'), groundY: groundY() }).then(function(errs){
      window.__labDone = true; window.__labErrors = errs; return errs;
    });
  },
  probe: function(){
    var d = stage.debug(), props = document.querySelectorAll('.letterprop'), boxes = [];
    for (var i = 0; i < props.length; i++){
      var r = props[i].getBoundingClientRect(), op = Number(props[i].style.opacity || 1);
      boxes.push({ x: Math.round(r.left), y: Math.round(r.top), w: Math.round(r.width), h: Math.round(r.height), op: op });
    }
    var acts = {}, A = stage.actors();
    for (var k in A) acts[k] = { x: Math.round(A[k].x), y: Math.round(A[k].y), op: Number(A[k].op.toFixed(2)), rot: Math.round(A[k].rot) };
    return { live: d, props: boxes, actors: acts, states: d ? d.states : [] };
  },
  trace: function(on){ stage.trace(on); },
  traced: function(){ return stage.traced(); },
  ambient: function(keys, ceil){
    stage.setCast(POOL.filter(function(m){ return keys.indexOf(m.id) !== -1; }));
    stage.ambient.start({ keys: keys, groundY: groundY(), left: 6, right: window.innerWidth - 6, lineup: false, ceil: ceil == null ? null : ceil });
  },
  stopAmbient: function(){ stage.ambient.stop(); },
  react: function(kind){ stage.ambient.react(kind, { x: window.innerWidth / 2, y: 200 }); },
  residue: function(){
    return {
      props: document.querySelectorAll('.letterprop').length,
      fx: document.querySelectorAll('.fx').length,
      visibleActors: Array.prototype.filter.call(document.querySelectorAll('.actor'), function(a){ return Number(a.style.opacity || 0) > 0.02; }).length,
      layerTransform: document.getElementById('fxLayer').style.transform || ''
    };
  }
};
</script>
</body>
</html>
