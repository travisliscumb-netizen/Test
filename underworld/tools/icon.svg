<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#232b3d"/><stop offset="0.55" stop-color="#11151e"/><stop offset="1" stop-color="#07080c"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe7a3"/><stop offset="0.45" stop-color="#f2c230"/><stop offset="1" stop-color="#b9821c"/>
    </linearGradient>
    <linearGradient id="goldEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1c4"/><stop offset="1" stop-color="#8a5e12"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2232"/><stop offset="1" stop-color="#0b0d12"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8a3d" stop-opacity="0"/><stop offset="1" stop-color="#ff8a3d" stop-opacity="0.35"/>
    </linearGradient>
  </defs>
  <!-- full-bleed background: the platform rounds the corners (and maskable icons keep the crest inside the safe zone) -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- the harbour skyline, low and dark, with a warm glow under it -->
  <rect x="0" y="600" width="1024" height="424" fill="url(#glow)"/>
  <g fill="#05060a" opacity="0.95"><rect x="0" y="844" width="61" height="180"/><rect x="60" y="724" width="71" height="300"/><rect x="130" y="874" width="45" height="150"/><rect x="174" y="874" width="85" height="150"/><rect x="258" y="754" width="61" height="270"/><rect x="318" y="754" width="45" height="270"/><rect x="362" y="874" width="53" height="150"/><rect x="414" y="784" width="45" height="240"/><rect x="458" y="874" width="71" height="150"/><rect x="528" y="874" width="53" height="150"/><rect x="580" y="784" width="85" height="240"/><rect x="664" y="694" width="45" height="330"/><rect x="708" y="874" width="85" height="150"/><rect x="792" y="724" width="53" height="300"/><rect x="844" y="874" width="85" height="150"/><rect x="928" y="754" width="85" height="270"/><rect x="1012" y="874" width="71" height="150"/></g>
  <!-- the crest: a gold-edged shield -->
  <path d="M512 150 L792 236 V492 C792 662 676 770 512 850 C348 770 232 662 232 492 V236 Z" fill="url(#goldEdge)"/>
  <path d="M512 186 L760 262 V492 C760 642 658 738 512 812 C366 738 264 642 264 492 V262 Z" fill="url(#shield)"/>
  <!-- crown over the monogram -->
  <path d="M392 330 L428 262 L470 312 L512 236 L554 312 L596 262 L632 330 Z" fill="url(#gold)"/>
  <rect x="392" y="330" width="240" height="26" rx="6" fill="url(#gold)"/>
  <circle cx="428" cy="256" r="14" fill="#ffe7a3"/><circle cx="512" cy="228" r="16" fill="#ffe7a3"/><circle cx="596" cy="256" r="14" fill="#ffe7a3"/>
  <!-- the U monogram -->
  <path d="M396 392 H476 V572 C476 610 490 628 512 628 C534 628 548 610 548 572 V392 H628 V578 C628 664 580 712 512 712 C444 712 396 664 396 578 Z" fill="url(#gold)"/>
  <rect x="378" y="392" width="116" height="22" fill="url(#gold)"/><rect x="530" y="392" width="116" height="22" fill="url(#gold)"/>
