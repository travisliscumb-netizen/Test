<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1">
<title>Block Stack</title>
<meta name="description" content="Time the drop. Keep the line. 100 levels, 10 worlds and an endless climb.">
<meta name="theme-color" content="#0E1120">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Block Stack">
<meta name="format-detection" content="telephone=no">
<meta property="og:type" content="website">
<meta property="og:title" content="Block Stack">
<meta property="og:description" content="Time the drop. Keep the line. 100 levels, 10 worlds and an endless climb.">
<meta property="og:image" content="icons/og-cover.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Block Stack">
<meta name="twitter:description" content="Time the drop. Keep the line. 100 levels, 10 worlds and an endless climb.">
<meta name="twitter:image" content="icons/og-cover.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icons/favicon-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
<link rel="apple-touch-startup-image" href="icons/splash-1290x2796.png" media="(device-width:430px) and (device-height:932px) and (-webkit-device-pixel-ratio:3)">
<link rel="apple-touch-startup-image" href="icons/splash-1179x2556.png" media="(device-width:393px) and (device-height:852px) and (-webkit-device-pixel-ratio:3)">
<link rel="apple-touch-startup-image" href="icons/splash-1170x2532.png" media="(device-width:390px) and (device-height:844px) and (-webkit-device-pixel-ratio:3)">
<link rel="apple-touch-startup-image" href="icons/splash-1284x2778.png" media="(device-width:428px) and (device-height:926px) and (-webkit-device-pixel-ratio:3)">
<link rel="apple-touch-startup-image" href="icons/splash-1242x2688.png" media="(device-width:414px) and (device-height:896px) and (-webkit-device-pixel-ratio:3)">
<link rel="apple-touch-startup-image" href="icons/splash-1125x2436.png" media="(device-width:375px) and (device-height:812px) and (-webkit-device-pixel-ratio:3)">
<link rel="apple-touch-startup-image" href="icons/splash-828x1792.png" media="(device-width:414px) and (device-height:896px) and (-webkit-device-pixel-ratio:2)">
<link rel="apple-touch-startup-image" href="icons/splash-750x1334.png" media="(device-width:375px) and (device-height:667px) and (-webkit-device-pixel-ratio:2)">
<link rel="stylesheet" href="src/ui.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-pause" viewBox="0 0 24 24"><rect x="7" y="5" width="3.6" height="14" rx="1.4"/><rect x="13.4" y="5" width="3.6" height="14" rx="1.4"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M14.6 5.4 8 12l6.6 6.6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></symbol>
  <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M7 3h10v4a5 5 0 0 1-10 0zM4 5h2v2a3 3 0 0 1-2-2zm16 0a3 3 0 0 1-2 2V5zM10 13h4l.6 4H9.4zM7.5 19h9l.6 2h-10z"/></symbol>
  <symbol id="i-tower" viewBox="0 0 24 24"><rect x="4" y="16.5" width="16" height="4.2" rx="1.4"/><rect x="5.8" y="11" width="12.4" height="4.2" rx="1.4"/><rect x="7.6" y="5.5" width="8.8" height="4.2" rx="1.4"/></symbol>
  <symbol id="i-crown" viewBox="0 0 24 24"><path d="M3 8.4 7.1 12l4.9-7.4L16.9 12 21 8.4 19.3 19.4H4.7z"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><path d="M7 10V8a5 5 0 0 1 10 0v2h1.2v10H5.8V10zm2.2 0h5.6V8a2.8 2.8 0 0 0-5.6 0z"/></symbol>
  <symbol id="i-sound" viewBox="0 0 24 24"><path d="M4 9.5h3.6L12 5.2v13.6L7.6 14.5H4zM15 9a4.2 4.2 0 0 1 0 6l1.5 1.5a6.3 6.3 0 0 0 0-9z"/></symbol>
  <symbol id="i-music" viewBox="0 0 24 24"><path d="M18 3.5v10.2a3.2 3.2 0 1 1-2.1-3V7.6L10 9v7.9a3.2 3.2 0 1 1-2.1-3V6.4z"/></symbol>
  <symbol id="i-haptic" viewBox="0 0 24 24"><rect x="8.5" y="3" width="7" height="18" rx="2.2"/><path d="M4.4 8.2 3 7.1a9 9 0 0 0 0 9.8l1.4-1.1a7.3 7.3 0 0 1 0-7.6zM19.6 8.2 21 7.1a9 9 0 0 1 0 9.8l-1.4-1.1a7.3 7.3 0 0 0 0-7.6z"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.6 4.6 4.6L19 7.8l-1.9-1.9-7.5 7.5-2.7-2.7z"/></symbol>
  <symbol id="i-dot" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/></symbol>
  <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 2.5 14 9l6.5 2-6.5 2-2 6.5-2-6.5L3.5 11 10 9z"/></symbol>
  <symbol id="i-retry" viewBox="0 0 24 24"><path d="M12 5V2.2L7.8 6.2 12 10.2V7.4a4.7 4.7 0 1 1-4.7 4.7H5a7 7 0 1 0 7-7z"/></symbol>
</defs></svg>

<div id="app">
  <canvas id="stage"></canvas>

  <!-- gameplay HUD -->
  <div id="hud" class="layer hidden">
    <div class="hud-rail"><i id="hudRail"></i></div>
    <div class="hud-top">
      <button id="pauseBtn" class="icon-btn" aria-label="Pause"><svg><use href="#i-pause"/></svg></button>
      <div class="hud-meta">
        <div class="hud-level" id="hudLevel">Level 1</div>
        <div class="hud-world" id="hudWorld">Meadow Dawn</div>
      </div>
      <div class="hud-right">
        <div>
          <div class="hud-score num" id="hudScore">0</div>
          <div class="hud-score-l" id="hudScoreLabel">SCORE</div>
        </div>
        <div id="combo" class="combo"></div>
      </div>
    </div>
    <div id="hint" class="hint"></div>
    <button id="finishBtn" class="finish-btn hidden">Bank Run</button>
  </div>

  <!-- title -->
  <section id="title" class="layer screen">
    <div class="screen-inner">
      <div class="logo">
        <canvas id="logoIcon" width="260" height="260" aria-hidden="true"></canvas>
        <h1>BLOCK<span>STACK</span></h1>
        <p class="tag">Time the drop. Keep the line.</p>
      </div>
      <div class="stack-col">
        <button id="playBtn" class="btn btn-primary btn-lg btn-stack">
          <span id="playLabel">Play</span>
        </button>
        <button id="stackBtn" class="btn btn-lg btn-stack">
          <span>Stack · Endless</span>
          <span class="btn-sub" id="stackSub">Best 0</span>
        </button>
        <div class="row">
          <button id="mapBtn" class="btn"><svg><use href="#i-grid"/></svg>Levels</button>
          <button id="recordsBtn" class="btn"><svg><use href="#i-trophy"/></svg>Records</button>
        </div>
      </div>
      <div class="stat-strip">
        <div class="stat"><b class="num" id="tStatLevel">1</b><span>Level</span></div>
        <div class="stat"><b class="num" id="tStatCrowns">0</b><span>Crowns</span></div>
        <div class="stat"><b class="num" id="tStatPerfect">0</b><span>Perfects</span></div>
      </div>
      <div class="toggles">
        <button class="toggle" data-setting="sound" aria-label="Sound"><svg><use href="#i-sound"/></svg></button>
        <button class="toggle" data-setting="music" aria-label="Music"><svg><use href="#i-music"/></svg></button>
        <button class="toggle" data-setting="haptics" aria-label="Haptics"><svg><use href="#i-haptic"/></svg></button>
      </div>
    </div>
  </section>

  <!-- level map -->
  <section id="map" class="layer screen">
    <div class="head">
      <button id="mapBack" class="icon-btn" aria-label="Back"><svg><use href="#i-back"/></svg></button>
      <div class="head-title">
        <div id="mapWorldName">Meadow Dawn</div>
        <div id="mapWorldSub">World 1 · Fundamentals</div>
      </div>
      <div class="head-aside num"><span id="mapCrowns">0</span>/30</div>
    </div>
    <div class="world-strip" id="worldStrip"></div>
    <div class="level-grid" id="levelGrid"></div>
    <div class="panel" id="worldPanel"></div>
    <div class="map-actions">
      <button id="mapPlay" class="btn btn-primary btn-lg"><svg><use href="#i-play"/></svg><span id="mapPlayLabel">Play</span></button>
      <div class="foot" id="mapFoot"></div>
    </div>
  </section>

  <!-- pause -->
  <section id="pause" class="layer sheet-wrap">
    <div class="sheet">
      <div class="grabber"></div>
      <h2>Paused</h2>
      <button id="resumeBtn" class="btn btn-primary btn-lg"><svg><use href="#i-play"/></svg>Resume</button>
      <div class="row">
        <button id="restartBtn" class="btn"><svg><use href="#i-retry"/></svg>Restart</button>
        <button id="toMapBtn" class="btn"><svg><use href="#i-grid"/></svg>Levels</button>
      </div>
      <div class="toggles" style="margin-top:6px">
        <button class="toggle" data-setting="sound" aria-label="Sound"><svg><use href="#i-sound"/></svg></button>
        <button class="toggle" data-setting="music" aria-label="Music"><svg><use href="#i-music"/></svg></button>
        <button class="toggle" data-setting="haptics" aria-label="Haptics"><svg><use href="#i-haptic"/></svg></button>
      </div>
    </div>
  </section>

  <!-- result -->
  <section id="result" class="layer screen">
    <div class="screen-inner">
      <div class="card">
        <div class="card-kicker" id="resKicker">Level 1</div>
        <h2 id="resTitle">Complete</h2>
        <div class="crowns" id="resCrowns"></div>
        <div class="score-big"><b class="num" id="resScore">0</b><span>SCORE</span></div>
        <div class="stat-row" id="resStats"></div>
        <div class="card-note" id="resNote"></div>
      </div>
      <div class="stack-col">
        <button id="resPrimary" class="btn btn-primary btn-lg">Next Level</button>
        <div class="row">
          <button id="resRetry" class="btn"><svg><use href="#i-retry"/></svg>Retry</button>
          <button id="resMap" class="btn"><svg><use href="#i-grid"/></svg>Levels</button>
        </div>
      </div>
      <p class="hint-line" id="retryHint">Tap anywhere to retry</p>
    </div>
  </section>

  <!-- world complete -->
  <section id="worldClear" class="layer screen">
    <div class="screen-inner">
      <div class="wc-kicker">World Complete</div>
      <h2 id="wcName">Meadow Dawn</h2>
      <div class="crowns big" id="wcCrowns"></div>
      <p id="wcNext">Coral Bay unlocked</p>
      <button id="wcBtn" class="btn btn-primary btn-lg" style="width:100%;max-width:320px">Continue</button>
    </div>
  </section>

  <!-- records -->
  <section id="records" class="layer screen">
    <div class="head">
      <button id="recBack" class="icon-btn" aria-label="Back"><svg><use href="#i-back"/></svg></button>
      <div class="head-title"><div>Records</div><div id="recSub">Your best runs</div></div>
      <div class="head-aside"></div>
    </div>
    <div class="rec-body">
      <div class="rec-grid" id="recGrid"></div>
      <h3>Achievements</h3>
      <div class="ach-list" id="achList"></div>
      <button id="wipeBtn" class="btn btn-danger">Erase All Progress</button>
    </div>
  </section>

  <div id="toast" class="toast"><svg><use href="#i-spark"/></svg><span id="toastText"></span></div>
  <div id="banner" class="banner"></div>
</div>

<div id="splash">
  <canvas id="splashIcon" width="324" height="324" aria-hidden="true"></canvas>
  <div class="mark">Block Stack</div>
  <div class="bar"><i></i></div>
</div>

<div class="haptic-host" aria-hidden="true">
  <input type="checkbox" switch id="hapticSwitch" tabindex="-1">
  <label for="hapticSwitch" id="hapticLabel"></label>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
