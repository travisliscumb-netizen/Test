# INACTIVE TEMPLATE. GitHub runs scheduled workflows only from the default
# branch, so this collects nothing until it is copied to
# .github/workflows/astra-intel.yml on main (needs the owner's go-ahead).
#
# What it does: every 10 minutes, fetch the City of Barrie's public winter
# servicing feed, append new observations to the `astra-intel-data` branch,
# and refresh history.json for the phone to import. No customer data is read.
# Cost: free for public repositories (GitHub-hosted runners).
#
# Note: scheduled runs can start late under GitHub load, and are disabled
# after 60 days without repository activity.

name: astra-intel
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: astra-intel
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            astra-snow/src
            astra-snow/tools
          path: app
      - name: Check out the data branch (create it on first run)
        run: |
          git clone --depth 1 --branch astra-intel-data "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data \
            || (mkdir data && cd data && git init -b astra-intel-data && git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git")
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect
        run: node --experimental-strip-types --no-warnings app/astra-snow/tools/collect.mjs data
      - name: Commit new observations
        run: |
          cd data
          git config user.name "astra-intel"
          git config user.email "astra-intel@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -q -m "intel $(date -u +%FT%TZ)"
          git push -q origin astra-intel-data
