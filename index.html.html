<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>HALO v0.7</title>
<style>
  :root{--void:#03060f;--ice:#e8f8ff;--dim:rgba(190,225,245,.42)}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:var(--void)}
  body{font-family:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
    -webkit-font-smoothing:antialiased;color:var(--ice);touch-action:none;cursor:crosshair}
  canvas{display:block;position:fixed;inset:0;touch-action:none}
  #vignette{position:fixed;inset:0;pointer-events:none;z-index:2;
    background:
      radial-gradient(120% 90% at 50% 45%, rgba(0,0,0,0) 40%, rgba(0,0,0,.58) 100%),
      linear-gradient(180deg, rgba(6,14,32,.4) 0%, rgba(0,0,0,0) 20%, rgba(0,0,0,0) 76%, rgba(6,14,32,.45) 100%)}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden}
  .lbl{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;
    opacity:0;transition:opacity .5s ease;will-change:transform,opacity}
  .lbl .tick{display:block;width:1px;height:14px;margin:0 auto 6px;
    background:linear-gradient(180deg,rgba(95,233,255,0),rgba(95,233,255,.75))}
  .lbl .name{font-size:11px;letter-spacing:.22em;text-transform:uppercase;
    color:rgba(232,248,255,.92);text-shadow:0 0 12px rgba(95,233,255,.55)}
  .lbl .role{display:block;margin-top:3px;font-size:8.5px;letter-spacing:.3em;
    text-transform:uppercase;color:rgba(169,140,255,.75)}
  .lbl.sub .name{font-size:9.5px;letter-spacing:.26em;color:rgba(200,238,255,.82)}
  .lbl.sub .tick{height:8px;margin-bottom:4px}
  .lbl.rel .name{font-size:8.5px;letter-spacing:.2em;color:rgba(169,140,255,.85)}

  #hud{position:fixed;inset:0;pointer-events:none;z-index:4}
  .hud-tl{position:absolute;top:max(18px,env(safe-area-inset-top));left:20px}
  .mark{font-size:13px;letter-spacing:.62em;font-weight:600;
    color:rgba(232,248,255,.95);text-shadow:0 0 18px rgba(95,233,255,.5)}
  .mark small{font-size:8px;letter-spacing:.2em;opacity:.4;vertical-align:super}
  .crumb{margin-top:8px;font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim)}
  .crumb b{color:rgba(95,233,255,.95);font-weight:400}
  .hud-tr{position:absolute;top:max(18px,env(safe-area-inset-top));right:20px;text-align:right;
    font-size:9px;letter-spacing:.2em;color:var(--dim);line-height:1.9}
  .hud-tr i{font-style:normal;color:rgba(95,233,255,.8)}
  .hud-bl{position:absolute;bottom:max(22px,env(safe-area-inset-bottom));left:20px;
    font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim);line-height:1.9}
  .hud-bl i{font-style:normal;color:rgba(169,140,255,.9)}
  .hud-b{position:absolute;bottom:max(22px,env(safe-area-inset-bottom));left:0;right:0;
    text-align:center;font-size:9px;letter-spacing:.24em;text-transform:uppercase;
    color:rgba(190,225,245,.3);transition:opacity 1.2s ease}
  .hud-b.gone{opacity:0}
  .rule{position:absolute;left:20px;right:20px;height:1px;
    background:linear-gradient(90deg,rgba(95,233,255,0),rgba(95,233,255,.16),rgba(95,233,255,0))}
  .rule.top{top:calc(max(18px,env(safe-area-inset-top)) + 62px)}
  #finder{position:fixed;left:50%;transform:translateX(-50%);
    bottom:max(74px,calc(env(safe-area-inset-bottom) + 74px));
    width:min(560px,86vw);z-index:6;pointer-events:none;opacity:0;
    transition:opacity .28s ease}
  #finder.open{opacity:1;pointer-events:auto}
  #finder input{width:100%;background:transparent;border:0;
    border-bottom:1px solid rgba(95,233,255,.35);outline:none;
    color:rgba(232,248,255,.96);font-family:inherit;font-size:13px;
    letter-spacing:.14em;padding:6px 2px;text-shadow:0 0 12px rgba(95,233,255,.4)}
  #finder input::placeholder{color:rgba(190,225,245,.28);letter-spacing:.2em}
  #results{margin-top:10px;max-height:38vh;overflow:hidden}
  .res{display:flex;align-items:baseline;gap:10px;padding:5px 2px;
    font-size:10px;letter-spacing:.12em;color:rgba(190,225,245,.55);
    border-left:1px solid transparent;padding-left:8px;cursor:pointer}
  .res.sel{color:rgba(232,248,255,.95);border-left-color:rgba(95,233,255,.8)}
  .res .rl{flex:1;text-transform:uppercase;letter-spacing:.18em}
  .res .rt{font-size:8px;color:rgba(169,140,255,.7);letter-spacing:.2em}
  .res .rs{font-size:8px;color:rgba(95,233,255,.6);font-variant-numeric:tabular-nums}
  .res .rw{font-size:8px;color:rgba(190,225,245,.3)}
  #finderHint{margin-top:8px;font-size:8px;letter-spacing:.2em;
    color:rgba(190,225,245,.22);text-transform:uppercase}
  #seek{position:fixed;right:20px;bottom:max(22px,env(safe-area-inset-bottom));
    z-index:5;width:30px;height:30px;border:1px solid rgba(95,233,255,.22);
    border-radius:50%;display:flex;align-items:center;justify-content:center;
    color:rgba(95,233,255,.7);font-size:13px;cursor:pointer;
    background:rgba(3,6,15,.4);backdrop-filter:blur(2px)}
  #saveState{position:fixed;left:50%;transform:translateX(-50%);
    top:max(18px,env(safe-area-inset-top));z-index:6;font-size:8px;
    letter-spacing:.28em;text-transform:uppercase;color:rgba(95,233,255,.55);
    opacity:0;transition:opacity .5s ease;pointer-events:none}
  #saveState.show{opacity:1}
  #boot{position:fixed;inset:0;z-index:9;background:var(--void);
    display:flex;align-items:center;justify-content:center;
    font-size:10px;letter-spacing:.5em;text-transform:uppercase;color:rgba(95,233,255,.7);
    transition:opacity 1.4s ease}
  #boot.gone{opacity:0;pointer-events:none}
  @media (max-width:640px){
    .hud-tl{left:14px} .hud-tr{right:14px} .hud-bl{left:14px} .rule{left:14px;right:14px}
    .mark{font-size:11px;letter-spacing:.5em}
    .hud-b{font-size:8px;letter-spacing:.18em;padding:0 24px;
      bottom:calc(max(22px,env(safe-area-inset-bottom)) + 52px)}
  }
  @media (prefers-reduced-motion:reduce){ .lbl{transition:none} }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vignette"></div>
<div id="labels"></div>
<div id="hud">
  <div class="hud-tl">
    <div class="mark">HALO <small>v0.7</small></div>
    <div class="crumb" id="crumb">UNIVERSE</div>
  </div>
  <div class="rule top"></div>
  <div class="hud-tr">
    <div>OBJECTS <i id="s-nodes">0</i></div>
    <div>RELATIONS <i id="s-edges">0</i></div>
    <div>SYNC <i id="s-fps">--</i></div>
  </div>
  <div class="hud-bl">
    <div>PROJECTION <i id="s-layout">—</i></div>
    <div>MOTION <i id="s-motion">—</i></div>
    <div>TYPE <i id="s-type">—</i></div>
  </div>
  <div class="hud-b" id="hint">&#9906; or / to find &nbsp;·&nbsp; drag to look &nbsp;·&nbsp; tap to enter &nbsp;·&nbsp; backspace returns &nbsp;·&nbsp; L reprojects</div>
</div>
<div id="finder">
  <input id="q" type="text" autocomplete="off" autocorrect="off" spellcheck="false"
         placeholder="find  ·  type:project  rel:dependsOn  near:core  changed:">
  <div id="results"></div>
  <div id="finderHint">enter to travel · esc to close</div>
</div>
<div id="seek">&#9906;</div>
<div id="saveState"></div>
<div id="boot">initialising object field</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ============================================================================
   HALO v0.7 — Search, Teleport & Persistence

   0 MODEL       capabilities, traits, types, relations. pure schema.
   1 IDENTITY    object records. no coordinates, no appearance, no view state.
   2 GRAPH       semantic relationships with inverses and cardinality.
   3 JOURNAL     append-only event stream + per-object watermark.
   4 PROJECTION  pluggable spatial engines.
   5 RENDER      occlusion, atmosphere, flight, motion budget, view state.

   Layers 0-4 contain zero references to THREE and run headless.
   ========================================================================= */
(function () {
  "use strict";

  var SCHEMA_VERSION = 7;

  function hash32(str) {
    var h = 2166136261 >>> 0;
    for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
    return h >>> 0;
  }
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function gaussian(rng) {
    var u = 0, v = 0;
    while (u === 0) u = rng();
    while (v === 0) v = rng();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  }
  function slug(s) { return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, ""); }
  function easeInOut(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function damp(cur, target, rate, dt) { return cur + (target - cur) * Math.min(1, rate * dt); }

/* ============================================================================
   LAYER 0 — MODEL
   Capabilities, traits, types and relations are SCHEMA, not data. They are
   declared once and resolved at read time, so adding a capability to a type
   never requires touching a single stored object.
   ========================================================================= */

  /* ---- capabilities: the machine-readable action surface ---------------- */
  var CAPABILITIES = {
    inspect:     { label: "Inspect",      note: "read identity, state and relations" },
    open:        { label: "Open",         note: "enter as a place" },
    relate:      { label: "Relate",       note: "form a relationship to another object" },
    annotate:    { label: "Annotate",     note: "attach notes and metadata" },
    archive:     { label: "Archive",      note: "move to dormant lifecycle" },
    contain:     { label: "Contain",      note: "hold child objects" },
    spawn:       { label: "Spawn",        note: "create a child object" },
    assign:      { label: "Assign",       note: "attach an agent to this object" },
    execute:     { label: "Execute",      note: "run as a process" },
    converse:    { label: "Converse",     note: "accept and answer natural language" },
    snapshot:    { label: "Snapshot",     note: "capture an immutable version" },
    derive:      { label: "Derive",       note: "produce a descendant object" },
    schedule:    { label: "Schedule",     note: "place on a timeline" },
    observe:     { label: "Observe",      note: "emit and receive change events" }
  };

  /* ---- traits: cross-cutting behaviour. composition, not inheritance ----
     A type may carry any number of traits. This is what stops the model
     needing a rebuild when something is a file AND knowledge AND authored. */
  var TRAITS = {
    addressable: { label: "Addressable", capabilities: ["inspect", "relate", "annotate", "observe"] },
    enterable:   { label: "Enterable",   capabilities: ["open"] },
    container:   { label: "Container",   capabilities: ["contain", "spawn"] },
    authored:    { label: "Authored",    capabilities: ["archive"] },
    versioned:   { label: "Versioned",   capabilities: ["snapshot", "derive"] },
    executable:  { label: "Executable",  capabilities: ["execute", "schedule"] },
    conversable: { label: "Conversable", capabilities: ["converse"] },
    delegable:   { label: "Delegable",   capabilities: ["assign"] }
  };

  /* ---- types: an extends chain for defaults, plus traits for behaviour -- */
  function TypeRegistry() { this.types = new Map(); }
  TypeRegistry.prototype.define = function (name, spec) {
    spec = spec || {};
    var parentName = spec.extends || null;
    var parent = parentName ? this.types.get(parentName) : null;
    if (parentName && !parent) throw new Error("HALO: unknown parent type " + parentName);

    var chain = parent ? parent.chain.concat([name]) : [name];
    var traits = new Set(parent ? parent.traits : []);
    (spec.traits || []).forEach(function (t) {
      if (!TRAITS[t]) throw new Error("HALO: unknown trait " + t);
      traits.add(t);
    });

    var caps = new Set();
    traits.forEach(function (t) {
      TRAITS[t].capabilities.forEach(function (c) {
        if (!CAPABILITIES[c]) throw new Error("HALO: unknown capability " + c);
        caps.add(c);
      });
    });
    (spec.capabilities || []).forEach(function (c) {
      if (!CAPABILITIES[c]) throw new Error("HALO: unknown capability " + c);
      caps.add(c);
    });

    var defaults = {};
    if (parent) for (var k in parent.defaults) defaults[k] = parent.defaults[k];
    if (spec.defaults) for (var k2 in spec.defaults) defaults[k2] = spec.defaults[k2];

    var resolved = {
      name: name, label: spec.label || name, abstract: !!spec.abstract,
      extends: parentName, chain: chain,
      traits: Array.from(traits), capabilities: Array.from(caps),
      defaults: defaults, renderable: spec.renderable !== false
    };
    this.types.set(name, resolved);
    return resolved;
  };
  TypeRegistry.prototype.get = function (name) { return this.types.get(name) || null; };
  TypeRegistry.prototype.has = function (name) { return this.types.has(name); };
  TypeRegistry.prototype.list = function () {
    var out = [];
    this.types.forEach(function (t) { out.push(t); });
    return out;
  };
  /* every descendant of a given type — how future systems query the world */
  TypeRegistry.prototype.descendants = function (name) {
    var out = [];
    this.types.forEach(function (t) { if (t.chain.indexOf(name) !== -1) out.push(t.name); });
    return out;
  };

  var TYPES = new TypeRegistry();

  TYPES.define("object", {
    abstract: true, label: "Object",
    traits: ["addressable"],
    defaults: { scale: 1.4, lifecycle: "active" }
  });
  TYPES.define("place", {
    extends: "object", abstract: true, label: "Place",
    traits: ["enterable", "container"]
  });
  TYPES.define("region", {
    extends: "place", label: "Region", renderable: false,
    defaults: { scale: 0 }
  });
  TYPES.define("hub", {
    extends: "place", label: "Operations Hub",
    traits: ["delegable", "conversable"],
    defaults: { scale: 7.0 }
  });
  TYPES.define("agent", {
    extends: "object", label: "AI Agent",
    traits: ["enterable", "executable", "conversable", "delegable"],
    defaults: { scale: 4.4 }
  });
  TYPES.define("project", {
    extends: "place", label: "Project",
    traits: ["authored", "versioned", "delegable"],
    defaults: { scale: 1.8 }
  });
  TYPES.define("knowledge", {
    extends: "object", label: "Knowledge",
    traits: ["enterable", "authored", "versioned"],
    defaults: { scale: 1.6 }
  });
  TYPES.define("system", {
    extends: "object", label: "System",
    traits: ["enterable", "executable", "versioned"],
    defaults: { scale: 1.6 }
  });
  TYPES.define("workflow", {
    extends: "object", label: "Workflow",
    traits: ["enterable", "executable", "delegable"],
    defaults: { scale: 1.6 }
  });
  TYPES.define("research", {
    extends: "knowledge", label: "Research",
    defaults: { scale: 1.6 }
  });
  TYPES.define("archive", {
    extends: "object", label: "Archive",
    traits: ["enterable", "container", "versioned"],
    defaults: { scale: 1.5, lifecycle: "dormant" }
  });
  TYPES.define("build", {
    extends: "object", label: "Build",
    traits: ["enterable", "executable", "versioned"],
    defaults: { scale: 1.5 }
  });
  TYPES.define("design", {
    extends: "object", label: "Design",
    traits: ["enterable", "authored", "versioned"],
    defaults: { scale: 1.5 }
  });

  /* ---- relations: declared, not hardcoded -------------------------------
     defineRelation() mints the inverse automatically, so new meaning can be
     added without touching the graph, the spatial engines or the renderer.
     'relevance' is SEMANTIC weight. It is not a brightness. The renderer
     DERIVES appearance from it; the model never states appearance. */

  var RELATION_CATEGORIES = {
    structural: { label: "Structural", note: "how things are composed" },
    knowledge:  { label: "Knowledge",  note: "how meaning refers to meaning" },
    workflow:   { label: "Workflow",   note: "how work moves and who owns it" },
    ai:         { label: "AI",         note: "how intelligence participates" }
  };

  function invertCardinality(c) {
    if (c === "one-to-many") return "many-to-one";
    if (c === "many-to-one") return "one-to-many";
    return c;
  }

  function RelationRegistry() { this.defs = new Map(); }
  RelationRegistry.prototype.define = function (name, spec) {
    if (!spec || !spec.category) throw new Error("HALO: relation '" + name + "' needs a category");
    if (!RELATION_CATEGORIES[spec.category]) throw new Error("HALO: unknown category " + spec.category);
    if (spec.relevance !== undefined && (spec.relevance < 0 || spec.relevance > 1)) {
      throw new Error("HALO: relevance must be 0..1");
    }
    var symmetric = !!spec.symmetric;
    var inverseName = symmetric ? name : (spec.inverse || (name + "By"));
    var rel = {
      name: name, label: spec.label || name, category: spec.category,
      meaning: spec.meaning || "", inverse: inverseName,
      cardinality: spec.cardinality || "many-to-many",
      relevance: spec.relevance === undefined ? 0.5 : spec.relevance,
      symmetric: symmetric, structural: spec.category === "structural", virtual: false
    };
    this.defs.set(name, rel);
    if (!symmetric) {
      this.defs.set(inverseName, {
        name: inverseName, label: spec.inverseLabel || ("inverse of " + rel.label),
        category: rel.category, meaning: rel.meaning, inverse: name,
        cardinality: invertCardinality(rel.cardinality), relevance: rel.relevance,
        symmetric: false, structural: rel.structural, virtual: true
      });
    }
    return rel;
  };
  RelationRegistry.prototype.get = function (n) { return this.defs.get(n) || null; };
  RelationRegistry.prototype.has = function (n) { return this.defs.has(n); };
  RelationRegistry.prototype.storable = function () {
    var out = []; this.defs.forEach(function (r) { if (!r.virtual) out.push(r.name); }); return out;
  };
  RelationRegistry.prototype.byCategory = function (cat) {
    var out = [];
    this.defs.forEach(function (r) { if (!r.virtual && r.category === cat) out.push(r.name); });
    return out;
  };
  RelationRegistry.prototype.list = function () {
    var out = []; this.defs.forEach(function (r) { out.push(r); }); return out;
  };

  var RELATIONS = new RelationRegistry();

  RELATIONS.define("contains", { category: "structural", label: "contains",
    inverse: "belongsTo", inverseLabel: "belongs to", cardinality: "one-to-many",
    relevance: 0.90, meaning: "composition" });
  RELATIONS.define("partOf", { category: "structural", label: "is part of",
    inverse: "hasPart", inverseLabel: "has part", cardinality: "many-to-one",
    relevance: 0.85, meaning: "membership without ownership" });

  RELATIONS.define("references", { category: "knowledge", label: "references",
    inverse: "referencedBy", inverseLabel: "referenced by",
    relevance: 0.35, meaning: "one object cites another" });
  RELATIONS.define("relatedTo", { category: "knowledge", label: "relates to",
    symmetric: true, relevance: 0.40, meaning: "undirected association" });
  RELATIONS.define("derivedFrom", { category: "knowledge", label: "derived from",
    inverse: "derivations", inverseLabel: "has derivation", cardinality: "many-to-one",
    relevance: 0.65, meaning: "produced from an ancestor" });
  RELATIONS.define("supports", { category: "knowledge", label: "supports",
    inverse: "supportedBy", inverseLabel: "supported by",
    relevance: 0.60, meaning: "provides evidence for" });

  RELATIONS.define("dependsOn", { category: "workflow", label: "depends on",
    inverse: "requiredBy", inverseLabel: "required by",
    relevance: 0.85, meaning: "breaks if the other is absent" });
  RELATIONS.define("assignedTo", { category: "workflow", label: "assigned to",
    inverse: "handles", inverseLabel: "handles",
    relevance: 0.70, meaning: "responsibility" });
  RELATIONS.define("createdBy", { category: "workflow", label: "created by",
    inverse: "created", inverseLabel: "created", cardinality: "many-to-one",
    relevance: 0.50, meaning: "authorship" });
  RELATIONS.define("completedBy", { category: "workflow", label: "completed by",
    inverse: "completed", inverseLabel: "completed", cardinality: "many-to-one",
    relevance: 0.55, meaning: "who finished it" });

  RELATIONS.define("managedBy", { category: "ai", label: "managed by",
    inverse: "manages", inverseLabel: "manages",
    relevance: 0.75, meaning: "an agent owns this object's upkeep" });
  RELATIONS.define("assistedBy", { category: "ai", label: "assisted by",
    inverse: "assists", inverseLabel: "assists",
    relevance: 0.60, meaning: "an agent contributes" });
  RELATIONS.define("learnedFrom", { category: "ai", label: "learned from",
    inverse: "taught", inverseLabel: "taught",
    relevance: 0.50, meaning: "an agent drew signal from this" });
  RELATIONS.define("collaboratesWith", { category: "ai", label: "collaborates with",
    symmetric: true, relevance: 0.55, meaning: "peers working jointly" });

  function mintRelationId(type, from, to) {
    return "rel." + hash32(type + "|" + from + "|" + to).toString(36);
  }

  function capabilitiesOfType(typeName) {
    var t = TYPES.get(typeName);
    return t ? t.capabilities.slice() : [];
  }

/* ============================================================================
   LAYER 1 — IDENTITY
   ========================================================================= */

  /* keys that must never appear on an object record */
  var FORBIDDEN_KEYS = [
    "x", "y", "z", "position", "anchor", "coords", "pos", "region", "layout",
    "color", "colour", "opacity", "mesh", "material", "camera", "renderOrder",
    "selected", "hovered", "focused", "expanded", "loading", "visible",
    "history", "capabilities"
  ];

  var LIFECYCLE = ["draft", "active", "dormant", "archived"];

  function makeObject(spec) {
    if (!spec || !spec.id) throw new Error("HALO: object requires an id");
    for (var i = 0; i < FORBIDDEN_KEYS.length; i++) {
      if (Object.prototype.hasOwnProperty.call(spec, FORBIDDEN_KEYS[i])) {
        throw new Error("HALO: '" + FORBIDDEN_KEYS[i] + "' may not live on an object. " +
          "Coordinates belong to projection, appearance and view state to render, " +
          "capabilities to the type registry, history to the journal.");
      }
    }
    var typeName = spec.type || "object";
    var type = TYPES.get(typeName);
    if (!type) throw new Error("HALO: unknown type '" + typeName + "'");
    if (type.abstract) throw new Error("HALO: '" + typeName + "' is abstract and cannot be instantiated");

    var lifecycle = (spec.state && spec.state.lifecycle) || type.defaults.lifecycle || "active";

/* ============================================================================
   LAYER 3 — JOURNAL
   ========================================================================= */

  function HaloJournal(capacity) {

      this.bySubject.get(entry.subject).push(entry);

      var dropped = this.entries.shift();
      if (dropped.subject && this.bySubject.has(dropped.subject)) {
        var arr = this.bySubject.get(dropped.subject);
        var i = arr.indexOf(dropped);

        if (arr.length === 0) this.bySubject.delete(dropped.subject);

  };

/* ============================================================================
   LAYER 3.5 — QUERY
   Not a new intelligence layer. A ranking surface over indices that already
   exist: the relationship graph, the journal watermark, and contextFor().
   ========================================================================= */

  var FACET_KEYS = ["type", "rel", "near", "lifecycle", "trait", "cap", "changed", "category"];

  function HaloQuery(graph, journal, types) {
    this.graph = graph; this.journal = journal; this.types = types;
  }

  /* "ledger type:project near:core" -> { text, facets } */
  HaloQuery.prototype.parse = function (raw) {
    var facets = {}, words = [];
    String(raw || "").trim().split(/\s+/).forEach(function (tok) {
      if (!tok) return;
      var m = tok.match(/^([a-z]+):(.*)$/i);
      if (m && FACET_KEYS.indexOf(m[1].toLowerCase()) !== -1) {
        facets[m[1].toLowerCase()] = m[2];
      } else words.push(tok.toLowerCase());
    });
    return { text: words.join(" "), words: words, facets: facets };
  };

  /* ordered subsequence match — tolerates typos and abbreviations */
  function subsequence(needle, hay) {
    var i = 0;
    for (var j = 0; j < hay.length && i < needle.length; j++) {
      if (hay[j] === needle[i]) i++;
    }
    return i === needle.length;
  }

    if (!q.words.length) return 0.35;                 /* facet-only query */
    var label = node.label.toLowerCase();
    var id = node.id.toLowerCase();
    var tokens = label.split(/[^a-z0-9]+/).filter(Boolean);
    var best = 0;
    for (var w = 0; w < q.words.length; w++) {
      var word = q.words[w], score = 0;
      if (label === word) score = 1.0;
      else if (label.indexOf(word) === 0) score = 0.82;
      else if (tokens.some(function (t) { return t.indexOf(word) === 0; })) score = 0.68;
      else if (label.indexOf(word) !== -1) score = 0.52;
      else if (id.indexOf(word) !== -1) score = 0.42;
      else if (node.tags.some(function (t) { return t.toLowerCase().indexOf(word) !== -1; })) score = 0.46;
      else if (subsequence(word, label)) score = 0.28;

  };

  HaloQuery.prototype.passesFacets = function (node, q) {
    var f = q.facets, g = this.graph;

      if (wanted.indexOf(node.type) === -1) return false;
    }
    if (f.lifecycle && node.state.lifecycle !== f.lifecycle.toLowerCase()) return false;
    if (f.trait && g.traitsOf(node.id).indexOf(f.trait) === -1) return false;
    if (f.cap && !g.can(node.id, f.cap)) return false;
    if (f.rel) {
      var has = g.relationsOf(node.id).some(function (r) { return r.relation === f.rel; });
      if (!has) return false;
    }
    if (f.category) {
      var inCat = g.relationsOf(node.id).some(function (r) { return r.category === f.category; });
      if (!inCat) return false;
    }
    if (f.changed !== undefined) {

      if (node.lastEventSeq <= since) return false;
    }

  };

  /* anchor = where the user currently stands. Identical text ranks

  HaloQuery.prototype.search = function (raw, opts) {
    opts = opts || {};

    var limit = opts.limit || 8;
    var anchor = opts.anchor || null;

    var contextMap = new Map();
    var anchorContainer = anchor ? (g.parentOf(anchor) || anchor) : null;
    if (anchor && g.nodes.has(anchor)) {
      g.contextFor(anchor, { depth: 2, limit: 400, minScore: 0.01 })
        .forEach(function (c) { contextMap.set(c.id, c); });
    }
    if (q.facets.near && g.nodes.has(q.facets.near)) {
      g.contextFor(q.facets.near, { depth: 2, limit: 400, minScore: 0.01 })
        .forEach(function (c) {
          var prev = contextMap.get(c.id);
          if (!prev || prev.score < c.score) contextMap.set(c.id, c);
        });
    }

    var maxGravity = 0;
    g.nodes.forEach(function (n) {
      var gr = g.gravityOf(n.id);
      if (gr > maxGravity) maxGravity = gr;
    });
    var head = Math.max(1, this.journal.sequence);

    var results = [];
    g.nodes.forEach(function (n) {
      if (!self.passesFacets(n, q)) return;
      var lex = self.lexical(n, q);
      if (lex <= 0) return;
      if (q.facets.near && q.facets.near === n.id) return;

      var centrality = maxGravity > 0 ? g.gravityOf(n.id) / maxGravity : 0;
      var recency = Math.min(1, n.lastEventSeq / head);
      var ctx = contextMap.get(n.id);

        place: {

          via: ctx ? ctx.via : null,

    });

    return results.slice(0, limit);
  };

  /* --- the foundation the future contextual questions compile into --- */
  HaloQuery.prototype.related = function (id, limit) {

  };
  HaloQuery.prototype.dependencies = function (id) {

  };

      .filter(function (c) { return c.category === "knowledge"; })
      .slice(0, limit || 10);
  };

/* ============================================================================

        relevance: e.relevance, confidence: e.confidence, asserter: e.asserter,
        meta: e.meta, lastEventSeq: e.lastEventSeq, createdAt: e.createdAt

  function setLayout(id) {

  setCrumb();
  document.getElementById("s-layout").textContent = projection.engine.label;

  setTimeout(function () { document.getElementById("hint").classList.add("gone"); }, 13000);

  camera.position.set(0, 340, 1750);

  /* ---- loop ------------------------------------------------------------- */
  var reveal = 0, fpsAcc = 0, fpsFrames = 0, fpsT = 0;
  var driftPhase = Math.random() * 100;

    var dt = Math.min(clock.getDelta(), 0.05);
    var t = clock.getElapsedTime();

    var tier = TIERS[VIEW_NAME[mode]], rate = 1.6;
    budget.motion = damp(budget.motion, tier.motion, rate, dt);
    budget.fog = damp(budget.fog, tier.fog, rate, dt);
    budget.dust = damp(budget.dust, tier.dust, rate, dt);
    budget.drift = damp(budget.drift, tier.drift, rate, dt);
    budget.pulse = damp(budget.pulse, tier.pulse, rate, dt);
    budget.haze = damp(budget.haze, tier.haze, rate, dt);

    field.reapDying();

    reveal = Math.min(1, reveal + dt * 0.26);
    var ease = 1 - Math.pow(1 - reveal, 3);

        inv * inv * flight.p0.y + 2 * inv * e * flight.p1.y + e * e * flight.p2.y,
        inv * inv * flight.p0.z + 2 * inv * e * flight.p1.z + e * e * flight.p2.z

      else if (mode === VIEW.NODE && activeId) cam.desTarget.copy(projVec(activeId, _tmp));
      cam.theta = damp(cam.theta, cam.desTheta, 3.4, dt);
      cam.phi = damp(cam.phi, cam.desPhi, 3.4, dt);
      cam.target.lerp(cam.desTarget, Math.min(1, dt * 2.2));

      cam.radius = damp(cam.radius, cam.desRadius * (1 + breath), 2.0, dt);

      camera.lookAt(cam.target);

    for (var en = 0; en < envelopes.length; en++) {
      var ep = projection.positionOf(envelopes[en].id);
      if (ep) envelopes[en].mesh.position.set(ep.x, ep.y, ep.z);
      envelopes[en].mesh.rotation.y += dt * envelopes[en].drift * M;
      var envWant = mode === VIEW.UNIVERSE ? 0.055 : (envelopes[en].id === activeRegion ? 0.1 : 0.02);
      envelopes[en].mesh.material.opacity = damp(envelopes[en].mesh.material.opacity, envWant * ease, 2, dt);
    }
    for (var ms = 0; ms < mists.length; ms++) {
      var mp2 = projection.positionOf(mists[ms].id);
      if (mp2) mists[ms].sprite.position.set(mp2.x, mp2.y, mp2.z);

    for (var hr = 0; hr < hubRings.length; hr++) {

    }
    haze.material.opacity = damp(haze.material.opacity, 0.075 * budget.haze * ease, 2, dt);
    for (var ds = 0; ds < dustShells.length; ds++) {
      var sh = dustShells[ds];
      sh.points.rotation.y += dt * 0.006 * sh.rate * M;
      sh.points.position.y = Math.sin(t * 0.07 * sh.rate + ds) * 6 * budget.drift;
      sh.points.material.opacity = damp(sh.points.material.opacity,
        sh.baseOpacity * budget.dust * ease, 2, dt);
    }
    stars1.rotation.y += dt * 0.0011 * M;
    stars2.rotation.y += dt * 0.0007 * M;

    var recs = field.liveRecords();

    var fi = 0;
    for (var ag = 0; ag < recs.length && fi < AI_SEED.length; ag++) {
      if (recs[ag].node.type !== "agent") continue;
      filPos.array[fi * 6] = hp ? hp.x : 0;
      filPos.array[fi * 6 + 1] = hp ? hp.y : 0;
      filPos.array[fi * 6 + 2] = hp ? hp.z : 0;
      filPos.array[fi * 6 + 3] = recs[ag].pos.x;
      filPos.array[fi * 6 + 4] = recs[ag].pos.y;
      filPos.array[fi * 6 + 5] = recs[ag].pos.z;
      fi++;
    }
    filPos.needsUpdate = true;

    var focusArr = field.attr.focus.array;
    for (var f = 0; f < recs.length; f++) {
      var rr = recs[f], want, par2 = graph.parentOf(rr.id);
      if (mode === VIEW.UNIVERSE) want = 1;
      else if (mode === VIEW.REGION) {
        want = (par2 === activeRegion || rr.node.type === "hub" || rr.node.type === "agent") ? 1 : 0.2;
      } else {
        want = rr.id === activeId ? 0.3 : (par2 === activeRegion ? 0.55 : 0.14);
      }
      var hl = viewState.highlight[rr.id];
      if (hl) want = Math.max(want, 0.45 + hl * 0.55);
      focusArr[rr.slot] = damp(focusArr[rr.slot], want, 2.6, dt);
    }
    field.attr.focus.needsUpdate = true;

    var eList = field.edgeList;
    var ePos = field.edgeGeometry.attributes.position.array;
    var eCol = field.edgeGeometry.attributes.color.array;
    for (var L = 0; L < eList.length; L++) {
      var ra = field.slots[eList[L].a], rb = field.slots[eList[L].b];
      if (!ra || !rb) continue;
      ePos[L * 6] = ra.pos.x; ePos[L * 6 + 1] = ra.pos.y; ePos[L * 6 + 2] = ra.pos.z;
      ePos[L * 6 + 3] = rb.pos.x; ePos[L * 6 + 4] = rb.pos.y; ePos[L * 6 + 5] = rb.pos.z;
      var wantL;
      if (mode === VIEW.UNIVERSE) wantL = 1;
      else {
        var pa2 = graph.parentOf(ra.id), pb2 = graph.parentOf(rb.id);
        wantL = (pa2 === activeRegion || pb2 === activeRegion ||

    field.edgeGeometry.attributes.color.needsUpdate = true;

    if (eList.length > 0) {
      for (var p = 0; p < PACKETS; p++) {
        var st = pkState[p];
        st.t += dt * st.v * M;
        if (st.t > 1 || st.i >= eList.length) { st.t = 0; st.i = (Math.random() * eList.length) | 0; }

    query: query,
    search: function (text, opts) {
      return query.search(text, opts || { anchor: activeId || activeRegion, limit: 8 });
    },
    related: function (id, n) { return query.related(id, n); },
    dependencies: function (id) { return query.dependencies(id); },
    dependents: function (id) { return query.dependents(id); },
    changed: function (since, n) { return query.changed(since, n); },
    connectedKnowledge: function (id, n) { return query.connectedKnowledge(id, n); },
    find: function () { openFinder(); return "finder open"; },
    teleport: function (id) { return teleportTo(id); },
    back: function () { return navigateBack(); },
    trail: function () {
      return { stack: navStack.map(function (l) { return l.label; }),
        beacon: beaconState.active ? beaconState.label : null };
    },

    verifySearchRanking: function () {
      var neutral = query.search("ledger", { anchor: null, limit: 5 });
      var fromOrion = query.search("ledger", { anchor: "orion.workcore", limit: 5 });
      var fromArchive = query.search("ledger", { anchor: "archive.journals", limit: 5 });
      var typed = query.search("type:agent", { anchor: null, limit: 8 });
      var faceted = query.search("ledger type:project", { anchor: null, limit: 5 });
      var fuzzy = query.search("wrkcre", { anchor: null, limit: 3 });
      return {
        neutralTop: neutral[0] && neutral[0].id,
        fromOrionTop: fromOrion[0] && fromOrion[0].id,
        fromArchiveTop: fromArchive[0] && fromArchive[0].id,
        anchorChangesRanking: JSON.stringify(fromOrion.map(function (r) { return r.id; })) !==
                              JSON.stringify(fromArchive.map(function (r) { return r.id; })),
        typeFacetOnlyAgents: typed.every(function (r) { return r.type === "agent"; }),
        facetNarrows: faceted.every(function (r) { return r.type === "project"; }),
        fuzzyFound: fuzzy[0] && fuzzy[0].id,
        scoreBreakdown: neutral[0] && neutral[0].why,
        pass: !!neutral.length && typed.every(function (r) { return r.type === "agent"; })
      };
    },

    verifyTeleport: function () {
      var startMode = VIEW_NAME[mode], startId = activeId;
      var depth0 = navStack.length;
      teleportTo("vesper.proofs");
      var afterOut = { stack: navStack.length, beacon: beaconState.active,
        flying: flight.active, arrivalReveal: arrivalReveal > 0 };
      navigateBack();
      return {
        startedAt: startMode + (startId ? " / " + startId : ""),
        pushedHistory: afterOut.stack === depth0 + 1,
        droppedBeacon: afterOut.beacon,
        travelledNotCut: afterOut.flying,
        revealedContextOnArrival: afterOut.arrivalReveal,
        returnedTo: VIEW_NAME[mode],
        stackDepthAfterReturn: navStack.length,
        pass: afterOut.stack === depth0 + 1 && afterOut.beacon && afterOut.flying
      };
    },

    /* ---- persistence ---- */
    stores: function () { return { available: storage.report(), active: store.name }; },
    useStore: function (name) {
      var s2 = storage.get(name);
      if (!s2) return { ok: false };
      store = s2;
      return { ok: true, active: store.name, durable: store.durable };
    },
    save: function (target) { return saveUniverse(target); },
    load: function (target) { return loadUniverse(target); },
    snapshot: function () { return codec.encode(graph, journal); },

    verifySnapshotPurity: function () {
      var payload = codec.encode(graph, journal);
      var json = JSON.stringify(payload);
      var hits = [];
      SNAPSHOT_FORBIDDEN.forEach(function (k) {
        if (new RegExp('"' + k + '"\\s*:').test(json)) hits.push(k);
      });
      var objKeys = {};
      payload.objects.forEach(function (o) { Object.keys(o).forEach(function (k) { objKeys[k] = 1; }); });
      var relKeys = {};
      payload.relations.forEach(function (r) { Object.keys(r).forEach(function (k) { relKeys[k] = 1; }); });
      return {
        bytes: json.length,
        objects: payload.objects.length, relations: payload.relations.length,
        events: payload.events.length,
        objectKeys: Object.keys(objKeys).sort(),
        relationKeys: Object.keys(relKeys).sort(),
        forbiddenKeysPresent: hits,
        historyFieldOnObjects: payload.objects.filter(function (o) {
          return Object.prototype.hasOwnProperty.call(o, "history"); }).length,
        coordinatesPersisted: 0,
        pass: hits.length === 0
      };
    },

    verifyRoundTripPersistence: function () {
      var beforeObjects = graph.nodes.size, beforeRelations = graph.edges.size;
      var beforeCaps = graph.capabilitiesOf("orion.workcore").length;
      var beforeRel = graph.relationsOf("orion.workcore").length;
      var beforeGravity = +graph.gravityOf("orion.workcore").toFixed(3);
      var beforePos = projection.snapshot("orion.workcore");

      var payload = JSON.parse(JSON.stringify(codec.encode(graph, journal)));
      var res = codec.decode(payload, graph, journal, TYPES);
      projection.recompute();
      projection.update(projection.time, 0);
      var afterPos = projection.snapshot("orion.workcore");

      return {
        loaded: res.loaded, migrations: res.migrations,
        objects: [beforeObjects, graph.nodes.size],
        relations: [beforeRelations, graph.edges.size],
        relationsDropped: res.relationsDropped,
        capabilitiesStillResolve: [beforeCaps, graph.capabilitiesOf("orion.workcore").length],
        relationsReconnected: [beforeRel, graph.relationsOf("orion.workcore").length],
        gravityPreserved: [beforeGravity, +graph.gravityOf("orion.workcore").toFixed(3)],
        positionRederivedIdentically:
          Math.abs(beforePos.x - afterPos.x) < 0.001 && Math.abs(beforePos.z - afterPos.z) < 0.001,
        pass: res.loaded && beforeObjects === graph.nodes.size &&
              beforeRelations === graph.edges.size && res.relationsDropped === 0
      };
    },

    verifySnapshotIntegrity: function () {
      var good = codec.encode(graph, journal);
      var dupe = JSON.parse(JSON.stringify(good));
      dupe.objects.push(JSON.parse(JSON.stringify(dupe.objects[0])));
      var badType = JSON.parse(JSON.stringify(good));
      badType.objects[1].type = "nonsense";
      var orphan = JSON.parse(JSON.stringify(good));
      orphan.relations.push({ id: "rel.ghost", type: "links", from: "ghost.a", to: "ghost.b",
        relevance: 0.5, confidence: 1 });
      var polluted = JSON.parse(JSON.stringify(good));
      polluted.objects[2].x = 12;
      return {
        cleanAccepted: codec.validate(good, TYPES).valid,
        duplicateRejected: !codec.validate(dupe, TYPES).valid,
        unknownTypeRejected: !codec.validate(badType, TYPES).valid,
        orphanDetected: codec.validate(orphan, TYPES).orphanRelations.length > 0,
        coordinatePollutionRejected: !codec.validate(polluted, TYPES).valid,
        pass: codec.validate(good, TYPES).valid && !codec.validate(dupe, TYPES).valid &&
              !codec.validate(badType, TYPES).valid && !codec.validate(polluted, TYPES).valid
      };
    }
  };
})();
</script>
