<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d0f0d">
<title>Ted's Lawn Care</title>
<link rel="manifest" href="data:application/manifest+json,{%22name%22:%22Ted's%20Lawn%20Care%22,%22short_name%22:%22Ted's%22,%22display%22:%22standalone%22,%22background_color%22:%22%230d0f0d%22,%22theme_color%22:%22%230d0f0d%22,%22start_url%22:%22.%22}">
<style>
  :root{
    --bg:#0d0f0d; --surface:#161a16; --surface2:#1f251f; --line:#2c342c;
    --green:#2E7D32; --green-bright:#4CAF50; --gold:#D9A441;
    --text:#FFFFFF; --dim:#9fb09f; --off:#E0E0E0;
    --blue:#2196F3; --orange:#FF9800; --red:#e5533c;
    --tap:52px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding-bottom:env(safe-area-inset-bottom);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{margin:0; font-weight:800; letter-spacing:-.02em}
  button{font-family:inherit; cursor:pointer; border:none; color:inherit; background:none}
  .hidden{display:none !important}

  /* Header */
  header{
    position:sticky; top:0; z-index:20; background:var(--bg);
    padding:calc(env(safe-area-inset-top) + 10px) 14px 8px; border-bottom:1px solid var(--line);
  }
  .hrow{display:flex; align-items:center; gap:10px}
  .brand{display:flex; align-items:baseline; gap:8px; flex:1; min-width:0}
  .brand h1{font-size:19px}
  .brand .tag{color:var(--green-bright); font-size:12px; font-weight:700; white-space:nowrap}
  .weather{
    display:flex; align-items:center; gap:6px; background:var(--surface);
    border:1px solid var(--line); border-radius:20px; padding:5px 10px; font-size:13px; font-weight:700;
  }
  .weather small{color:var(--dim); font-weight:600}
  .iconbtn{
    width:var(--tap); height:var(--tap); min-width:var(--tap); border-radius:14px;
    background:var(--surface); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:20px;
  }
  .week{color:var(--dim); font-size:12px; font-weight:600; margin-top:6px}

  /* Day tabs */
  .days{display:flex; gap:6px; margin-top:10px; overflow-x:auto; scrollbar-width:none}
  .days::-webkit-scrollbar{display:none}
  .day{
    flex:1; min-width:62px; background:var(--surface); border:1px solid var(--line);
    border-radius:12px; padding:8px 4px; text-align:center;
  }
  .day.active{background:var(--green); border-color:var(--green-bright)}
  .day .dn{font-size:13px; font-weight:800}
  .day .dc{font-size:11px; color:var(--dim); font-weight:700; margin-top:2px}
  .day.active .dc{color:#dff5df}
  .day.done .dc{color:var(--green-bright)}

  /* Summary */
  .summary{padding:12px 14px 4px}
  .bar{height:12px; background:var(--surface2); border-radius:8px; overflow:hidden; border:1px solid var(--line)}
  .bar > i{display:block; height:100%; background:linear-gradient(90deg,var(--green),var(--green-bright)); width:0; transition:width .35s ease}
  .sline{display:flex; justify-content:space-between; align-items:center; margin-top:8px; font-size:13px}
  .sline b{font-size:15px}
  .eta{color:var(--gold); font-weight:800}
  .eta small{color:var(--dim); font-weight:600}

  /* Controls */
  .controls{display:flex; gap:8px; padding:10px 14px 4px}
  .search{
    flex:1; display:flex; align-items:center; gap:8px; background:var(--surface);
    border:1px solid var(--line); border-radius:14px; padding:0 12px; height:var(--tap);
  }
  .search input{flex:1; background:none; border:none; color:var(--text); font-size:15px; outline:none; height:100%}
  .search input::placeholder{color:var(--dim)}
  .cbtn{
    height:var(--tap); padding:0 14px; border-radius:14px; font-weight:800; font-size:14px;
    background:var(--surface2); border:1px solid var(--line); display:flex; align-items:center; gap:6px; white-space:nowrap;
  }
  .cbtn.warn{background:#3a2a12; border-color:#5a411c; color:var(--gold)}

  /* Job list */
  .list{padding:8px 14px 90px}
  .card{
    position:relative; background:var(--surface); border:1px solid var(--line);
    border-radius:16px; margin-bottom:10px; overflow:hidden;
    border-left:6px solid var(--crew,#4CAF50);
  }
  .card.done{opacity:.62}
  .card.done .addr{text-decoration:line-through; text-decoration-color:var(--dim)}
  .ctop{display:flex; align-items:flex-start; gap:10px; padding:12px 12px 10px}
  .ord{
    min-width:30px; height:30px; border-radius:9px; background:var(--surface2); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px; color:var(--dim); margin-top:2px;
  }
  .card.done .ord{background:var(--green); color:#fff; border-color:var(--green-bright)}
  .cmain{flex:1; min-width:0}
  .addr{font-size:17px; font-weight:800; line-height:1.2}
  .meta{margin-top:4px; display:flex; flex-wrap:wrap; gap:6px; align-items:center}
  .pill{font-size:11px; font-weight:800; padding:3px 8px; border-radius:20px; background:var(--surface2); color:var(--dim); border:1px solid var(--line)}
  .pill.note{background:#3a2f12; color:var(--gold); border-color:#5a481c}
  .pill.time{background:#12331a; color:var(--green-bright); border-color:#1f5a2e}
  .notetext{padding:0 12px 10px; color:var(--off); font-size:13.5px; line-height:1.45}
  .cbtns{display:flex; gap:8px; padding:0 12px 12px}
  .act{
    flex:1; height:var(--tap); border-radius:13px; font-weight:800; font-size:15px;
    display:flex; align-items:center; justify-content:center; gap:7px;
  }
  .nav{background:var(--surface2); border:1px solid var(--line); color:var(--off)}
  .done-btn{background:var(--green); color:#fff}
  .done-btn.is-done{background:var(--surface2); color:var(--green-bright); border:1px solid var(--green)}
  .menu{width:var(--tap); min-width:var(--tap); background:var(--surface2); border:1px solid var(--line); border-radius:13px; font-size:20px; color:var(--dim)}

  .empty{text-align:center; color:var(--dim); padding:50px 20px; font-size:15px; line-height:1.5}

  /* Modals / sheets */
  .scrim{position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:40; display:flex; align-items:flex-end; justify-content:center}
  .scrim.center{align-items:center}
  .sheet{
    width:100%; max-width:560px; background:var(--surface); border:1px solid var(--line);
    border-radius:22px 22px 0 0; padding:18px 16px calc(18px + env(safe-area-inset-bottom));
    max-height:88vh; overflow:auto;
  }
  .scrim.center .sheet{border-radius:22px; margin:16px; max-height:86vh}
  .sheet h2{font-size:18px; margin-bottom:4px}
  .sheet p.sub{color:var(--dim); font-size:13.5px; margin:0 0 14px; line-height:1.5}
  .opt{
    width:100%; text-align:left; background:var(--surface2); border:1px solid var(--line);
    border-radius:14px; padding:14px; margin-bottom:8px; font-size:16px; font-weight:700;
    display:flex; align-items:center; gap:12px;
  }
  .opt .ic{font-size:20px}
  .field{margin-bottom:12px}
  .field label{display:block; font-size:12px; font-weight:800; color:var(--dim); margin-bottom:6px; text-transform:uppercase; letter-spacing:.05em}
  .field input, .field textarea{
    width:100%; background:var(--surface2); border:1px solid var(--line); border-radius:12px;
    padding:12px; color:var(--text); font-size:15px; outline:none; font-family:inherit;
  }
  .field textarea{min-height:120px; resize:vertical; font-size:13px}
  .row2{display:flex; gap:10px}
  .row2 > *{flex:1}
  .primary{width:100%; height:var(--tap); background:var(--green); color:#fff; border-radius:14px; font-weight:800; font-size:16px; margin-top:6px}
  .ghost{width:100%; height:48px; background:none; border:1px solid var(--line); color:var(--dim); border-radius:14px; font-weight:700; margin-top:8px}
  .danger{color:var(--red); border-color:#5a2a22}
  .seg{display:flex; background:var(--surface2); border:1px solid var(--line); border-radius:12px; overflow:hidden}
  .seg button{flex:1; padding:12px; font-weight:800; color:var(--dim)}
  .seg button.on{background:var(--green); color:#fff}

  /* Toast */
  .toast{
    position:fixed; left:50%; transform:translateX(-50%); bottom:calc(20px + env(safe-area-inset-bottom));
    background:var(--surface2); border:1px solid var(--line); border-radius:14px; padding:12px 16px;
    display:flex; align-items:center; gap:14px; z-index:60; box-shadow:0 8px 30px rgba(0,0,0,.5); max-width:92%;
  }
  .toast b{font-size:14px}
  .toast button{color:var(--gold); font-weight:800; font-size:14px}

  /* Status line */
  .status{position:fixed; bottom:0; left:0; right:0; z-index:15; padding:6px 14px calc(6px + env(safe-area-inset-bottom));
    background:linear-gradient(transparent,var(--bg) 40%); text-align:center; font-size:11px; color:var(--dim); font-weight:600; pointer-events:none}
  .dot{display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--dim); margin-right:5px; vertical-align:middle}
  .dot.on{background:var(--green-bright)}
  .dot.off{background:var(--red)}
  .spin{display:inline-block; width:13px; height:13px; border:2px solid var(--line); border-top-color:var(--green-bright); border-radius:50%; animation:sp .7s linear infinite; vertical-align:-2px; margin-right:6px}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important}}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <div class="brand">
      <h1>Ted's Lawn Care</h1>
      <span class="tag">South End</span>
    </div>

</div>

<div class="controls">
  <div class="search">

function haversine(a,b){ const R=6371,dLat=(b.lat-a.lat)*Math.PI/180,dLng=(b.lng-a.lng)*Math.PI/180,
  la1=a.lat*Math.PI/180,la2=b.lat*Math.PI/180;
  const h=Math.sin(dLat/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h)); }

/* ============================================================
   Firebase
   ============================================================ */
function getConfig(){ try{ return JSON.parse(localStorage.getItem("fb_config")||"null"); }catch(e){ return null; } }

function initFirebase(){
  const cfg = getConfig();
  if(!cfg){ showConfigModal(true); return; }
  try{
    if(!firebase.apps.length) firebase.initializeApp(cfg);
    db = firebase.firestore();
    db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
    docRef = db.collection("ted_routes").doc("week_current");
    connect();
  }catch(e){
    setSync(false,"Config error — check settings");
    console.error(e);
  }
}

function connect(){
  if(unsub) unsub();
  setSync(false,"Connecting…");
  unsub = docRef.onSnapshot({includeMetadataChanges:true},snap=>{
    online = !snap.metadata.fromCache;
    if(snap.exists){
      const d = snap.data();
      state.jobs = d.jobs || {};
      state.meta = Object.assign(state.meta, d.meta||{});
      // auto-roll to a fresh week
      if(state.meta.weekOf !== mondayOf(new Date())){ startNewWeek(true); return; }
    }else{
      docRef.set({jobs:{},meta:state.meta}).catch(()=>{});
    }
    setSync(online, online?"Synced":"Offline — will sync when back online");
    render();
  },err=>{ setSync(false,"Sync error — check settings"); console.error(err); });
}

function saveJob(id,patch){
  state.jobs[id] = Object.assign({}, state.jobs[id], patch);
  render();
  if(docRef) docRef.set({jobs:{[id]:patch}},{merge:true}).catch(e=>console.error(e));
}
function saveMeta(patch){
  state.meta = Object.assign({}, state.meta, patch);
  if(docRef) docRef.set({meta:patch},{merge:true}).catch(e=>console.error(e));
}
function setSync(ok,text){
  const dot=document.getElementById("syncDot");
  dot.className = "dot "+(ok?"on":"off");
  document.getElementById("syncText").textContent = text;
}

/* ============================================================
   Rendering
   ============================================================ */
function render(){
  document.getElementById("weekLabel").textContent = fmtWeek(state.meta.weekOf);
  renderDays();
  renderSummary();
  renderList();
}

function renderDays(){
  const el=document.getElementById("days"); el.innerHTML="";
  DAYS.forEach(day=>{
    const items=propsForDay(day);
    const done=items.filter(p=>jobOf(p.id).status==="done").length;
    const b=document.createElement("button");
    b.className="day"+(day===selectedDay?" active":"")+(items.length&&done===items.length?" done":"");
    b.innerHTML=`<div class="dn">${day}</div><div class="dc">${done}/${items.length}</div>`;
    b.onclick=()=>{ selectedDay=day; render(); };
    el.appendChild(b);
  });
}

function renderSummary(){
  const items=propsForDay(selectedDay);
  const done=items.filter(p=>jobOf(p.id).status==="done").length;
  const total=items.length, remaining=total-done;
  document.getElementById("doneCount").textContent=done;
  document.getElementById("totalCount").textContent=total;
  document.getElementById("barFill").style.width=(total?done/total*100:0)+"%";
  // ETA
  const [h,m]=state.meta.startTime.split(":").map(Number);
  const finish=new Date(); finish.setHours(h,m,0,0);
  finish.setMinutes(finish.getMinutes()+remaining*state.meta.avgMinutes);
  const etaEl=document.getElementById("eta");
  if(remaining===0 && total>0){ etaEl.innerHTML="✓ Day complete"; }
  else{ etaEl.innerHTML=`<small>finish ~</small> ${finish.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})}`; }
}

function renderList(){
  const list=document.getElementById("list"); list.innerHTML="";
  const q=(document.getElementById("search").value||"").toLowerCase().trim();
  let items=propsForDay(selectedDay);
  if(q) items=SEED.filter(p=>p.a.toLowerCase().includes(q)); // search spans all days
  if(!items.length){
    list.innerHTML=`<div class="empty">${q?"No address matches “"+q+"”.":"No jobs on "+DAYFULL[selectedDay]+"."}</div>`;
    return;
  }
  items.forEach((p,idx)=>{
    const j=jobOf(p.id), isDone=j.status==="done";
    const card=document.createElement("div");
    card.className="card"+(isDone?" done":"");
    card.style.setProperty("--crew",CREW_COLOR[p.crew]||"#4CAF50");
    const dayTag = (q||effDay(p)!==selectedDay) ? `<span class="pill">${DAYFULL[effDay(p)]}</span>` : "";
    const timeTag = isDone&&j.completedAt ? `<span class="pill time">✓ ${new Date(j.completedAt).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})}</span>` : "";
    const noteTag = p.n ? `<span class="pill note" data-note="${p.id}">⚠ Note</span>` : "";
    card.innerHTML=`
      <div class="ctop">
        <div class="ord">${q?"":idx+1}</div>
        <div class="cmain">
          <div class="addr">${p.a}</div>
          <div class="meta">${dayTag}${noteTag}${timeTag}</div>
        </div>
      </div>
      ${p.n?`<div class="notetext hidden" id="note-${p.id}">${p.n}</div>`:""}
      <div class="cbtns">
        <button class="act nav" data-nav="${p.id}">📍 Navigate</button>
        <button class="act done-btn ${isDone?'is-done':''}" data-done="${p.id}">${isDone?"↩ Undo":"✓ Done"}</button>
        <button class="act menu" data-menu="${p.id}">⋮</button>
      </div>`;
    list.appendChild(card);
  });
  // wire
  list.querySelectorAll("[data-note]").forEach(b=>b.onclick=()=>document.getElementById("note-"+b.dataset.note).classList.toggle("hidden"));
  list.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>openNav(b.dataset.nav));
  list.querySelectorAll("[data-done]").forEach(b=>b.onclick=()=>toggleDone(b.dataset.done));
  list.querySelectorAll("[data-menu]").forEach(b=>b.onclick=()=>openMenu(b.dataset.menu));
}

/* ============================================================
   Actions
   ============================================================ */
function toggleDone(id){
  const isDone=jobOf(id).status==="done";
  if(isDone){ saveJob(id,{status:"",completedAt:null}); return; }
  saveJob(id,{status:"done",completedAt:Date.now()});
  const p=SEED.find(x=>x.id===id);
  showToast(`${p.a} done`, "Undo", ()=>saveJob(id,{status:"",completedAt:null}));
}

function openNav(id){
  const p=SEED.find(x=>x.id===id);
  const q=encodeURIComponent(p.geo);
  sheet(`<h2>Navigate</h2><p class="sub">${p.a}</p>
    <button class="opt" onclick="window.open('https://www.google.com/maps/dir/?api=1&destination=${q}','_blank');closeSheet()"><span class="ic">🗺️</span> Open in Google Maps</button>
    <button class="opt" onclick="window.open('https://maps.apple.com/?daddr=${q}','_blank');closeSheet()"><span class="ic">🍎</span> Open in Apple Maps</button>
    <button class="ghost" onclick="closeSheet()">Cancel</button>`);
}

function openMenu(id){
  const p=SEED.find(x=>x.id===id);
  const cur=effDay(p);
  const dayBtns=DAYS.filter(d=>d!==cur).map(d=>`<button class="opt" onclick="moveJob('${id}','${d}')"><span class="ic">📅</span> Move to ${DAYFULL[d]}</button>`).join("");
  sheet(`<h2>${p.a}</h2><p class="sub">Currently on ${DAYFULL[cur]}</p>
    <button class="opt" onclick="reorder('${id}',-1)"><span class="ic">⬆️</span> Move up in route</button>
    <button class="opt" onclick="reorder('${id}',1)"><span class="ic">⬇️</span> Move down in route</button>
    ${dayBtns}
    <button class="ghost" onclick="closeSheet()">Cancel</button>`);
}

function moveJob(id,day){ saveJob(id,{day}); closeSheet(); }

function reorder(id,dir){
  const p=SEED.find(x=>x.id===id);
  const list=propsForDay(effDay(p));
  const i=list.findIndex(x=>x.id===id);
  const j=i+dir;
  if(j<0||j>=list.length){ closeSheet(); return; }
  // normalize orders then swap
  list.forEach((x,k)=>{ if(jobOf(x.id).order===undefined) state.jobs[x.id]=Object.assign({},state.jobs[x.id],{order:k}); });
  const a=list[i], b=list[j];
  const oa=jobOf(a.id).order, ob=jobOf(b.id).order;
  saveJob(a.id,{order:ob}); saveJob(b.id,{order:oa});
  closeSheet();
}

function rainDelay(){
  const items=propsForDay(selectedDay).filter(p=>jobOf(p.id).status!=="done");
  if(!items.length){ showToast("Nothing to move — all done ✓"); return; }
  const to=nextBusinessDay(selectedDay);
  confirmModal(`Move ${items.length} unfinished job${items.length>1?"s":""} from ${DAYFULL[selectedDay]} to ${DAYFULL[to]}?`,
    "Move jobs", ()=>{ items.forEach(p=>saveJob(p.id,{day:to})); showToast(`Moved to ${DAYFULL[to]}`); });
}

/* ---------- Optimize (free, on-device) ---------- */
async function optimize(){
  const items=propsForDay(selectedDay);
  const missing=items.filter(p=>!coordFor(p));
  const btn=document.getElementById("optimizeBtn");
  btn.disabled=true;
  if(missing.length){
    for(let k=0;k<missing.length;k++){
      btn.innerHTML=`<span class="spin"></span> ${k+1}/${missing.length}`;
      await geocode(missing[k]);
    }
    localStorage.setItem("geoCache",JSON.stringify(geoCache));
  }
  // nearest-neighbour from depot
  const withCoords=items.filter(coordFor), noCoords=items.filter(p=>!coordFor(p));
  let cur=DEPOT, remaining=[...withCoords], ordered=[];
  while(remaining.length){
    remaining.sort((a,b)=>haversine(cur,coordFor(a))-haversine(cur,coordFor(b)));
    const next=remaining.shift(); ordered.push(next); cur=coordFor(next);
  }
  ordered=ordered.concat(noCoords); // un-geocodable go last, still tappable
  ordered.forEach((p,i)=>saveJob(p.id,{order:i}));
  btn.disabled=false; btn.innerHTML="🧭 Optimize";
  showToast(noCoords.length?`Optimized (${noCoords.length} couldn't map — drag them)`:"Route optimized ✓");
}
function coordFor(p){
  if(p.lat&&p.lng) return {lat:p.lat,lng:p.lng};
  const c=geoCache[p.geo]; return c?{lat:c[0],lng:c[1]}:null;
}
async function geocode(p){
  if(geoCache[p.geo]) return;
  try{
    const r=await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&q="+encodeURIComponent(p.geo),
      {headers:{"Accept":"application/json"}});
    const d=await r.json();
    if(d&&d[0]) geoCache[p.geo]=[+d[0].lat,+d[0].lon];
  }catch(e){ console.warn("geocode failed",p.a); }
  await new Promise(res=>setTimeout(res,1100)); // respect Nominatim 1 req/sec
}

/* ---------- Weekly reset ---------- */
function startNewWeek(silent){
  const fresh={}; // clears status, day overrides, manual order
  state.jobs=fresh;
  state.meta.weekOf=mondayOf(new Date());
  if(docRef) docRef.set({jobs:{},meta:{weekOf:state.meta.weekOf}},{merge:true}).catch(()=>{});
  // hard clear the jobs map on server (merge won't remove keys)
  if(docRef) docRef.update({jobs:{}}).catch(()=>{});
  if(!silent){ closeSheet(); showToast("New week started — all jobs reset"); }
  render();
}

/* ============================================================
   Weather (Open-Meteo, free, no key)
   ============================================================ */
async function loadWeather(){
  try{
    const u=`https://api.open-meteo.com/v1/forecast?latitude=${BARRIE.lat}&longitude=${BARRIE.lng}&current=temperature_2m,weather_code&daily=precipitation_probability_max&timezone=auto&temperature_unit=${state.meta.tempUnit==="F"?"fahrenheit":"celsius"}`;
    const r=await fetch(u); const d=await r.json();
    const t=Math.round(d.current.temperature_2m);
    const rain=d.daily.precipitation_probability_max?.[0];
    const ic=wxIcon(d.current.weather_code);
    document.getElementById("weather").innerHTML=`${ic} ${t}°${state.meta.tempUnit} <small>· ${rain??"–"}%🌧</small>`;
  }catch(e){ document.getElementById("weather").innerHTML="<small>no weather</small>"; }
}
function wxIcon(c){ if(c==null)return "🌡️"; if(c===0)return "☀️"; if(c<=3)return "⛅"; if(c<=48)return "🌫️"; if(c<=67)return "🌧️"; if(c<=77)return "🌨️"; if(c<=82)return "🌦️"; if(c<=99)return "⛈️"; return "☁️"; }

/* ============================================================
   Modals / sheets / toast
   ============================================================ */
function sheet(html,center){
  closeSheet();
  const s=document.createElement("div"); s.className="scrim"+(center?" center":""); s.id="activeSheet";
  s.innerHTML=`<div class="sheet">${html}</div>`;
  s.onclick=e=>{ if(e.target===s) closeSheet(); };
  document.body.appendChild(s);
}
function closeSheet(){ const s=document.getElementById("activeSheet"); if(s) s.remove(); }
function confirmModal(msg,okLabel,onOk){
  sheet(`<h2>Confirm</h2><p class="sub">${msg}</p>
    <button class="primary" id="cfmOk">${okLabel}</button>
    <button class="ghost" onclick="closeSheet()">Cancel</button>`,true);
  document.getElementById("cfmOk").onclick=()=>{ closeSheet(); onOk(); };
}
let toastTimer=null;
function showToast(text,actionLabel,onAction){
  const old=document.getElementById("toast"); if(old) old.remove();
  clearTimeout(toastTimer);
  const t=document.createElement("div"); t.className="toast"; t.id="toast";
  t.innerHTML=`<b>${text}</b>`+(actionLabel?`<button id="toastAct">${actionLabel}</button>`:"");
  document.body.appendChild(t);
  if(actionLabel) document.getElementById("toastAct").onclick=()=>{ onAction&&onAction(); t.remove(); };
  toastTimer=setTimeout(()=>t.remove(),4200);
}

/* ---------- Settings ---------- */
function openSettings(){
  const m=state.meta;
  sheet(`<h2>Settings</h2><p class="sub">Crew defaults and app setup.</p>
    <div class="row2">
      <div class="field"><label>Start time</label><input id="setStart" type="time" value="${m.startTime}"></div>
      <div class="field"><label>Minutes / lawn</label><input id="setAvg" type="number" min="1" value="${m.avgMinutes}"></div>
    </div>
    <div class="field"><label>Temperature</label>
      <div class="seg"><button class="${m.tempUnit==='C'?'on':''}" onclick="setTemp('C')">°C</button><button class="${m.tempUnit==='F'?'on':''}" onclick="setTemp('F')">°F</button></div>
    </div>
    <button class="primary" onclick="saveSettings()">Save</button>
    <button class="ghost" onclick="showConfigModal(false)">Firebase connection</button>
    <button class="ghost danger" onclick="confirmReset()">Start new week (reset all)</button>
    <p class="sub" style="margin-top:14px;text-align:center">Ted's Lawn Care Manager · v1.0</p>`);
}
function setTemp(u){ saveMeta({tempUnit:u}); loadWeather(); openSettings(); }
function saveSettings(){
  saveMeta({startTime:document.getElementById("setStart").value, avgMinutes:+document.getElementById("setAvg").value||15});
  closeSheet(); render(); showToast("Settings saved");
}
function confirmReset(){
  confirmModal("Start a new week? This clears every job's Done status, undoes any rain-delay moves, and restores the normal day for each property. This can't be undone.",
    "Start new week", ()=>startNewWeek(false));
}

/* ---------- Firebase config modal ---------- */
function showConfigModal(firstRun){
  const cur=getConfig();
  sheet(`<h2>${firstRun?"Connect to Firebase":"Firebase connection"}</h2>
    <p class="sub">Paste your Firebase web config here (from Firebase console → Project settings → your web app). This links every crew phone to the same live route.</p>
    <div class="field"><label>Firebase config</label>
      <textarea id="cfgBox" placeholder='{ "apiKey": "…", "authDomain": "…", "projectId": "…", … }'>${cur?JSON.stringify(cur,null,2):""}</textarea></div>
    <button class="primary" onclick="saveConfig()">Save & connect</button>
    ${firstRun?"":'<button class="ghost" onclick="closeSheet()">Cancel</button>'}`,true);
}
function saveConfig(){
  const raw=document.getElementById("cfgBox").value.trim();
  // Pull ONLY the config object out, even if the whole snippet (imports +
  // initializeApp lines) was pasted. Config has no nested braces, so grab the
  // brace group that actually contains the keys.
  let objText=null;
  const anchored=raw.match(/firebaseConfig\s*=\s*(\{[^{}]*\})/);
  if(anchored){ objText=anchored[1]; }
  else{
    const groups=raw.match(/\{[^{}]*\}/g)||[];
    objText=groups.find(g=>/projectId|apiKey/.test(g))||null;
  }
  if(!objText){ showToast("Couldn't find the config keys — paste the whole snippet"); return; }
  let cfg;
  // Function-eval handles unquoted keys like apiKey: "…"; JSON.parse is the fallback.
  try{ cfg=Function('"use strict";return ('+objText+')')(); }
  catch(e){ try{ cfg=JSON.parse(objText); }catch(e2){ showToast("That doesn't look like valid config"); return; } }
  if(!cfg||!cfg.projectId){ showToast("Missing projectId — copy the whole config block"); return; }
  localStorage.setItem("fb_config",JSON.stringify(cfg));
  closeSheet(); showToast("Connecting…"); initFirebase();
}

/* ============================================================
   Wire up + boot
   ============================================================ */
document.getElementById("settingsBtn").onclick=openSettings;
document.getElementById("optimizeBtn").onclick=optimize;
document.getElementById("rainBtn").onclick=rainDelay;
document.getElementById("search").addEventListener("input",renderList);
window.addEventListener("online",()=>{ if(docRef) setSync(true,"Synced"); });
window.addEventListener("offline",()=>setSync(false,"Offline — will sync when back online"));

render();
initFirebase();
loadWeather();
</script>
